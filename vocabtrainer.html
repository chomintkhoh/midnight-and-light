<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>UASA 华语词汇训练</title>
<style>
  :root{
    --bg:#f6f5f1;
    --panel:#ffffff;
    --ink:#2b2b2b;
    --ink-soft:#5c5c5c;
    --border:#e2ddd2;
    --accent:#3f6b52;
    --accent-dark:#2e5340;
    --accent-soft:#e7f0ea;
    --warn:#b5432c;
    --warn-soft:#fbe9e5;
    --good:#3f6b52;
    --good-soft:#e7f0ea;
    --star:#c9861a;
    --fire:#b5432c;
    --radius:14px;
    --gap:16px;
    --maxw:920px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Heiti SC",-apple-system,BlinkMacSystemFont,sans-serif;
    line-height:1.5;
    -webkit-text-size-adjust:100%;
    overflow-x:hidden;
    min-height:100vh;
  }
  #app{
    max-width:var(--maxw);
    margin:0 auto;
    padding:14px 14px 60px;
  }
  h1,h2,h3{margin:0 0 8px;}
  p{margin:0 0 10px;}
  button{
    font-family:inherit;
    cursor:pointer;
  }
  .hidden{display:none !important;}

  /* ---------- header ---------- */
  header.app-header{
    text-align:center;
    padding:14px 8px 18px;
  }
  header.app-header h1{
    font-size:clamp(20px,4.5vw,28px);
    color:var(--accent-dark);
  }
  header.app-header .sub{
    color:var(--ink-soft);
    font-size:clamp(13px,3vw,15px);
  }

  /* ---------- panels / cards ---------- */
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:16px;
  }

  /* ---------- main menu ---------- */
  .menu-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }
  @media (max-width:480px){
    .menu-grid{grid-template-columns:1fr;}
  }
  .menu-btn{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:4px;
    background:var(--panel);
    border:1.5px solid var(--border);
    border-radius:var(--radius);
    padding:18px 16px;
    min-height:88px;
    text-align:left;
    transition:border-color .15s, background .15s;
  }
  .menu-btn:hover, .menu-btn:focus-visible{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .menu-btn .m-title{
    font-size:clamp(16px,3.6vw,19px);
    font-weight:700;
    color:var(--accent-dark);
  }
  .menu-btn .m-desc{
    font-size:13px;
    color:var(--ink-soft);
  }

  .filter-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin-bottom:14px;
  }
  .filter-row label{
    font-size:13px;
    color:var(--ink-soft);
    margin-right:4px;
  }
  select{
    font-family:inherit;
    font-size:15px;
    padding:8px 10px;
    border-radius:10px;
    border:1.5px solid var(--border);
    background:#fff;
    min-height:40px;
  }
  .stat-line{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:6px;
  }

  /* ---------- generic action buttons ---------- */
  .btn{
    font-size:15px;
    padding:12px 18px;
    border-radius:12px;
    border:1.5px solid var(--border);
    background:#fff;
    color:var(--ink);
    min-height:46px;
    min-width:88px;
  }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:600;
  }
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-outline{
    background:#fff;
    border-color:var(--accent);
    color:var(--accent-dark);
  }
  .btn-warn{
    background:#fff;
    border-color:var(--warn);
    color:var(--warn);
  }
  .btn-ghost{
    background:transparent;
    border-color:transparent;
    color:var(--ink-soft);
    text-decoration:underline;
  }
  .btn-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:14px;
  }
  .btn-row.center{ justify-content:center; }

  /* ---------- top bar within a mode ---------- */
  .mode-topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
    gap:10px;
    flex-wrap:wrap;
  }
  .mode-topbar h2{
    font-size:clamp(18px,4vw,22px);
    color:var(--accent-dark);
  }

  .tag{
    display:inline-block;
    font-size:12px;
    padding:3px 9px;
    border-radius:999px;
    background:var(--accent-soft);
    color:var(--accent-dark);
    margin-right:6px;
    white-space:nowrap;
  }
  .tag.star{ background:#fbf1e0; color:var(--star); }
  .tag.fire{ background:var(--fire-soft,#fbe9e5); color:var(--fire); }

  /* ---------- flashcard ---------- */
  .flashcard{
    background:var(--panel);
    border:1.5px solid var(--border);
    border-radius:18px;
    padding:34px 20px;
    text-align:center;
    min-height:220px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .fc-word{
    font-size:clamp(40px,11vw,64px);
    font-weight:700;
    color:var(--accent-dark);
    letter-spacing:2px;
  }
  .fc-pinyin{
    font-size:clamp(16px,4vw,20px);
    color:var(--ink-soft);
  }
  .fc-labels{ margin-top:6px; }
  .fc-back{
    text-align:left;
    width:100%;
    margin-top:16px;
    padding-top:16px;
    border-top:1px dashed var(--border);
  }
  .fc-back h4{
    margin:0 0 4px;
    font-size:13px;
    color:var(--ink-soft);
    font-weight:600;
  }
  .fc-back .fc-block{ margin-bottom:12px; }
  .fc-back .fc-zh{ font-size:16px; }
  .fc-back .fc-en{ font-size:15px; color:var(--ink-soft); }
  .fc-back .fc-example{ font-size:15px; }
  .fc-example b{ color:var(--accent-dark); }

  /* ---------- quiz ---------- */
  .quiz-sentence{
    font-size:clamp(18px,4.6vw,22px);
    line-height:1.9;
    margin-bottom:18px;
  }
  .quiz-sentence .blank{
    display:inline-block;
    min-width:2.2em;
    border-bottom:3px solid var(--accent);
    color:var(--accent-dark);
    font-weight:700;
    text-align:center;
  }
  .quiz-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  @media (max-width:480px){
    .quiz-options{grid-template-columns:1fr;}
  }
  .opt-btn{
    font-size:17px;
    padding:16px 14px;
    border-radius:12px;
    border:1.5px solid var(--border);
    background:#fff;
    text-align:left;
    min-height:56px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .opt-btn .opt-letter{
    font-weight:700;
    color:var(--accent);
  }
  .opt-btn:hover{ border-color:var(--accent); }
  .opt-btn.correct{
    background:var(--good-soft);
    border-color:var(--good);
  }
  .opt-btn.wrong{
    background:var(--warn-soft);
    border-color:var(--warn);
  }
  .opt-btn[disabled]{ cursor:default; }

  .feedback-box{
    margin-top:16px;
    padding:14px 16px;
    border-radius:12px;
    background:var(--accent-soft);
    border:1px solid var(--border);
  }
  .feedback-box.wrong{
    background:var(--warn-soft);
  }
  .feedback-box .fb-title{
    font-weight:700;
    margin-bottom:6px;
  }
  .feedback-box.wrong .fb-title{ color:var(--warn); }
  .feedback-box:not(.wrong) .fb-title{ color:var(--good); }

  /* ---------- handwriting ---------- */
  .hw-type-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:14px;
  }
  .hw-type-btn{
    padding:9px 14px;
    border-radius:999px;
    border:1.5px solid var(--border);
    background:#fff;
    font-size:14px;
    min-height:40px;
  }
  .hw-type-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:600;
  }
  .hw-prompt{
    text-align:center;
    padding:14px 10px;
    margin-bottom:10px;
  }
  .hw-prompt .hw-main{
    font-size:clamp(22px,6vw,32px);
    font-weight:700;
    color:var(--accent-dark);
  }
  .hw-prompt .hw-sub{
    font-size:15px;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .hw-instruction{
    font-size:14px;
    color:var(--ink-soft);
    text-align:center;
    margin-bottom:10px;
  }
  .hw-hint-box{
    text-align:center;
    font-size:14px;
    color:var(--accent-dark);
    background:var(--accent-soft);
    border-radius:10px;
    padding:8px;
    margin-bottom:10px;
  }
  .hw-canvas-wrap{
    width:100%;
    display:flex;
    justify-content:center;
    margin-bottom:14px;
  }
  #hwCanvas{
    width:100%;
    max-width:640px;
    aspect-ratio:auto;
    background:#fffdf8;
    border:2px solid var(--accent);
    border-radius:10px;
    touch-action:none;
    display:block;
  }
  .hw-controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
  }
  .hw-answer-box{
    margin-top:16px;
    padding:16px;
    border-radius:12px;
    background:var(--accent-soft);
    text-align:center;
  }
  .hw-answer-box .ans-word{
    font-size:clamp(28px,7vw,40px);
    font-weight:700;
    color:var(--accent-dark);
  }
  .hw-answer-box .ans-detail{
    margin-top:8px;
    font-size:14px;
    color:var(--ink-soft);
    text-align:left;
  }
  .hw-selfcheck{
    margin-top:12px;
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .hw-selfcheck .btn.chosen{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }

  /* ---------- composition ---------- */
  .comp-word{
    text-align:center;
    font-size:clamp(30px,7vw,40px);
    font-weight:700;
    color:var(--accent-dark);
    margin-bottom:6px;
  }
  .comp-word-pinyin{
    text-align:center;
    color:var(--ink-soft);
    margin-bottom:14px;
  }
  .comp-scenario{
    background:var(--accent-soft);
    border-radius:12px;
    padding:14px;
    margin-bottom:14px;
    font-size:16px;
  }
  .comp-instruction{
    font-size:15px;
    margin-bottom:10px;
    color:var(--ink-soft);
  }
  textarea#compInput{
    width:100%;
    min-height:110px;
    font-size:17px;
    font-family:inherit;
    padding:12px;
    border-radius:12px;
    border:1.5px solid var(--border);
    resize:vertical;
  }
  .comp-check-result{
    margin-top:12px;
    padding:12px 14px;
    border-radius:12px;
    background:var(--accent-soft);
    font-size:15px;
  }
  .comp-check-result .check-line{
    margin-bottom:4px;
  }
  .comp-check-result .ok{ color:var(--good); font-weight:600; }
  .comp-check-result .bad{ color:var(--warn); font-weight:600; }
  .comp-reference{
    margin-top:14px;
    padding:14px;
    border-radius:12px;
    border:1px dashed var(--accent);
  }
  .comp-reference .ref-label{
    font-weight:700;
    color:var(--accent-dark);
    margin-bottom:4px;
    font-size:13px;
  }

  /* ---------- review mode ---------- */
  .review-status{
    font-size:14px;
    color:var(--ink-soft);
    margin-bottom:12px;
  }
  .empty-state{
    text-align:center;
    padding:36px 16px;
    color:var(--ink-soft);
  }
  .empty-state .big-emoji{
    font-size:40px;
    margin-bottom:10px;
  }

  /* ---------- confirm modal ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.4);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }
  .modal-box{
    background:#fff;
    border-radius:16px;
    padding:22px;
    max-width:360px;
    width:100%;
    text-align:center;
  }
  .modal-box p{ margin-bottom:18px; font-size:15px; }
  .modal-box .btn-row{ justify-content:center; margin-top:0; }

  .progress-note{
    font-size:12px;
    color:var(--ink-soft);
    text-align:center;
    margin-top:24px;
  }

  footer.app-footer{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    padding:20px 10px 6px;
  }
</style>
</head>
<body>
<div id="app">

  <header class="app-header">
    <h1>UASA 华语词汇训练</h1>
    <div class="sub">专为小六华语 UASA 阅读理解设计的词汇学习工具</div>
  </header>

  <!-- ============ 主菜单 MAIN MENU ============ -->
  <section id="screen-menu" class="screen">
    <div class="panel">
      <div class="filter-row">
        <label for="filterCategory">类别：</label>
        <select id="filterCategory"></select>
        <label for="filterDifficulty">难度：</label>
        <select id="filterDifficulty"></select>
      </div>
      <div class="stat-line" id="menuStatLine"></div>
    </div>

    <div class="menu-grid">
      <button class="menu-btn" data-mode="flashcard">
        <span class="m-title">1. 学习词卡</span>
        <span class="m-desc">认识词语的读音与意思</span>
      </button>
      <button class="menu-btn" data-mode="context">
        <span class="m-title">2. 情境选择</span>
        <span class="m-desc">在句子中选出正确的词语</span>
      </button>
      <button class="menu-btn" data-mode="confusable">
        <span class="m-title">3. 易混词挑战</span>
        <span class="m-desc">分辨容易混淆的词语</span>
      </button>
      <button class="menu-btn" data-mode="handwriting">
        <span class="m-title">4. 手写练习</span>
        <span class="m-desc">动手写出词语，加深记忆</span>
      </button>
      <button class="menu-btn" data-mode="composition">
        <span class="m-title">5. 作文应用</span>
        <span class="m-desc">练习用词语造句</span>
      </button>
      <button class="menu-btn" data-mode="review">
        <span class="m-title">6. 错词复习</span>
        <span class="m-desc">重点复习比较生疏的词语</span>
      </button>
    </div>

    <div class="btn-row center">
      <button class="btn btn-warn" id="btnResetProgress">重置学习记录</button>
    </div>
    <div class="progress-note">V1 版本 · 词汇数据为临时测试样本，正式词库将另行提供</div>
  </section>

  <!-- ============ MODE 1: 学习词卡 ============ -->
  <section id="screen-flashcard" class="screen hidden">
    <div class="mode-topbar">
      <h2>学习词卡</h2>
      <button class="btn btn-ghost" data-back="menu">← 返回主菜单</button>
    </div>
    <div class="panel">
      <div class="flashcard" id="fcCard">
        <div class="fc-word" id="fcWord">词语</div>
        <div class="fc-pinyin" id="fcPinyin">pīn yīn</div>
        <div class="fc-labels" id="fcLabels"></div>
        <div class="fc-back hidden" id="fcBack">
          <div class="fc-block">
            <h4>简单中文</h4>
            <div class="fc-zh" id="fcZh"></div>
          </div>
          <div class="fc-block">
            <h4>English</h4>
            <div class="fc-en" id="fcEn"></div>
          </div>
          <div class="fc-block">
            <h4>例句</h4>
            <div class="fc-example" id="fcExample"></div>
          </div>
        </div>
      </div>
      <div class="btn-row center" id="fcFlipRow">
        <button class="btn btn-primary" id="btnFcFlip">翻面查看</button>
      </div>
      <div class="btn-row center hidden" id="fcAfterRow">
        <button class="btn btn-primary" id="btnFcKnow">会了</button>
        <button class="btn btn-warn" id="btnFcRetry">再练一次</button>
        <button class="btn btn-outline" id="btnFcNext">下一张</button>
      </div>
    </div>
  </section>

  <!-- ============ MODE 2: 情境选择 ============ -->
  <section id="screen-context" class="screen hidden">
    <div class="mode-topbar">
      <h2>情境选择</h2>
      <button class="btn btn-ghost" data-back="menu">← 返回主菜单</button>
    </div>
    <div class="panel">
      <div class="quiz-sentence" id="ctxSentence"></div>
      <div class="quiz-options" id="ctxOptions"></div>
      <div class="feedback-box hidden" id="ctxFeedback"></div>
      <div class="btn-row center hidden" id="ctxNextRow">
        <button class="btn btn-primary" id="btnCtxNext">下一题</button>
      </div>
    </div>
  </section>

  <!-- ============ MODE 3: 易混词挑战 ============ -->
  <section id="screen-confusable" class="screen hidden">
    <div class="mode-topbar">
      <h2>易混词挑战</h2>
      <button class="btn btn-ghost" data-back="menu">← 返回主菜单</button>
    </div>
    <div class="panel" id="confusablePanel">
      <div class="quiz-sentence" id="cfSentence"></div>
      <div class="quiz-options" id="cfOptions"></div>
      <div class="feedback-box hidden" id="cfFeedback"></div>
      <div class="btn-row center hidden" id="cfNextRow">
        <button class="btn btn-primary" id="btnCfNext">下一题</button>
      </div>
    </div>
  </section>

  <!-- ============ MODE 4: 手写练习 ============ -->
  <section id="screen-handwriting" class="screen hidden">
    <div class="mode-topbar">
      <h2>手写练习</h2>
      <button class="btn btn-ghost" data-back="menu">← 返回主菜单</button>
    </div>
    <div class="panel">
      <div class="hw-type-row" id="hwTypeRow">
        <button class="hw-type-btn" data-hwtype="copy">抄写</button>
        <button class="hw-type-btn" data-hwtype="pinyin">看拼音</button>
        <button class="hw-type-btn" data-hwtype="meaning">看意思</button>
        <button class="hw-type-btn" data-hwtype="context">看情境</button>
      </div>
      <div class="hw-prompt" id="hwPrompt">
        <div class="hw-main" id="hwMain"></div>
        <div class="hw-sub" id="hwSub"></div>
      </div>
      <div class="hw-instruction" id="hwInstruction"></div>
      <div class="hw-hint-box hidden" id="hwHintBox"></div>
      <div class="hw-canvas-wrap">
        <canvas id="hwCanvas"></canvas>
      </div>
      <div class="hw-controls">
        <button class="btn" id="btnHwUndo">撤销</button>
        <button class="btn" id="btnHwClear">清除</button>
        <button class="btn btn-outline" id="btnHwHint">提示</button>
        <button class="btn btn-outline" id="btnHwReveal">看答案</button>
        <button class="btn btn-primary" id="btnHwNext">下一题</button>
      </div>
      <div class="hw-answer-box hidden" id="hwAnswerBox">
        <div class="ans-word" id="hwAnsWord"></div>
        <div class="ans-detail" id="hwAnsDetail"></div>
        <div class="hw-selfcheck">
          <button class="btn" id="btnHwGood">我会了</button>
          <button class="btn" id="btnHwBad">还不熟</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ MODE 5: 作文应用 ============ -->
  <section id="screen-composition" class="screen hidden">
    <div class="mode-topbar">
      <h2>作文应用</h2>
      <button class="btn btn-ghost" data-back="menu">← 返回主菜单</button>
    </div>
    <div class="panel" id="compPanel">
      <div class="comp-word" id="compWord"></div>
      <div class="comp-word-pinyin" id="compPinyin"></div>
      <div class="comp-scenario" id="compScenario"></div>
      <div class="comp-instruction" id="compInstruction"></div>
      <textarea id="compInput" placeholder="请在这里写一个完整的句子……"></textarea>
      <div class="btn-row">
        <button class="btn btn-primary" id="btnCompCheck">检查句子</button>
        <button class="btn btn-outline" id="btnCompNext">换一个词语</button>
      </div>
      <div class="comp-check-result hidden" id="compResult"></div>
      <div class="comp-reference hidden" id="compReference">
        <div class="ref-label">参考句（仅供参考，答案不唯一）</div>
        <div id="compReferenceText"></div>
      </div>
    </div>
  </section>

  <!-- ============ MODE 6: 错词复习 ============ -->
  <section id="screen-review" class="screen hidden">
    <div class="mode-topbar">
      <h2>错词复习</h2>

/* =========================================================================
   三、本地存储 STORAGE
   ------------------------------------------------------------------------
   进度数据结构（localStorage key: UASA_VOCAB_PROGRESS_V1）：
   {
     [wordId]: {
       weakness: number,     // 复习优先级 / 生疏程度，越高代表越需要复习
       correct: number,      // 答对次数
       incorrect: number,    // 答错次数
       familiar: boolean,    // 是否被标记为"会了"
       lastContextIndex: number,   // 上一次使用的情境句子下标
       lastPracticed: number       // 上一次练习的时间戳
     }
   }
   ========================================================================= */
  const STORAGE_KEY = "UASA_VOCAB_PROGRESS_V1";

  function loadProgress(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return {};
      const parsed = JSON.parse(raw);
      return (parsed && typeof parsed === "object") ? parsed : {};
    }catch(e){
      console.warn("读取学习记录失败，使用空记录", e);
      return {};
    }
  }

  function saveProgress(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    }catch(e){
      console.warn("保存学习记录失败", e);
    }
  }

  let progress = loadProgress();

  function getWordProgress(wordId){
    if(!progress[wordId]){
      progress[wordId] = { weakness:0, correct:0, incorrect:0, familiar:false, lastContextIndex:-1, lastPracticed:0 };
    }
    return progress[wordId];
  }

  function clampWeakness(v){
    return Math.max(0, Math.min(20, v));
  }

  // 各种练习结果对"生疏程度"的影响，集中管理，方便未来调整
  function markResult(wordId, kind){
    const p = getWordProgress(wordId);
    p.lastPracticed = Date.now();
    switch(kind){
      case "flashcard-know":      p.weakness = clampWeakness(p.weakness - 1); p.familiar = true; break;
      case "flashcard-retry":     p.weakness = clampWeakness(p.weakness + 2); p.familiar = false; break;
      case "context-correct":     p.weakness = clampWeakness(p.weakness - 1); p.correct++; break;
      case "context-incorrect":   p.weakness = clampWeakness(p.weakness + 3); p.incorrect++; break;
      case "confusable-correct":  p.weakness = clampWeakness(p.weakness - 1); p.correct++; break;
      case "confusable-incorrect":p.weakness = clampWeakness(p.weakness + 3); p.incorrect++; break;
      case "handwriting-good":    p.weakness = clampWeakness(p.weakness - 1); break;
      case "handwriting-bad":     p.weakness = clampWeakness(p.weakness + 2); break;
    }
    saveProgress();
  }

  function resetAllProgress(){
    progress = {};
    saveProgress();
  }

/* =========================================================================
   四、工具函数 UTILITIES
   ========================================================================= */
  function randInt(maxExclusive){ return Math.floor(Math.random() * maxExclusive); }

  function pickRandom(arr){ return arr[randInt(arr.length)]; }

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = randInt(i + 1);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // 记录最近出现过的词语，供"避免重复"逻辑使用
  const RECENT_HISTORY_LEN = 5;
  function pushRecentWord(wordId){
    state.recentWordIds.push(wordId);
    if(state.recentWordIds.length > RECENT_HISTORY_LEN){
      state.recentWordIds.shift();
    }
  }

/* =========================================================================
   五、词语筛选与选词逻辑 FILTER & WEIGHTED SELECTION
   ========================================================================= */
  function getFilteredPool(){
    return VOCAB_DATA.filter(w=>{
      const catOk = state.filterCategory === "全部" || w.category === state.filterCategory;
      const diffOk = state.filterDifficulty === "全部" || w.difficulty === state.filterDifficulty;
      return catOk && diffOk;
    });
  }

  // 加权随机选词：生疏程度越高，被抽到的机会越大；
  // 最近出现过的词语会被降低权重甚至排除，避免同一词语连续出现。
  function pickWeightedWord(pool, opts){
    opts = opts || {};
    let candidates = pool.slice();
    if(candidates.length === 0) return null;

    const lastId = state.recentWordIds[state.recentWordIds.length - 1];
    if(candidates.length > 1 && !opts.allowImmediateRepeat){
      const withoutLast = candidates.filter(w => w.id !== lastId);
      if(withoutLast.length > 0) candidates = withoutLast;
    }

    const weights = candidates.map(w=>{
      const p = getWordProgress(w.id);
      let weight = 1 + p.weakness * 1.5;
      const recentIndex = state.recentWordIds.indexOf(w.id);
      if(recentIndex !== -1){
        // 越近期出现过，权重被压得越低
        const recency = state.recentWordIds.length - recentIndex;
        weight = weight / (recency + 1);
      }
      return Math.max(weight, 0.05);
    });

    const total = weights.reduce((a,b)=>a+b, 0);
    let r = Math.random() * total;
    for(let i = 0; i < candidates.length; i++){
      r -= weights[i];
      if(r <= 0) return candidates[i];
    }
    return candidates[candidates.length - 1];
  }

  // 从某个词语的 5 个情境中，挑选一个"不是上一次用过"的情境，尽量让重复练习看到不同情境
  function pickContextIndex(word){
    const p = getWordProgress(word.id);
    const total = word.contexts.length;
    let candidates = [];
    for(let i = 0; i < total; i++){
      if(i !== p.lastContextIndex) candidates.push(i);
    }
    if(candidates.length === 0) candidates = [0];
    const idx = pickRandom(candidates);
    p.lastContextIndex = idx;
    saveProgress();
    return idx;
  }

  function buildBlankSentence(word, contextText){
    // 用全角下划线替换词语本身，生成挖空句子
    const blankHtml = '<span class="blank">' + "＿".repeat(Math.max(2, word.word.length)) + '</span>';
    return contextText.split(word.word).join(blankHtml);
  }

/* =========================================================================
   六、测验生成 QUIZ GENERATION（情境选择 & 易混词挑战 共用部分逻辑）
   ========================================================================= */

  // 为"情境选择"模式挑选干扰项：优先同类别，数量不足时从其他类别补足
  function pickContextDistractors(targetWord, count){
    const sameCategory = VOCAB_DATA.filter(w => w.id !== targetWord.id && w.category === targetWord.category);
    let pool = shuffle(sameCategory);
    if(pool.length < count){
      const others = shuffle(VOCAB_DATA.filter(w => w.id !== targetWord.id && w.category !== targetWord.category));
      pool = pool.concat(others);
    }
    return pool.slice(0, count);
  }

  // 为"易混词挑战"模式挑选干扰项：优先使用该词自己标记的 confusable 列表，
  // 数量不足时用同类别词语补足
  function pickConfusableDistractors(targetWord, count){
    const fromGroup = targetWord.confusable
      .map(w => VOCAB_BY_ID[Object.keys(VOCAB_BY_ID).find(id => VOCAB_BY_ID[id].word === w)])
      .filter(Boolean);
    let pool = shuffle(fromGroup);
    if(pool.length < count){
      const extra = pickContextDistractors(targetWord, count - pool.length)
        .filter(w => !pool.includes(w));
      pool = pool.concat(extra);
    }
    return pool.slice(0, count);
  }

  function getConfusablePool(){
    return getFilteredPool().filter(w => w.confusable && w.confusable.length > 0);
  }

  // 生成一道选择题的通用数据结构：{ word, contextText, options:[word,...], correctId }
  function buildChoiceQuestion(targetWord, distractors){
    const idx = pickContextIndex(targetWord);
    const contextText = targetWord.contexts[idx];
    const options = shuffle([targetWord].concat(distractors));
    return {
      wordId: targetWord.id,
      contextText: contextText,
      optionIds: options.map(w => w.id),
      correctId: targetWord.id
    };
  }

/* =========================================================================
   八、手写画布逻辑 HANDWRITING CANVAS
   ========================================================================= */
  const hwCanvas = document.getElementById("hwCanvas");
  const hwCtx = hwCanvas.getContext("2d");
  let hwStrokes = [];        // 已完成的笔画，每个笔画是一个 {x,y} 点的数组
  let hwCurrentStroke = null;
  let hwDrawing = false;
  let hwCellCount = 2;
  let hwCellSize = 150;

  function resizeHwCanvas(){
    const wrap = hwCanvas.parentElement;
    const wrapWidth = wrap.clientWidth || 320;
    let cell = wrapWidth / hwCellCount;
    cell = Math.max(70, Math.min(220, cell));
    hwCellSize = cell;
    const cssWidth = cell * hwCellCount;
    const cssHeight = cell;
    const dpr = window.devicePixelRatio || 1;
    hwCanvas.style.width = cssWidth + "px";
    hwCanvas.style.height = cssHeight + "px";
    hwCanvas.width = Math.round(cssWidth * dpr);
    hwCanvas.height = Math.round(cssHeight * dpr);
    hwCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redrawHwCanvas();
  }

  function drawHwGrid(){
    const w = hwCellSize * hwCellCount;
    const h = hwCellSize;
    hwCtx.clearRect(0, 0, w, h);
    hwCtx.fillStyle = "#fffdf8";
    hwCtx.fillRect(0, 0, w, h);
    hwCtx.save();
    hwCtx.strokeStyle = "#c9c2b0";
    hwCtx.lineWidth = 1.5;
    for(let i = 0; i <= hwCellCount; i++){
      const x = i * hwCellSize;
      hwCtx.beginPath();
      hwCtx.moveTo(x, 0);
      hwCtx.lineTo(x, h);
      hwCtx.stroke();
    }
    hwCtx.beginPath();
    hwCtx.moveTo(0, 0); hwCtx.lineTo(w, 0);
    hwCtx.moveTo(0, h); hwCtx.lineTo(w, h);
    hwCtx.stroke();
    // 田字格：每一格画出十字虚线
    hwCtx.setLineDash([5, 6]);
    hwCtx.strokeStyle = "#d8cdb0";
    hwCtx.lineWidth = 1;
    for(let i = 0; i < hwCellCount; i++){
      const cx = i * hwCellSize + hwCellSize / 2;
      const cy = hwCellSize / 2;
      hwCtx.beginPath();
      hwCtx.moveTo(i * hwCellSize, cy);
      hwCtx.lineTo(i * hwCellSize + hwCellSize, cy);
      hwCtx.moveTo(cx, 0);
      hwCtx.lineTo(cx, hwCellSize);
      hwCtx.stroke();
    }
    hwCtx.setLineDash([]);
    hwCtx.restore();
  }

  function drawStroke(stroke){
    if(stroke.length < 2){
      if(stroke.length === 1){
        hwCtx.beginPath();
        hwCtx.arc(stroke[0].x, stroke[0].y, 3, 0, Math.PI*2);
        hwCtx.fillStyle = "#2b2b2b";
        hwCtx.fill();
      }
      return;
    }
    hwCtx.beginPath();
    hwCtx.moveTo(stroke[0].x, stroke[0].y);
    for(let i = 1; i < stroke.length; i++){
      hwCtx.lineTo(stroke[i].x, stroke[i].y);
    }
    hwCtx.strokeStyle = "#2b2b2b";
    hwCtx.lineWidth = 5;
    hwCtx.lineCap = "round";
    hwCtx.lineJoin = "round";
    hwCtx.stroke();
  }

  function redrawHwCanvas(){
    drawHwGrid();
    hwStrokes.forEach(drawStroke);
  }

  function setHwCellCount(count){
    hwCellCount = Math.max(1, count);
    resizeHwCanvas();
  }

  function getPointerPos(e){
    const rect = hwCanvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  hwCanvas.addEventListener("pointerdown", function(e){
    e.preventDefault();
    hwDrawing = true;
    hwCurrentStroke = [getPointerPos(e)];
    try{ hwCanvas.setPointerCapture(e.pointerId); }catch(err){}
  }, {passive:false});

  hwCanvas.addEventListener("pointermove", function(e){
    if(!hwDrawing) return;
    e.preventDefault();
    const pos = getPointerPos(e);
    hwCurrentStroke.push(pos);
    redrawHwCanvas();
    drawStroke(hwCurrentStroke);
  }, {passive:false});

  function endHwStroke(e){
    if(!hwDrawing) return;
    hwDrawing = false;
    if(hwCurrentStroke && hwCurrentStroke.length > 0){
      hwStrokes.push(hwCurrentStroke);
    }
    hwCurrentStroke = null;
  }
  hwCanvas.addEventListener("pointerup", endHwStroke);
  hwCanvas.addEventListener("pointercancel", endHwStroke);
  hwCanvas.addEventListener("pointerleave", function(e){
    if(hwDrawing) endHwStroke(e);
  });
  // 防止在手写画布内滑动时页面跟着滚动（画布外不受影响）
  hwCanvas.addEventListener("touchmove", function(e){ e.preventDefault(); }, {passive:false});

  function hwUndo(){
    hwStrokes.pop();
    redrawHwCanvas();
  }
  function hwClear(){
    hwStrokes = [];
    redrawHwCanvas();
  }

  window.addEventListener("resize", ()=>{ if(state.currentMode === "handwriting") resizeHwCanvas(); });
  window.addEventListener("orientationchange", ()=>{ if(state.currentMode === "handwriting") setTimeout(resizeHwCanvas, 200); });

/* =========================================================================
   九、渲染函数与页面切换 RENDERING & NAVIGATION
   ========================================================================= */
  const screens = {
    menu: document.getElementById("screen-menu"),
    flashcard: document.getElementById("screen-flashcard"),
    context: document.getElementById("screen-context"),
    confusable: document.getElementById("screen-confusable"),
    handwriting: document.getElementById("screen-handwriting"),
    composition: document.getElementById("screen-composition"),
    review: document.getElementById("screen-review")
  };

  function showScreen(name){
    Object.keys(screens).forEach(key=>{
      screens[key].classList.toggle("hidden", key !== name);
    });
    state.currentMode = name === "menu" ? null : name;
    window.scrollTo({top:0, behavior:"instant" in window ? "instant" : "auto"});
  }

  function goToMenu(){
    updateMenuStats();
    showScreen("menu");
  }

  function updateMenuStats(){
    const pool = getFilteredPool();
    const weakCount = pool.filter(w => getWordProgress(w.id).weakness > 0).length;
    document.getElementById("menuStatLine").textContent =
      "当前筛选下共有 " + pool.length + " 个词语，其中 " + weakCount + " 个需要加强复习。";
  }

  function populateFilters(){
    const catSel = document.getElementById("filterCategory");
    const diffSel = document.getElementById("filterDifficulty");
    catSel.innerHTML = "";
    diffSel.innerHTML = "";
    ["全部"].concat(CATEGORIES).forEach(c=>{
      const opt = document.createElement("option");
      opt.value = c; opt.textContent = c;
      catSel.appendChild(opt);
    });
    ["全部"].concat(DIFFICULTIES).forEach(d=>{
      const opt = document.createElement("option");
      opt.value = d; opt.textContent = d;
      diffSel.appendChild(opt);
    });
    catSel.value = state.filterCategory;
    diffSel.value = state.filterDifficulty;
    catSel.addEventListener("change", ()=>{ state.filterCategory = catSel.value; updateMenuStats(); });
    diffSel.addEventListener("change", ()=>{ state.filterDifficulty = diffSel.value; updateMenuStats(); });
  }

  /* ---------- 模式 1：学习词卡 ---------- */
  function enterFlashcardMode(){
    showScreen("flashcard");
    nextFlashcard();
  }
  function nextFlashcard(){
    const pool = getFilteredPool();
    const word = pickWeightedWord(pool);
    document.getElementById("fcBack").classList.add("hidden");
    document.getElementById("fcAfterRow").classList.add("hidden");
    document.getElementById("fcFlipRow").classList.remove("hidden");
    if(!word){
      document.getElementById("fcWord").textContent = "暂无符合条件的词语";
      document.getElementById("fcPinyin").textContent = "请调整筛选条件";
      document.getElementById("fcLabels").innerHTML = "";
      state.flashcard.wordId = null;
      return;
    }
    pushRecentWord(word.id);
    state.flashcard.wordId = word.id;
    state.flashcard.flipped = false;
    document.getElementById("fcWord").textContent = word.word;
    document.getElementById("fcPinyin").textContent = word.pinyin;
    document.getElementById("fcLabels").innerHTML = renderLabelsHtml(word);
  }
  function flipFlashcard(){
    const word = VOCAB_BY_ID[state.flashcard.wordId];
    if(!word) return;
    const example = pickRandom(word.contexts);
    document.getElementById("fcZh").textContent = word.meaningZh;
    document.getElementById("fcEn").textContent = word.meaningEn;
    document.getElementById("fcExample").innerHTML = example.split(word.word).join("<b>" + word.word + "</b>");
    document.getElementById("fcBack").classList.remove("hidden");
    document.getElementById("fcFlipRow").classList.add("hidden");
    document.getElementById("fcAfterRow").classList.remove("hidden");
    state.flashcard.flipped = true;
  }

  /* ---------- 模式 2：情境选择 ---------- */
  function enterContextMode(){
    showScreen("context");
    nextContextQuestion();
  }
  function nextContextQuestion(){
    document.getElementById("ctxFeedback").classList.add("hidden");
    document.getElementById("ctxNextRow").classList.add("hidden");
    const pool = getFilteredPool();
    const word = pickWeightedWord(pool);
    const optionsWrap = document.getElementById("ctxOptions");
    if(!word || pool.length < 2){
      document.getElementById("ctxSentence").textContent = "当前筛选下的词语数量不足，无法出题，请调整筛选条件。";
      optionsWrap.innerHTML = "";
      return;
    }
    pushRecentWord(word.id);
    const distractors = pickContextDistractors(word, 3);
    const q = buildChoiceQuestion(word, distractors);
    state.context = Object.assign(q, {answered:false});
    renderChoiceQuestion(q, "ctxSentence", "ctxOptions", onContextAnswer);
  }
  function onContextAnswer(word, isCorrect){
    markResult(word.id, isCorrect ? "context-correct" : "context-incorrect");
    const fb = document.getElementById("ctxFeedback");
    fb.classList.remove("hidden");
    fb.classList.toggle("wrong", !isCorrect);
    if(isCorrect){
      fb.innerHTML = '<div class="fb-title">回答正确！</div>';
    }else{
      fb.innerHTML = wrongAnswerFeedbackHtml(word);
    }
    document.getElementById("ctxNextRow").classList.remove("hidden");
    updateMenuStats();
  }

  /* ---------- 模式 3：易混词挑战 ---------- */
  function enterConfusableMode(){
    showScreen("confusable");
    nextConfusableQuestion();
  }
  function nextConfusableQuestion(){
    document.getElementById("cfFeedback").classList.add("hidden");
    document.getElementById("cfNextRow").classList.add("hidden");
    const pool = getConfusablePool();
    const optionsWrap = document.getElementById("cfOptions");
    if(pool.length === 0){
      document.getElementById("cfSentence").innerHTML =
        "当前筛选条件下没有设定「易混词」的词语。<br>请选择「全部」类别 / 难度，或稍后加入更多词汇数据。";
      optionsWrap.innerHTML = "";
      return;
    }
    const word = pickWeightedWord(pool);
    pushRecentWord(word.id);
    const distractors = pickConfusableDistractors(word, 3);
    const q = buildChoiceQuestion(word, distractors);
    state.confusable = Object.assign(q, {answered:false});
    renderChoiceQuestion(q, "cfSentence", "cfOptions", onConfusableAnswer);
  }
  function onConfusableAnswer(word, isCorrect){
    markResult(word.id, isCorrect ? "confusable-correct" : "confusable-incorrect");
    const fb = document.getElementById("cfFeedback");
    fb.classList.remove("hidden");
    fb.classList.toggle("wrong", !isCorrect);
    if(isCorrect){
      fb.innerHTML = '<div class="fb-title">判断正确！</div>';
    }else{
      fb.innerHTML = wrongAnswerFeedbackHtml(word);
    }
    document.getElementById("cfNextRow").classList.remove("hidden");
    updateMenuStats();
  }

  // 情境选择 / 易混词挑战 共用的选择题渲染函数
  function renderChoiceQuestion(q, sentenceElId, optionsElId, onAnswer){
    const targetWord = VOCAB_BY_ID[q.wordId];
    document.getElementById(sentenceElId).innerHTML = buildBlankSentence(targetWord, q.contextText);
    const optionsWrap = document.getElementById(optionsElId);
    optionsWrap.innerHTML = "";
    const letters = ["A","B","C","D"];
    q.optionIds.forEach((id, i)=>{
      const optWord = VOCAB_BY_ID[id];
      const btn = document.createElement("button");
      btn.className = "opt-btn";
      btn.innerHTML = '<span class="opt-letter">' + letters[i] + '.</span><span>' + optWord.word + '</span>';
      btn.addEventListener("click", ()=>{
        if(q.answered) return;
        q.answered = true;
        const isCorrect = id === q.correctId;
        Array.from(optionsWrap.children).forEach(child=> child.setAttribute("disabled","disabled"));
        btn.classList.add(isCorrect ? "correct" : "wrong");
        if(!isCorrect){
          const correctBtn = Array.from(optionsWrap.children).find((c,idx2)=> q.optionIds[idx2] === q.correctId);
          if(correctBtn) correctBtn.classList.add("correct");
        }
        onAnswer(targetWord, isCorrect);
      });
      optionsWrap.appendChild(btn);
    });
  }

  /* ---------- 模式 4：手写练习 ---------- */
  const HW_TYPE_INFO = {
    copy:    { instruction:"请照着词语写一遍。" },
    pinyin:  { instruction:"请根据拼音，写出这个词语。" },
    meaning: { instruction:"请根据意思，写出这个词语。" },
    context: { instruction:"请根据情境，写出合适的词语。" }
  };

  function enterHandwritingMode(){
    showScreen("handwriting");
    setHwActiveTypeButtons();
    nextHandwritingQuestion();
  }

  function setHwActiveTypeButtons(){
    document.querySelectorAll(".hw-type-btn").forEach(btn=>{
      btn.classList.toggle("active", btn.dataset.hwtype === state.handwriting.type);
    });
  }

  function setHwType(type){
    state.handwriting.type = type;
    setHwActiveTypeButtons();
    nextHandwritingQuestion();
  }

  function nextHandwritingQuestion(){
    document.getElementById("hwHintBox").classList.add("hidden");
    document.getElementById("hwHintBox").textContent = "";
    document.getElementById("hwAnswerBox").classList.add("hidden");
    state.handwriting.revealed = false;
    state.handwriting.selfChecked = false;
    state.handwriting.hintShown = false;

    const pool = getFilteredPool();
    const word = pickWeightedWord(pool);
    if(!word){
      document.getElementById("hwMain").textContent = "暂无符合条件的词语";
      document.getElementById("hwSub").textContent = "请调整筛选条件";
      document.getElementById("hwInstruction").textContent = "";
      return;
    }
    pushRecentWord(word.id);
    state.handwriting.wordId = word.id;

    setHwCellCount(Array.from(word.word).length);
    hwClear();

    const type = state.handwriting.type;
    document.getElementById("hwInstruction").textContent = HW_TYPE_INFO[type].instruction;
    const mainEl = document.getElementById("hwMain");
    const subEl = document.getElementById("hwSub");
    if(type === "copy"){
      mainEl.textContent = word.word;
      subEl.textContent = "";
    }else if(type === "pinyin"){
      mainEl.textContent = word.pinyin;
      subEl.textContent = "";
    }else if(type === "meaning"){
      mainEl.textContent = "";
      subEl.textContent = word.meaningZh;
    }else if(type === "context"){
      mainEl.textContent = "";
      const idx = pickContextIndex(word);
      subEl.innerHTML = buildBlankSentence(word, word.contexts[idx]);
    }
  }

  function getHwHintHtml(word, type){
    const showEnglish = word.difficulty === "基础";
    if(type === "pinyin"){
      return "简单中文：" + word.meaningZh + (showEnglish ? "　English: " + word.meaningEn : "");
    }else if(type === "meaning"){
      return "拼音：" + word.pinyin + (showEnglish ? "　English: " + word.meaningEn : "");
    }else{
      return "拼音：" + word.pinyin + "　简单中文：" + word.meaningZh;
    }
  }

  function toggleHwHint(){
    const word = VOCAB_BY_ID[state.handwriting.wordId];
    if(!word) return;
    const box = document.getElementById("hwHintBox");
    state.handwriting.hintShown = !state.handwriting.hintShown;
    if(state.handwriting.hintShown){
      box.innerHTML = getHwHintHtml(word, state.handwriting.type);
      box.classList.remove("hidden");
    }else{
      box.classList.add("hidden");
    }
  }

  function revealHwAnswer(){
    const word = VOCAB_BY_ID[state.handwriting.wordId];
    if(!word) return;
    state.handwriting.revealed = true;
    const example = pickRandom(word.contexts);
    document.getElementById("hwAnsWord").textContent = word.word;
    document.getElementById("hwAnsDetail").innerHTML =
      "拼音：" + word.pinyin + "<br>简单中文：" + word.meaningZh +
      "<br>English：" + word.meaningEn +
      "<br>例句：" + example.split(word.word).join("<b>" + word.word + "</b>");
    const box = document.getElementById("hwAnswerBox");
    box.classList.remove("hidden");
    document.getElementById("btnHwGood").classList.remove("chosen");
    document.getElementById("btnHwGood").disabled = false;
    document.getElementById("btnHwBad").classList.remove("chosen");
    document.getElementById("btnHwBad").disabled = false;
  }

  function hwSelfCheck(kind){
    if(state.handwriting.selfChecked) return;
    const word = VOCAB_BY_ID[state.handwriting.wordId];
    if(!word) return;
    state.handwriting.selfChecked = true;
    markResult(word.id, kind === "good" ? "handwriting-good" : "handwriting-bad");
    document.getElementById("btnHwGood").classList.toggle("chosen", kind === "good");
    document.getElementById("btnHwBad").classList.toggle("chosen", kind === "bad");
    document.getElementById("btnHwGood").disabled = true;
    document.getElementById("btnHwBad").disabled = true;
    updateMenuStats();
  }

  /* ---------- 模式 5：作文应用 ---------- */
  function enterCompositionMode(){
    showScreen("composition");
    nextCompositionQuestion();
  }
  function getCompositionPool(){
    return getFilteredPool().filter(w => w.writingUseful && w.writingPrompt);
  }
  function nextCompositionQuestion(){
    document.getElementById("compResult").classList.add("hidden");
    document.getElementById("compReference").classList.add("hidden");
    document.getElementById("compInput").value = "";
    const pool = getCompositionPool();
    const word = pickWeightedWord(pool, {allowImmediateRepeat:false});
    if(!word){
      document.getElementById("compWord").textContent = "暂无可用词语";
      document.getElementById("compPinyin").textContent = "";
      document.getElementById("compScenario").textContent = "当前筛选条件下没有适合造句练习的词语，请调整筛选条件（例如选择「全部」类别）。";
      document.getElementById("compInstruction").textContent = "";
      state.composition.wordId = null;
      return;
    }
    pushRecentWord(word.id);
    state.composition.wordId = word.id;
    state.composition.checked = false;
    document.getElementById("compWord").textContent = word.word;
    document.getElementById("compPinyin").textContent = word.pinyin;
    document.getElementById("compScenario").textContent = "情境：" + word.writingPrompt;
    document.getElementById("compInstruction").textContent = "请用“" + word.word + "”写一个完整的句子。";
  }
  function checkComposition(){
    const word = VOCAB_BY_ID[state.composition.wordId];
    if(!word) return;
    const text = document.getElementById("compInput").value.trim();
    const containsWord = text.indexOf(word.word) !== -1;
    const longEnough = Array.from(text).length >= Math.max(8, Array.from(word.word).length + 4);
    const resultBox = document.getElementById("compResult");
    resultBox.classList.remove("hidden");
    resultBox.innerHTML =
      '<div class="check-line ' + (containsWord ? "ok" : "bad") + '">' +
        (containsWord ? "✓ 句子中使用了「" + word.word + "」" : "✗ 句子中还没有出现「" + word.word + "」") +
      '</div>' +
      '<div class="check-line ' + (longEnough ? "ok" : "bad") + '">' +
        (longEnough ? "✓ 句子长度合适" : "✗ 句子有点太短了，请写一个更完整的句子") +
      '</div>';
    const refBox = document.getElementById("compReference");
    refBox.classList.remove("hidden");
    document.getElementById("compReferenceText").textContent = word.writingExample;
    state.composition.checked = true;
  }

  /* ---------- 模式 6：错词复习 ---------- */
  function getWeakWords(){
    return getFilteredPool().filter(w => getWordProgress(w.id).weakness > 0);
  }
  function enterReviewMode(){
    showScreen("review");
    nextReviewQuestion();
  }
  function nextReviewQuestion(){
    document.getElementById("revFeedback").classList.add("hidden");
    document.getElementById("revNextRow").classList.add("hidden");
    const weakWords = getWeakWords();
    document.getElementById("reviewStatus").textContent =
      "当前筛选下需要加强复习的词语：" + weakWords.length + " 个";
    if(weakWords.length === 0){
      document.getElementById("reviewEmptyState").classList.remove("hidden");
      document.getElementById("reviewQuizArea").classList.add("hidden");
      return;
    }
    document.getElementById("reviewEmptyState").classList.add("hidden");
    document.getElementById("reviewQuizArea").classList.remove("hidden");
    const word = pickWeightedWord(weakWords);
    pushRecentWord(word.id);
    const distractors = pickContextDistractors(word, 3);
    const q = buildChoiceQuestion(word, distractors);
    state.review = Object.assign(q, {answered:false});
    renderChoiceQuestion(q, "revSentence", "revOptions", onReviewAnswer);
  }
  function onReviewAnswer(word, isCorrect){
    markResult(word.id, isCorrect ? "context-correct" : "context-incorrect");
    const fb = document.getElementById("revFeedback");
    fb.classList.remove("hidden");
    fb.classList.toggle("wrong", !isCorrect);
    if(isCorrect){
      fb.innerHTML = '<div class="fb-title">回答正确！生疏程度已降低。</div>';
    }else{
      fb.innerHTML = wrongAnswerFeedbackHtml(word);
    }
    document.getElementById("revNextRow").classList.remove("hidden");
  }

/* =========================================================================
   十、重置学习记录确认框 CONFIRM MODAL
   ========================================================================= */
  function showResetConfirm(){
    const root = document.getElementById("modalRoot");
    root.innerHTML =
      '<div class="modal-overlay" id="resetOverlay">' +
        '<div class="modal-box">' +
          '<h3>重置学习记录</h3>' +
          '<p>这将清除所有词语的复习进度、答题记录与「会了」标记，且无法恢复。确定要继续吗？</p>' +
          '<div class="btn-row">' +
            '<button class="btn btn-warn" id="btnConfirmReset">确认清除</button>' +
            '<button class="btn btn-outline" id="btnCancelReset">取消</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.getElementById("btnConfirmReset").addEventListener("click", ()=>{
      resetAllProgress();
      root.innerHTML = "";
      updateMenuStats();
    });
    document.getElementById("btnCancelReset").addEventListener("click", ()=>{
      root.innerHTML = "";
    });
  }

/* =========================================================================
   十一、事件绑定与初始化 EVENT BINDING & INIT
   ========================================================================= */
  function bindEvents(){
    // 主菜单：模式按钮
    document.querySelectorAll(".menu-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const mode = btn.dataset.mode;
        if(mode === "flashcard") enterFlashcardMode();
        else if(mode === "context") enterContextMode();
        else if(mode === "confusable") enterConfusableMode();
        else if(mode === "handwriting") enterHandwritingMode();
        else if(mode === "composition") enterCompositionMode();
        else if(mode === "review") enterReviewMode();
      });
    });
    // 各模式页面的"返回主菜单"
    document.querySelectorAll('[data-back="menu"]').forEach(btn=>{
      btn.addEventListener("click", goToMenu);
    });
    document.getElementById("btnResetProgress").addEventListener("click", showResetConfirm);

    // 模式 1：学习词卡
    document.getElementById("btnFcFlip").addEventListener("click", flipFlashcard);
    document.getElementById("btnFcKnow").addEventListener("click", ()=>{
      if(state.flashcard.wordId) markResult(state.flashcard.wordId, "flashcard-know");
      updateMenuStats();
      nextFlashcard();
    });
    document.getElementById("btnFcRetry").addEventListener("click", ()=>{
      if(state.flashcard.wordId) markResult(state.flashcard.wordId, "flashcard-retry");
      updateMenuStats();
      nextFlashcard();
    });
    document.getElementById("btnFcNext").addEventListener("click", nextFlashcard);

    // 模式 2：情境选择
    document.getElementById("btnCtxNext").addEventListener("click", nextContextQuestion);

    // 模式 3：易混词挑战
    document.getElementById("btnCfNext").addEventListener("click", nextConfusableQuestion);

    // 模式 4：手写练习
    document.querySelectorAll(".hw-type-btn").forEach(btn=>{
      btn.addEventListener("click", ()=> setHwType(btn.dataset.hwtype));
    });
    document.getElementById("btnHwUndo").addEventListener("click", hwUndo);
    document.getElementById("btnHwClear").addEventListener("click", hwClear);
    document.getElementById("btnHwHint").addEventListener("click", toggleHwHint);
    document.getElementById("btnHwReveal").addEventListener("click", revealHwAnswer);
    document.getElementById("btnHwNext").addEventListener("click", nextHandwritingQuestion);
    document.getElementById("btnHwGood").addEventListener("click", ()=> hwSelfCheck("good"));
    document.getElementById("btnHwBad").addEventListener("click", ()=> hwSelfCheck("bad"));

    // 模式 5：作文应用
    document.getElementById("btnCompCheck").addEventListener("click", checkComposition);
    document.getElementById("btnCompNext").addEventListener("click", nextCompositionQuestion);

    // 模式 6：错词复习
    document.getElementById("btnRevNext").addEventListener("click", nextReviewQuestion);
  }

  function init(){
    populateFilters();
    bindEvents();
    updateMenuStats();
    showScreen("menu");
  }

  init();
</script>
</body>
</html>
