<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta property="og:title" content="Contact a Japanese & Mandarin Tutor | Midnight & Light" />
<meta property="og:description" content="Interested in learning Japanese or Mandarin? Get in touch to discuss your level, learning goals, and preferred lesson format." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://chomintkhoh.github.io/midnight-and-light/contact.html" />

<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="Contact a Japanese & Mandarin Tutor | Midnight & Light" />
<meta name="twitter:description" content="Interested in learning Japanese or Mandarin? Get in touch to discuss your level, learning goals, and preferred lesson format." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Serif+TC:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="cosmic.css" />
<style>
  .contact-lead{
    font-size: clamp(19px,2.4vw,23px); font-weight:400; color:var(--warm-white);
    line-height:1.5; max-width:520px; margin-bottom:44px;
  }
  form.contact-form{ display:flex; flex-direction:column; gap:20px; max-width:520px; }
  .field{ display:flex; flex-direction:column; gap:7px; }
  .field label{
    font-size:12px; letter-spacing:0.06em; color:var(--muted-bluegrey); text-transform:uppercase;
  }
  .field input, .field select, .field textarea{
    background: rgba(244,241,234,0.04);
    border: 1px solid rgba(244,241,234,0.16);
    border-radius: 6px; padding: 12px 14px;
    font-family: inherit; font-size: 14.5px; color: var(--warm-white);
    outline: none; resize: vertical;
    transition: border-color .2s, background .2s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    border-color: var(--pale-gold); background: rgba(244,241,234,0.07);
  }
  .field select{ appearance:none; cursor:pointer; }
  .field select option{ background:#171938; color:var(--warm-white); }
  .radio-row{ display:flex; gap:22px; flex-wrap:wrap; }
  .radio-row label{
    display:flex; align-items:center; gap:8px;
    font-size:14px; color:var(--warm-white); text-transform:none; letter-spacing:0;
  }
  .radio-row input{ width:auto; accent-color:var(--pale-gold); }

  .btn-send{
    align-self:flex-start; margin-top:6px;
    font-size:14px; font-weight:500; letter-spacing:0.03em;
    color: var(--bg-deep); background: var(--warm-white);
    padding: 13px 30px; border-radius: 6px; border:none;
    transition: opacity .2s, transform .2s;
  }
  .btn-send:hover{ opacity:.88; transform:translateY(-1px); }
</style>
</head>
<body>
  <div class="stars" aria-hidden="true" data-density="14"></div>

  <nav class="site-nav">
    <a class="nav-mark" href="index.html">夜與光</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="lessons.html">Lessons</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </div>
  </nav>

  <main class="page">
    <p class="page-eyebrow">Contact</p>
    <h1 class="contact-lead">Interested in learning Japanese or Mandarin?<br />Tell me a little about what you would like to learn.</h1>

    <form class="contact-form" action="https://formspree.io/f/mrejokpw" method="POST">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />
      </div>

      <div class="field">
        <label for="language">Language</label>
        <select id="language" name="language" required>
          <option value="">Select one</option>
          <option value="Japanese">Japanese</option>
          <option value="Mandarin">Mandarin</option>
        </select>
      </div>

      <div class="field">
        <label for="level">Current Level</label>
        <input type="text" id="level" name="level" placeholder="e.g. Complete beginner" />
      </div>

      <div class="field">
        <label>Preferred Format</label>
        <div class="radio-row">
          <label><input type="radio" name="format" value="1-to-1" /> 1-to-1</label>
          <label><input type="radio" name="format" value="Small group" /> Small group</label>
        </div>
      </div>

      <div class="field">
        <label>Preferred Location</label>
        <div class="radio-row">
          <label><input type="radio" name="location" value="Online" /> Online</label>
          <label><input type="radio" name="location" value="In-person" /> In-person</label>
        </div>
      </div>

      <div class="field">
        <label for="goal">What would you like to learn or improve?</label>
        <input type="text" id="goal" name="goal" placeholder="What would you like to improve?" />
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4"></textarea>
      </div>

      <button class="btn-send" type="submit">Send</button>
    </form>
  </main>

  <footer class="site-footer">夜與光 · Midnight &amp; Light</footer>

  <script src="stars.js"></script>
</body>
</html>
