<style>*{box-sizing:border-box}body{margin:0;background:#f5f6fb;color:#20243a;font-family:Arial,"Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer}.app{max-width:800px;margin:auto;padding:16px}h1{margin:10px 0 4px;font-size:clamp(25px,6vw,38px)}.sub{color:#6d7489;margin-top:0}.card{background:white;border:1px solid #dde1ec;border-radius:20px;padding:18px;box-shadow:0 8px 25px #2222}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pick{padding:18px 8px;border:1px solid #d8ddea;background:#fff;border-radius:15px;font-weight:700}.pick small{display:block;color:#777;font-weight:400;margin-top:6px}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center}.home{border:0;border-radius:10px;padding:9px 12px}.progress{height:8px;background:#e8eaf1;border-radius:10px;margin:14px 0;overflow:hidden}.bar{height:100%;background:#555f8a}.q{font-size:clamp(25px,7vw,42px);font-weight:800;text-align:center;padding:24px 5px}.scene{font-size:clamp(18px,4vw,24px);line-height:1.7;background:#f6f7fb;padding:18px;border-radius:14px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.ans{padding:13px;border:1px solid #d8ddea;border-radius:12px;background:#fafbfe}.good{background:#e5f4e9!important}.bad{background:#fbe6e6!important}.feedback{text-align:center;font-weight:bold;min-height:26px;margin:12px}.next{width:100%;border:0;border-radius:12px;background:#343b67;color:white;padding:13px}.write{text-align:center}.big{font-size:52px;font-weight:800}.padbox{border:1px solid #d8ddea;padding:10px;border-radius:14px;margin:12px 0}canvas{display:block;width:100%;height:300px;touch-action:none;background:linear-gradient(#ddd 1px,transparent 1px),linear-gradient(90deg,#ddd 1px,transparent 1px);background-size:50% 50%}.tools{display:flex;gap:8px}.tools button{border:0;padding:10px;border-radius:10px}@media(max-width:600px){.grid,.answers{grid-template-columns:1fr}.app{padding:10px}}

/* ===== Game Skin V4 ===== */

@keyframes correctPop{0%{transform:scale(.96)}55%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}70%{transform:translateX(5px)}}

.heart-hit{animation:heartDrop .3s ease}
@media(max-width:600px){
  body{background:linear-gradient(145deg,#f7f4ee,#f0eef7)}

<script>
const G={"feeling": {"title": "心情 Feeling", "icon": "☺", "words": [["委屈", "wěi qū", "feel wronged"], ["后悔", "hòu huǐ", "regret"], ["感激", "gǎn jī", "grateful"], ["感动", "gǎn dòng", "moved"], ["害怕", "hài pà", "scared"], ["紧张", "jǐn zhāng", "nervous"], ["兴奋", "xīng fèn", "excited"], ["欣慰", "xīn wèi", "relieved"], ["失望", "shī wàng", "disappointed"], ["担心", "dān xīn", "worried"], ["焦急", "jiāo jí", "anxious"], ["惊讶", "jīng yà", "surprised"], ["疑惑", "yí huò", "confused"], ["羞愧", "xiū kuì", "ashamed"], ["内疚", "nèi jiù", "guilty"]], "scenes": [["比赛输了以后，小明低着头，觉得很____。", "失望"], ["妈妈很久还没回家，小丽开始____起来。", "担心"], ["老师说我的华文进步了，我听了十分____。", "欣慰"], ["我误会了朋友，知道真相后感到很____。", "内疚"], ["明天就要上台演讲了，他有一点____。", "紧张"], ["别人帮助了我，我心里非常____。", "感激"], ["听到自己得到比赛第一名，她非常____。", "兴奋"], ["突然听见门外一声巨响，大家都很____。", "惊讶"], ["明明不是我的错，却被大家责怪，我觉得很____。", "委屈"], ["做了不应该做的事以后，他非常____。", "后悔"]]}, "attitude": {"title": "态度／性格 Attitude & Character", "icon": "★", "words": [["耐心", "nài xīn", "patient"], ["诚实", "chéng shí", "honest"], ["负责", "fù zé", "responsible"], ["认真", "rèn zhēn", "serious"], ["积极", "jī jí", "positive"], ["冷静", "lěng jìng", "calm"], ["冲动", "chōng dòng", "impulsive"], ["谦虚", "qiān xū", "humble"], ["善良", "shàn liáng", "kind"], ["宽容", "kuān róng", "tolerant"], ["固执", "gù zhí", "stubborn"], ["粗心", "cū xīn", "careless"], ["坚定", "jiān dìng", "determined"], ["诚恳", "chéng kěn", "sincere"], ["自律", "zì lǜ", "self-disciplined"]], "scenes": [["妹妹不会做功课，姐姐慢慢教她，没有发脾气。姐姐很____。", "耐心"], ["小华打破花瓶后主动告诉妈妈真相。他很____。", "诚实"], ["组长按时完成自己的工作，也检查大家的进度。他很____。", "负责"], ["考试时，她仔细读题和检查答案，态度十分____。", "认真"], ["遇到问题时，他先想清楚再处理，非常____。", "冷静"], ["还没听完解释，他就生气地冲出去，做事太____。", "冲动"], ["虽然她得了第一名，却说自己还有很多要学习，很____。", "谦虚"], ["朋友犯错后真心道歉，他愿意原谅对方，很____。", "宽容"], ["明知道方法不对，他还是不肯听别人的意见，十分____。", "固执"], ["他每天先完成学习计划才玩游戏，非常____。", "自律"]]}, "action": {"title": "动作 Action", "icon": "→", "words": [["观察", "guān chá", "observe"], ["提醒", "tí xǐng", "remind"], ["鼓励", "gǔ lì", "encourage"], ["劝告", "quàn gào", "advise"], ["拒绝", "jù jué", "refuse"], ["承认", "chéng rèn", "admit"], ["解释", "jiě shì", "explain"], ["道歉", "dào qiàn", "apologize"], ["原谅", "yuán liàng", "forgive"], ["帮助", "bāng zhù", "help"], ["解决", "jiě jué", "solve"], ["阻止", "zǔ zhǐ", "stop / prevent"], ["坚持", "jiān chí", "persist"], ["放弃", "fàng qì", "give up"], ["努力", "nǔ lì", "work hard"]], "scenes": [["科学课上，他仔细____植物每天的变化。", "观察"], ["出门前，妈妈____我记得带雨伞。", "提醒"], ["比赛失败后，同学们不断____他再试一次。", "鼓励"], ["朋友想做危险的事，我马上____他不要这样做。", "劝告"], ["陌生人请她做不合理的事情，她立刻____了。", "拒绝"], ["老师问是谁打破花盆，小明主动____是自己做的。", "承认"], ["同学误会了我，我把事情的经过____给他听。", "解释"], ["我不小心撞到同学，马上向他____。", "道歉"], ["两个人讨论以后，终于找到办法____这个问题。", "解决"], ["虽然练习很困难，她还是每天____，没有半途而废。", "坚持"]]}};let topic,mode,items=[],i=0,score=0,done=false,ctx,cv,drawing=false;
const WEAKKEY="Y6_VOCAB_WEAK_V1";let lives=5,musicOn=false;const bgm=document.getElementById("bgm"),correctSound=document.getElementById("correctSound");bgm.volume=.18;correctSound.volume=.25;function updateHearts(){let e=document.getElementById("hearts");e.textContent="❤️".repeat(lives)+"🩶".repeat(5-lives)}function resetLives(){lives=5;updateHearts();document.getElementById("hearts").classList.toggle("hidden",mode==="write")}function playCorrect(){try{correctSound.currentTime=0;correctSound.play().catch(()=>{})}catch(e){}}function loseLife(){lives=Math.max(0,lives-1);updateHearts();let e=document.getElementById("hearts");if(e){e.classList.remove("heart-hit");void e.offsetWidth;e.classList.add("heart-hit")}return lives===0}function gameOver(){done=true;$("#feedback").textContent="";$("#next").classList.add("hidden");$("#body").innerHTML=`<div class=gameover><h2>🩶🩶🩶🩶🩶</h2><h2>本轮结束</h2><p>5次机会用完了。再试一次！<br><small>Out of hearts. Try this round again.</small></p><button class=next onclick="start(mode)">重新挑战 / Try Again</button></div>`}
function getWeak(){try{return JSON.parse(localStorage.getItem(WEAKKEY)||"{}")}catch(e){return {}}}
function markWeak(w,bad){let x=getWeak();x[w]=(x[w]||0)+(bad?2:-1);if(x[w]<=0)delete x[w];localStorage.setItem(WEAKKEY,JSON.stringify(x))}
function weakWords(){let x=getWeak();return Object.keys(x).sort((a,b)=>x[b]-x[a])}
const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5);
function show(x){["home","modes","quiz"].forEach(y=>$("#"+y).classList.toggle("hidden",x!==y));$("#homeBtn").classList.toggle("hidden",x==="home")}
$("#topics").innerHTML=Object.entries(G).map(([k,v])=>`<button class=pick data-topic=${k}>${v.icon} ${v.title}<small>15 words</small></button>`).join("");
document.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>{topic=b.dataset.topic;$("#topicTitle").textContent=G[topic].title;show("modes")});
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>start(b.dataset.mode));$("#homeBtn").onclick=()=>show("home");$("#next").onclick=()=>{i++;done=false;render()};
function start(m){mode=m;i=score=0;done=false;resetLives();$("#next").textContent="下一题 / Next →";$("#next").onclick=()=>{i++;done=false;render()};
 if(m==="scene")items=sh(G[topic].scenes);
 else if(m==="match")items=[...G[topic].words];
 else if(m==="classify")items=sh(G[topic].words).slice(0,12);
 else {let base=sh(G[topic].words), weak=weakWords();base.sort((a,b)=>(weak.includes(b[0])?1:0)-(weak.includes(a[0])?1:0));items=base.slice(0,m==="write"?10:15)}
 show("quiz");render()}
function choices(c,p){return sh([c,...sh(p.filter(x=>x!==c)).slice(0,3)])}
function render(){$("#feedback").textContent="";$("#next").classList.add("hidden");if(i>=items.length){$("#body").innerHTML=`<div class=q>完成！<br>${mode==="write"?"Writing complete":score+" / "+items.length}</div><button class=next onclick="show('modes')">返回练习 / Back</button>`;$("#bar").style.width="100%";return}$("#count").textContent=`${i+1} / ${items.length}`;$("#bar").style.width=(i/items.length*100)+"%";mode==="quick"?quick():mode==="meaning"?meaning():mode==="match"?matchGame():mode==="scene"?scene():mode==="classify"?classify():write()}
function meaning(){let w=items[i],rev=Math.random()<.35,c=rev?w[0]:w[2],pool=G[topic].words.map(x=>rev?x[0]:x[2]);$("#body").innerHTML=`<div class=q>${rev?w[2]:w[0]}</div><div class=answers>${choices(c,pool).map(x=>`<button class=ans>${x}</button>`).join("")}</div>`;bind(c)}
function scene(){let [s,c]=items[i],pool=G[topic].words.map(x=>x[0]);$("#body").innerHTML=`<div class=scene>${s.replace("____","______")}</div><div class=answers>${choices(c,pool).map(x=>`<button class=ans>${x}</button>`).join("")}</div>`;bind(c)}
function bind(c){document.querySelectorAll(".ans").forEach(b=>b.onclick=()=>{if(done)return;done=true;if(b.textContent===c){b.classList.add("good");score++;markWeak(c,false);playCorrect();$("#feedback").textContent="✓ 正确 / Correct"}else{b.classList.add("bad");markWeak(c,true);if(loseLife()){gameOver();return}$("#feedback").textContent="再看看 / Check the answer";document.querySelectorAll(".ans").forEach(x=>x.textContent===c&&x.classList.add("good"))}$("#next").classList.remove("hidden")})}

function quick(){
 let w=items[i], c=w[2], pool=G[topic].words.map(x=>x[2]);
 $("#body").innerHTML=`<div class=q>${w[0]}</div><div class=weaknote>看到词语后，尽量在几秒内选出意思。<br>Choose the meaning quickly.</div><div class=answers>${choices(c,pool).map(x=>`<button class=ans>${x}</button>`).join("")}</div>`;
 bindQuick(c,w[0]);
}
function bindQuick(c,word){
 document.querySelectorAll(".ans").forEach(b=>b.onclick=()=>{if(done)return;done=true;
 if(b.textContent===c){b.classList.add("good");score++;markWeak(word,false);playCorrect();$("#feedback").textContent="✓ 正确 / Correct"}
 else{b.classList.add("bad");markWeak(word,true);if(loseLife()){gameOver();return}$("#feedback").textContent="这个词稍后会优先复习 / Review again";document.querySelectorAll(".ans").forEach(x=>x.textContent===c&&x.classList.add("good"))}
 $("#next").classList.remove("hidden")})
}
let matchSelected=null, matchPairs=[], matchDone=0;
function matchGame(){
 $("#count").textContent="5 words";$("#bar").style.width="0%";$("#next").classList.add("hidden");
 let five=sh(items).slice(0,5), right=sh(five);
 matchPairs=five;matchDone=0;matchSelected=null;
 $("#body").innerHTML=`<div class=weaknote>先点左边中文字，再点右边意思。配对后会画线。<br>Tap a Chinese word, then its English meaning.</div>
 <div class=matcharea id=matcharea><svg class=matchsvg id=matchsvg></svg>
 <div class=matchcol>${five.map((w,n)=>`<button class=matchcard data-side=L data-word="${w[0]}" id="ml${n}">${w[0]}</button>`).join("")}</div>
 <div class=matchcol>${right.map((w,n)=>`<button class=matchcard data-side=R data-word="${w[0]}" id="mr${n}">${w[2]}</button>`).join("")}</div></div>`;
 document.querySelectorAll(".matchcard").forEach(b=>b.onclick=()=>matchTap(b));
}
function matchTap(b){
 if(b.classList.contains("matched"))return;
 if(b.dataset.side==="L"){document.querySelectorAll('[data-side=L]').forEach(x=>x.classList.remove("selected"));b.classList.add("selected");matchSelected=b;return}
 if(!matchSelected){$("#feedback").textContent="先选择左边的中文字 / Choose a Chinese word first";return}
 if(matchSelected.dataset.word===b.dataset.word){
   matchSelected.classList.add("matched");b.classList.add("matched");matchSelected.classList.remove("selected");drawLine(matchSelected,b);markWeak(b.dataset.word,false);playCorrect();matchDone++;score++;
   $("#bar").style.width=(matchDone/5*100)+"%";$("#feedback").textContent="✓ 配对正确";
   matchSelected=null;if(matchDone===5){$("#feedback").textContent="✓ 本轮完成 / Round complete";$("#next").textContent="再来5个 / Another 5";$("#next").classList.remove("hidden");$("#next").onclick=()=>{done=false;matchGame()}}
 }else{markWeak(matchSelected.dataset.word,true);if(loseLife()){gameOver();return}$("#feedback").textContent="✗ 再看看 / Try again";matchSelected.classList.remove("selected");matchSelected=null}
}
function drawLine(a,b){
 let area=$("#matcharea").getBoundingClientRect(),ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect(),svg=$("#matchsvg");
 let x1=ra.right-area.left,y1=ra.top+ra.height/2-area.top,x2=rb.left-area.left,y2=rb.top+rb.height/2-area.top;
 svg.innerHTML+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#69739f" stroke-width="3" stroke-linecap="round"/>`;
}

 let w=items[i], correct=topic==="feeling"?"心情 Feeling":topic==="attitude"?"态度／性格 Attitude & Character":"动作 Action";

function write(){let w=items[i];$("#body").innerHTML=`<div class=write><div class=big>${w[0]}</div><div>${w[1]} · ${w[2]}</div></div><div class=padbox><canvas id=pad></canvas></div><div class=tools><button onclick=clearPad()>清除 Clear</button><button onclick=toggleWord()>隐藏／显示词语</button></div>`;setup();$("#next").classList.remove("hidden")}
function toggleWord(){let e=document.querySelector(".big");e.style.visibility=e.style.visibility==="hidden"?"visible":"hidden"}function clearPad(){ctx&&ctx.clearRect(0,0,cv.width,cv.height)}
function setup(){cv=$("#pad");let r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx=cv.getContext("2d");ctx.scale(d,d);ctx.lineWidth=5;ctx.lineCap="round";ctx.strokeStyle="#20243a";let p=e=>{let r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};cv.onpointerdown=e=>{drawing=true;let[x,y]=p(e);ctx.beginPath();ctx.moveTo(x,y)};cv.onpointermove=e=>{if(!drawing)return;let[x,y]=p(e);ctx.lineTo(x,y);ctx.stroke()};window.onpointerup=()=>drawing=false}
const musicBtn=document.getElementById("musicBtn");async function toggleMusic(){musicOn=!musicOn;if(musicOn){try{await bgm.play();musicBtn.textContent="🔊 Music"}catch(e){musicOn=false;musicBtn.textContent="🎵 Music Off"}}else{bgm.pause();musicBtn.textContent="🎵 Music Off"}}musicBtn.onclick=toggleMusic;</script></body></html>
