/* ===== Game Skin V4 ===== */
:root{
  --ink:#283044;--soft:#f7f4ee;--card:#ffffff;--line:#dfe3ee;
  --shadow:0 7px 0 rgba(64,70,95,.10),0 12px 28px rgba(64,70,95,.10);
}
body{
  background:
    radial-gradient(circle at 10% 12%,rgba(255,255,255,.85) 0 70px,transparent 72px),
    radial-gradient(circle at 88% 18%,rgba(224,220,243,.55) 0 90px,transparent 92px),
    radial-gradient(circle at 78% 88%,rgba(237,226,205,.45) 0 110px,transparent 112px),
    linear-gradient(145deg,#f7f4ee,#f0eef7);
  min-height:100vh;color:var(--ink)
}
.app{max-width:900px}
.top{
  position:sticky;top:0;z-index:30;
  backdrop-filter:blur(12px);
  background:rgba(247,244,238,.82);
  border-bottom:1px solid rgba(150,155,175,.18);
  padding-top:10px;padding-bottom:10px
}
.hud{
  background:rgba(255,255,255,.78);border:1px solid rgba(160,165,185,.25);
  border-radius:999px;padding:6px 8px;box-shadow:0 4px 14px rgba(50,55,80,.08)
}
.hearts{filter:drop-shadow(0 2px 2px rgba(70,70,90,.12))}
.progress{height:13px;border-radius:999px;background:#e5e6ee;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
#bar{border-radius:999px;transition:width .35s ease}
.pick{
  min-height:112px;border:1px solid rgba(145,150,175,.22)!important;
  border-radius:20px!important;background:rgba(255,255,255,.94)!important;
  box-shadow:var(--shadow)!important;transform:translateY(0);
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
  position:relative;overflow:hidden
}
.pick:before{
  content:"";position:absolute;width:72px;height:72px;border-radius:50%;
  right:-20px;top:-22px;background:rgba(111,105,151,.08)
}
.pick:hover{transform:translateY(-4px);box-shadow:0 10px 0 rgba(64,70,95,.09),0 18px 34px rgba(64,70,95,.12)!important}
.pick:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(64,70,95,.10)!important}
.pick small{display:block;margin-top:6px;opacity:.62;font-weight:600}
#quiz .card,#quiz.card,.card{
  border:1px solid rgba(145,150,175,.20);border-radius:24px;
  box-shadow:var(--shadow);background:rgba(255,255,255,.96)
}
.q{
  width:min(560px,92%);margin:14px auto 20px!important;padding:28px 18px!important;
  background:linear-gradient(180deg,#fff,#faf9fd);border:1px solid #e1e3ec;
  border-radius:22px;box-shadow:0 6px 0 rgba(70,75,105,.08);
  font-size:clamp(34px,7vw,58px)!important;font-weight:900;letter-spacing:.04em
}
.answers,.catbuttons{gap:12px!important}
.ans,.matchcard{
  border:1px solid #d8dce8!important;border-radius:16px!important;
  background:#fff!important;box-shadow:0 5px 0 rgba(72,77,105,.10);
  transition:transform .12s ease,box-shadow .12s ease,background .18s ease;
  font-weight:750!important
}
.ans:hover,.matchcard:hover{transform:translateY(-2px)}
.ans:active,.matchcard:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(72,77,105,.12)}
.ans.good,.matchcard.matched{
  background:#e5f5e9!important;border-color:#94c5a2!important;
  animation:correctPop .28s ease
}
.ans.bad{background:#fde9e9!important;border-color:#e3a2a2!important;animation:wrongShake .28s ease}
.matchcard.selected{outline:3px solid #8c86b6!important;background:#f1effa!important}
.next{
  border-radius:16px!important;box-shadow:0 5px 0 rgba(60,65,90,.15);
  transition:transform .12s ease,box-shadow .12s ease
}
.next:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(60,65,90,.12)}
#feedback{min-height:28px;font-weight:800}
.gameover,.round-complete{

@keyframes wrongShake{0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}70%{transform:translateX(5px)}}

 if(comboCount>0 && comboCount%5===0)playSparkle();
}
function comboWrong(word){comboCount=0;renderCombo();if(word&&!roundMistakes.includes(word))roundMistakes.push(word)}
const WEAKKEY="Y6_VOCAB_WEAK_V1";
let lives=5,musicOn=false,bgmIndex=0;
const bgm=document.getElementById("bgm"),
      correctSound=document.getElementById("correctSound"),
      wrongSound=document.getElementById("wrongSound"),
      sparkleSound=document.getElementById("sparkleSound"),
      levelSound=document.getElementById("levelSound");
const bgmTracks=[
 {src:"assets/audio/study-lofi.mp3",label:"Lo-fi",volume:.17},
 {src:"assets/audio/classical-6.mp3",label:"Classical 6",volume:.25}
];
bgm.volume=bgmTracks[0].volume;correctSound.volume=.25;wrongSound.volume=.17;sparkleSound.volume=.22;levelSound.volume=.27;
function playSound(a){try{a.currentTime=0;a.play().catch(()=>{})}catch(e){}}
function playCorrect(){playSound(correctSound)}
function playWrong(){playSound(wrongSound)}
function playSparkle(){playSound(sparkleSound)}
function playLevel(){playSound(levelSound)}
function updateHearts(){let e=document.getElementById("hearts");e.textContent="❤️".repeat(lives)+"🩶".repeat(5-lives)}
function resetLives(){lives=5;updateHearts();document.getElementById("hearts").classList.toggle("hidden",mode==="write")}
function loseLife(){lives=Math.max(0,lives-1);updateHearts();let e=document.getElementById("hearts");if(e){e.classList.remove("heart-hit");void e.offsetWidth;e.classList.add("heart-hit")}playWrong();return lives===0}
function gameOver(){done=true;$("#feedback").textContent="";$("#next").classList.add("hidden");$("#body").innerHTML=`<div class=gameover><h2>🩶🩶🩶🩶🩶</h2><h2>本轮结束</h2><p>5次机会用完了。再试一次！<br><small>Out of hearts. Try this round again.</small></p><div class="result-weak">${roundMistakes.length?`<b>🧠 再看看 / Review:</b><br>${roundMistakes.join("、")}`:""}</div><button class=next onclick="start(mode)">重新挑战 / Try Again</button></div>`}
function getWeak(){try{return JSON.parse(localStorage.getItem(WEAKKEY)||"{}")}catch(e){return {}}}
function markWeak(w,bad){let x=getWeak();x[w]=(x[w]||0)+(bad?2:-1);if(x[w]<=0)delete x[w];localStorage.setItem(WEAKKEY,JSON.stringify(x))}
function weakWords(){let x=getWeak();return Object.keys(x).sort((a,b)=>x[b]-x[a])}
const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5);
let questionLimit=10;
const CORE_TOPICS=["feeling","attitude","action"];
function allWords(){return CORE_TOPICS.flatMap(k=>G[k].words)}
function allScenes(){return CORE_TOPICS.flatMap(k=>G[k].scenes)}
function categoryOf(word){
 if(G.feeling.words.some(x=>x[0]===word))return "心情 Feeling";
 if(G.attitude.words.some(x=>x[0]===word))return "态度／性格 Attitude & Character";
 return "动作 Action";
}
function currentWords(){
 if(topic==="mixed")return allWords();
 if(topic==="weak"){
   const ws=weakWords(), map=new Map(allWords().map(x=>[x[0],x]));
   return ws.map(w=>map.get(w)).filter(Boolean);
 }

}
function currentScenes(){
 if(topic==="mixed")return allScenes();
 if(topic==="weak"){
   const ws=new Set(weakWords());
   return allScenes().filter(x=>ws.has(x[1]));

function show(x){["home","modes","quiz"].forEach(y=>$("#"+y).classList.toggle("hidden",x!==y));$("#homeBtn").classList.toggle("hidden",x==="home");document.body.classList.toggle("in-practice",x!=="home")}
function renderHome(){
 const weakCount=weakWords().length;
 $("#topics").innerHTML=CORE_TOPICS.map(k=>{const v=G[k];return `<button class=pick data-topic=${k}>${v.icon} ${v.title}<small>15 words</small></button>`}).join("")+

 <button class="pick weak-special" data-topic=weak>🧠 专练错词<small>Practice Mistakes · ${weakCount} word${weakCount===1?"":"s"}</small></button>
 </div></div>`;
 document.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>{
   topic=b.dataset.topic;
   if(topic==="weak" && weakWords().length===0){alert("目前没有错词 🎉\nNo missed words yet.");return}

document.querySelectorAll(".qnum").forEach(b=>b.onclick=()=>{questionLimit=Number(b.dataset.count);document.querySelectorAll(".qnum").forEach(x=>x.classList.toggle("active",x===b))});
$("#homeBtn").onclick=()=>{renderHome();show("home")};$("#next").onclick=()=>{i++;done=false;render()};
function start(m){
 mode=m;i=score=0;done=false;roundMistakes=[];resetCombo();resetLives();
 $("#next").textContent="下一题 / Next →";$("#next").onclick=()=>{i++;done=false;render()};
 const words=currentWords(), scenes=currentScenes();
 if(m==="scene"){
   items=sh(scenes).slice(0,Math.min(questionLimit,scenes.length));
   if(!items.length){alert("这些错词暂时没有情境题，请先使用快速认词或中英选择。");show("modes");return}
 }else if(m==="match"){
   items=sh([...words]).slice(0,Math.min(questionLimit,words.length));
   matchPool=[...items];matchRound=0;
 }else if(m==="classify"){
   items=sh([...words]).slice(0,Math.min(questionLimit,words.length));
 }else{
   let base=sh([...words]), weak=weakWords();
   if(topic!=="weak")base.sort((a,b)=>(weak.includes(b[0])?1:0)-(weak.includes(a[0])?1:0));
   items=base.slice(0,Math.min(m==="write"?questionLimit:questionLimit,base.length));
 }
 show("quiz");render()
}
function choices(c,p){return sh([c,...sh(p.filter(x=>x!==c)).slice(0,3)])}

function sceneChoices(sentence,c){
 const fixed=SCENE_DISTRACTORS[sentence];
 if(fixed)return sh([c,...fixed]);
 return choices(c,currentWords().map(x=>x[0]));
}

function render(){$("#feedback").textContent="";$("#next").classList.add("hidden");if(i>=items.length){
 if(mode!=="write")playLevel();
 $("#body").innerHTML=`<div class=q>完成！<br>${mode==="write"?"Writing complete":score+" / "+items.length}</div>${mode==="write"?"":resultExtras()}<button class=next onclick="backToModes()">返回练习 / Back</button>`;
 $("#bar").style.width="100%";return
}$("#count").textContent=`${i+1} / ${items.length}`;$("#bar").style.width=(i/items.length*100)+"%";mode==="quick"?quick():mode==="meaning"?meaning():mode==="match"?matchGame():mode==="scene"?scene():mode==="classify"?classify():write()}
function meaning(){let w=items[i],rev=Math.random()<.35,c=rev?w[0]:w[2],pool=currentWords().map(x=>rev?x[0]:x[2]);$("#body").innerHTML=`<div class=q>${rev?w[2]:w[0]}</div><div class=answers>${choices(c,pool).map(x=>`<button class=ans>${x}</button>`).join("")}</div>`;bind(c)}
function scene(){let [s,c]=items[i];$("#body").innerHTML=`<div class=scene>${s.replace("____","______")}</div><div class=answers>${sceneChoices(s,c).map(x=>`<button class=ans>${x}</button>`).join("")}</div>`;bind(c)}
function bind(c){document.querySelectorAll(".ans").forEach(b=>b.onclick=()=>{if(done)return;done=true;if(b.textContent===c){b.classList.add("good");score++;markWeak(c,false);comboCorrect();playCorrect();$("#feedback").textContent="✓ 正确 / Correct"}else{b.classList.add("bad");markWeak(c,true);comboWrong(c);if(loseLife()){gameOver();return}$("#feedback").textContent="再看看 / Check the answer";document.querySelectorAll(".ans").forEach(x=>x.textContent===c&&x.classList.add("good"))}$("#next").classList.remove("hidden")})}

function quick(){
 let w=items[i], c=w[2], pool=currentWords().map(x=>x[2]);
 $("#body").innerHTML=`<div class=q>${w[0]}</div><div class=weaknote>看到词语后，尽量在几秒内选出意思。<br>Choose the meaning quickly.</div><div class=answers>${choices(c,pool).map(x=>`<button class=ans>${x}</button>`).join("")}</div>`;
 bindQuick(c,w[0]);
}
function bindQuick(c,word){
 document.querySelectorAll(".ans").forEach(b=>b.onclick=()=>{if(done)return;done=true;
 if(b.textContent===c){b.classList.add("good");score++;markWeak(word,false);comboCorrect();playCorrect();$("#feedback").textContent="✓ 正确 / Correct"}
 else{b.classList.add("bad");markWeak(word,true);comboWrong(word);if(loseLife()){gameOver();return}$("#feedback").textContent="这个词稍后会优先复习 / Review again";document.querySelectorAll(".ans").forEach(x=>x.textContent===c&&x.classList.add("good"))}
 $("#next").classList.remove("hidden")})
}
let matchSelected=null, matchPairs=[], matchDone=0,matchPool=[],matchRound=0;
function matchGame(){
 $("#count").textContent=`${Math.min(5,matchPool.length-matchRound*5)} words`;$("#bar").style.width="0%";$("#next").classList.add("hidden");
 let five=matchPool.slice(matchRound*5,matchRound*5+5), right=sh(five);
 matchPairs=five;matchDone=0;matchSelected=null;
 $("#body").innerHTML=`<div class=weaknote>先点左边中文字，再点右边意思。配对后会画线。<br>Tap a Chinese word, then its English meaning.</div>
 <div class=matcharea id=matcharea><svg class=matchsvg id=matchsvg></svg>
 <div class=matchcol>${five.map((w,n)=>`<button class=matchcard data-side=L data-word="${w[0]}" id="ml${n}">${w[0]}</button>`).join("")}</div>
 <div class=matchcol>${right.map((w,n)=>`<button class=matchcard data-side=R data-word="${w[0]}" id="mr${n}">${w[2]}</button>`).join("")}</div></div>`;
 document.querySelectorAll(".matchcard").forEach(b=>b.onclick=()=>matchTap(b));
}
function matchTap(b){
 if(b.classList.contains("matched"))return;
 if(b.dataset.side==="L"){document.querySelectorAll('[data-side=L]').forEach(x=>x.classList.remove("selected"));b.classList.add("selected");matchSelected=b;return}
 if(!matchSelected){$("#feedback").textContent="先选择左边的中文字 / Choose a Chinese word first";return}
 if(matchSelected.dataset.word===b.dataset.word){
   matchSelected.classList.add("matched");b.classList.add("matched");matchSelected.classList.remove("selected");drawLine(matchSelected,b);markWeak(b.dataset.word,false);comboCorrect();playCorrect();matchDone++;score++;
   $("#bar").style.width=(matchDone/matchPairs.length*100)+"%";$("#feedback").textContent="✓ 配对正确";
   matchSelected=null;if(matchDone===matchPairs.length){
     matchRound++;
     if(matchRound*5>=matchPool.length){
       playLevel();
       $("#body").innerHTML+=resultExtras();
       $("#feedback").textContent="🎉 完成全部配对 / All matches complete";
       $("#next").textContent="返回练习 / Back";
       $("#next").classList.remove("hidden");
       $("#next").onclick=()=>show("modes");
     }else{
       $("#feedback").textContent="✓ 本轮完成 / Round complete";
       $("#next").textContent="再来5个 / Another 5";
       $("#next").classList.remove("hidden");
       $("#next").onclick=()=>{done=false;matchGame()}
     }
   }
 }else{markWeak(matchSelected.dataset.word,true);comboWrong(matchSelected.dataset.word);if(loseLife()){gameOver();return}$("#feedback").textContent="✗ 再看看 / Try again";matchSelected.classList.remove("selected");matchSelected=null}
}
function drawLine(a,b){
 let area=$("#matcharea").getBoundingClientRect(),ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect(),svg=$("#matchsvg");
 let x1=ra.right-area.left,y1=ra.top+ra.height/2-area.top,x2=rb.left-area.left,y2=rb.top+rb.height/2-area.top;
 svg.innerHTML+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#69739f" stroke-width="3" stroke-linecap="round"/>`;
}
function classify(){
 let w=items[i], correct=categoryOf(w[0]);
 $("#body").innerHTML=`<div class=q>${w[0]}</div><div class=weaknote>${w[1]} · ${w[2]}<br>这个词属于哪一类？ / Which group?</div>
 <div class=catbuttons>${["心情 Feeling","态度／性格 Attitude & Character","动作 Action"].map(x=>`<button class=ans>${x}</button>`).join("")}</div>`;
 document.querySelectorAll(".ans").forEach(b=>b.onclick=()=>{if(done)return;done=true;if(b.textContent===correct){b.classList.add("good");score++;markWeak(w[0],false);comboCorrect();playCorrect();$("#feedback").textContent="✓ 正确"}else{b.classList.add("bad");markWeak(w[0],true);comboWrong(w[0]);if(loseLife()){gameOver();return}$("#feedback").textContent="✗ 再看看";document.querySelectorAll(".ans").forEach(x=>x.textContent===correct&&x.classList.add("good"))}$("#next").classList.remove("hidden")})
}
function write(){let w=items[i];$("#body").innerHTML=`<div class=write><div class=big>${w[0]}</div><div>${w[1]} · ${w[2]}</div></div><div class=padbox><canvas id=pad></canvas></div><div class=tools><button onclick=clearPad()>清除 Clear</button><button onclick=toggleWord()>隐藏／显示词语</button></div>`;setup();$("#next").classList.remove("hidden")}
function toggleWord(){let e=document.querySelector(".big");e.style.visibility=e.style.visibility==="hidden"?"visible":"hidden"}function clearPad(){ctx&&ctx.clearRect(0,0,cv.width,cv.height)}
function setup(){cv=$("#pad");let r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx=cv.getContext("2d");ctx.scale(d,d);ctx.lineWidth=5;ctx.lineCap="round";ctx.strokeStyle="#20243a";let p=e=>{let r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};cv.onpointerdown=e=>{drawing=true;let[x,y]=p(e);ctx.beginPath();ctx.moveTo(x,y)};cv.onpointermove=e=>{if(!drawing)return;let[x,y]=p(e);ctx.lineTo(x,y);ctx.stroke()};window.onpointerup=()=>drawing=false}
const musicBtn=document.getElementById("musicBtn"),changeMusicBtn=document.getElementById("changeMusicBtn");
function updateMusicLabels(){musicBtn.textContent=musicOn?"🔊 Music":"🎵 Music Off";changeMusicBtn.textContent="♫ "+bgmTracks[bgmIndex].label}
async function toggleMusic(){musicOn=!musicOn;if(musicOn){try{await bgm.play()}catch(e){musicOn=false}}else bgm.pause();updateMusicLabels()}
async function changeMusic(){
 const wasPlaying=musicOn;bgmIndex=(bgmIndex+1)%bgmTracks.length;bgm.pause();bgm.src=bgmTracks[bgmIndex].src;bgm.volume=bgmTracks[bgmIndex].volume;bgm.load();
 if(wasPlaying){try{await bgm.play()}catch(e){musicOn=false}}
 updateMusicLabels();
}
musicBtn.onclick=toggleMusic;changeMusicBtn.onclick=changeMusic;updateMusicLabels();
function backToModes(){renderHome();show("modes")}
function resultExtras(){
 const perfect=lives===5?`<div class="perfect-hearts">Perfect Hearts! ❤️❤️❤️❤️❤️</div>`:"";
 const weak=roundMistakes.length?`<div class="result-weak"><b>🧠 再看看 / Review:</b><br>${roundMistakes.join("、")}</div>`:`<div class="result-weak"><b>✨ 本轮没有错词 / No missed words</b></div>`;
 return perfect+weak;
}
