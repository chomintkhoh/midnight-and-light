function splitBuildTokens(tokens,x){
  const text=tokens.map(t=>t[0]).join(""),connectorTerms=(x.zh||"").split("……").filter(Boolean);
  const ranges=[];
  connectorTerms.forEach(term=>{let from=0;while(true){let at=text.indexOf(term,from);if(at<0)break;ranges.push([at,at+term.length]);from=at+term.length}});

    if(r){units.push({start:r[0],end:r[1],connector:true});pos=r[1];continue}

function detective(){let list=ML_DETECTIVE_CASES.filter(x=>x.level===S.difficulty),notice="";if(!list.length){list=ML_DETECTIVE_CASES.filter(x=>x.level==="basic");notice="此难度题库制作中，暂用 Basic。"}let c=list[Math.floor(Math.random()*list.length)],toks=c.tokens.map(x=>[...x]),slots=Object.keys(c.slots),wrongSlots=[],errors={};let n=Math.random()<.1?0:Math.min(slots.length,1+Math.floor(Math.random()*3));shuffle(slots).slice(0,n).forEach(sl=>{let i=toks.findIndex(x=>x[3]===sl),def=normSlot(c.slots[sl]);if(!def.errors.length)return;let ei=Math.floor(Math.random()*def.errors.length),e=def.errors[ei];if(i>=0){toks[i][0]=e[0];toks[i][1]=e[1];wrongSlots.push(sl);errors[sl]=e}});inspectMode=false;current={kind:"detective",c,toks,wrongSlots,errors,marks:{},notice,closed:false,peekedIndices:new Set()};drawDetective()}
function markIndex(key,toks){return key.startsWith("@")?Number(key.slice(1)):toks.findIndex(t=>t[3]===key)}
function openDetectiveCheck(i){let x=current;if(!x||x.closed)return;let {c,toks,marks}=x,t=toks[i];if(!t||/^[，。！？；：、,.!?;：“”‘’（）()…—-]+$/.test(t[0]))return;let sl=t[3]||"",key=sl||("@"+i);if(marks[key]){delete marks[key];drawDetective();return}let def=sl?normSlot(c.slots[sl]):{correct:t[0],correctPy:t[1]||"",errors:[]},said=t[0],opts=repairOptions(def.correct,said),py=(S.reading==="hanzi"?"":(t[1]||""));$("checks").innerHTML='<div class="detective-check-card"><div class="check-lens"><img src="../assets/magnifier.svg" alt=""><span class="check-lens-word">'+said+'</span></div><div>'+(py?'<div class="inspect-py">'+py+'</div>':'')+'<div class="options" style="margin-top:10px"><button id="good">✔ 用得对</button><button id="bad">✘ 用错了</button></div><div id="repairD"></div></div></div>';$("good").onclick=()=>{marks[key]={bad:false,index:i};drawDetective()};$("bad").onclick=()=>{$("repairD").innerHTML='<div class="options">'+opts.map(v=>'<button class="dfix choice" data-value="'+v+'">'+choiceHtml(v,v===def.correct?(def.correctPy||t[1]||pyFor(v)):v===said?(t[1]||pyFor(v)):pyFor(v))+'</button>').join("")+'</div>';document.querySelectorAll(".dfix").forEach(b=>b.onclick=()=>{marks[key]={bad:true,fix:b.dataset.value,index:i};drawDetective()})}}
function wireDetectiveHover(caseEl,toks){if(matchMedia("(max-width:600px)").matches)return;caseEl.querySelectorAll(".mltok:not(.punct)").forEach(el=>{el.addEventListener("mouseenter",()=>{if(S.reading!=="hanzi")return;let i=Number(el.dataset.i);clearTimeout(hoverPeekTimer);hoverPeekTimer=setTimeout(()=>{let py=toks[i]&&toks[i][1];if(!py)return;el.classList.add("peeking");el.setAttribute("data-show",py);if(!current.peekedIndices.has(i)){current.peekedIndices.add(i);peek++}},800)});el.addEventListener("mouseleave",()=>{clearTimeout(hoverPeekTimer);el.classList.remove("peeking");el.removeAttribute("data-show")})})}
function drawDetective(){let x=current,{c,toks,wrongSlots,marks,notice}=x,isMobile=matchMedia("(max-width:600px)").matches,caseClass="casefile detective-case"+(isMobile?(inspectMode?" inspect-on":" inspect-off"):"");$("play").innerHTML=(notice?'<div class="notice">'+notice+'</div>':'')+'<h2>🔍 抓错字 · 案件档案</h2><h3>'+tokensHtml(c.titleTokens||[[c.title,""]])+'</h3><div>本案嫌疑：'+wrongSlots.length+' 处</div><div class="'+caseClass+'" id="case">'+tokensHtml(toks)+(isMobile?'<button class="inspect-toggle'+(inspectMode?" active":"")+'" id="inspectToggle" aria-label="切换检查模式"><img src="../assets/magnifier.svg" alt=""></button>':'')+'</div><p class="lensHint">'+(isMobile?(inspectMode?"检查模式已开启：点字词进行检查。":"先阅读；需要检查时按右下角放大镜。"):"移动放大镜游标到字词上，点击进行检查。")+'</p><div id="checks"></div><button id="closecase">结案</button><div id="result"></div>';
Object.entries(marks).forEach(([key,m])=>{let i=markIndex(key,toks),el=document.querySelector('.mltok[data-i="'+i+'"]');if(el)el.classList.add(m.bad?"mark-bad":"mark-good")});
let caseEl=$("case");caseEl.querySelectorAll(".mltok").forEach(el=>el.onclick=()=>{if(x.closed)return;if(isMobile&&!inspectMode)return;openDetectiveCheck(Number(el.dataset.i))});wireDetectiveHover(caseEl,toks);
let toggle=$("inspectToggle");if(toggle)toggle.onclick=e=>{e.stopPropagation();inspectMode=!inspectMode;drawDetective()};$("closecase").onclick=closeCase}
function closeCase(){let x=current;if(x.closed)return;x.closed=true;let pts=0;Object.keys(x.c.slots).forEach(sl=>{let bad=x.wrongSlots.includes(sl),m=x.marks[sl],right=normSlot(x.c.slots[sl]).correct;if(bad&&m&&m.bad&&m.fix===right)pts+=2;else if(!bad&&m&&!m.bad)pts+=1;else if(!bad&&m&&m.bad)pts-=1});let q=x.c.question,order=shuffle(q.options.map((o,i)=>({o,i})));$("result").innerHTML='<div class="result"><b>关联词得分：'+pts+'</b>'+(S.english?'<div class="english">'+x.c.en+'</div>':'')+'<div class="question"><h3>'+tokensHtml(q.q)+'</h3>'+(S.english?'<p class="english">'+q.qEn+'</p>':'')+order.map(v=>'<button class="qopt" data-original="'+v.i+'">'+choiceTokensHtml(v.o)+'</button>').join("")+'</div></div>';document.querySelectorAll(".qopt").forEach(b=>b.onclick=()=>{if(answered)return;let ok=Number(b.dataset.original)===q.answer;if(ok)correct++;lock(".qopt");b.parentElement.insertAdjacentHTML("beforeend",'<p>'+(ok?"✓ +2":"✎ 0")+' · <button id="nxt">NEXT</button></p>');$("nxt").onclick=next});wirePeek($("result"))}

function deck(repaint=false){let d=window.LINKING_WORDS_MASTER_DECK||[],x=repaint&&current&&current.x?current.x:d[Math.floor(Math.random()*d.length)],toks=deckExampleTokens(x);current={kind:"deck",x};$("play").innerHTML='<h2>WORD DECK</h2><div class="choice" style="text-align:center">'+connectorChoiceHtml(x)+'</div>'+(S.english?'<p style="text-align:center">'+x.en+'</p>':"")+'<div class="deck-example sentence">'+tokensHtml(toks)+'</div><div class="result">'+x.explanation+'</div><button id="nxt">NEXT CARD</button>';$("nxt").onclick=next;wirePeek($("play"))}
function match(repaint=false){let d=window.LINKING_WORDS_MASTER_DECK||[],x=repaint&&current&&current.x?current.x:d[Math.floor(Math.random()*d.length)],toks,blank,optionIds;if(repaint&&current&&current.kind==="match"){x=current.x;toks=current.toks;blank=current.blank;optionIds=current.optionIds}else{toks=deckExampleTokens(x);blank=blankDeckTokens(toks,x.zh);optionIds=shuffle([x,...shuffle(d.filter(y=>y.id!==x.id)).slice(0,3)]).map(o=>o.id);current={kind:"match",x,toks,blank,optionIds}}let opts=optionIds.map(id=>d.find(o=>o.id===id)).filter(Boolean);$("play").innerHTML='<h2>MATCH</h2><div class="sentence">'+tokensHtml(blank)+'</div><div class="options">'+opts.map(o=>'<button class="mopt choice" data-id="'+o.id+'">'+connectorChoiceHtml(o)+'</button>').join("")+'</div><div id="result"></div>';document.querySelectorAll(".mopt").forEach(b=>b.onclick=()=>{if(answered)return;let ok=b.dataset.id===x.id;if(ok)correct++;lock(".mopt");$("result").innerHTML='<div class="result">'+(ok?"✓ ":"✎ ")+'<div class="result-correct">'+tokensHtml(toks)+'</div><button id="nxt">NEXT</button></div>';$("nxt").onclick=next});wirePeek($("play"))}
function build(repaint=false){let d=window.LINKING_WORDS_MASTER_DECK||[],x,toks,parts,order,chosen;if(repaint&&current&&current.kind==="build"){({x,toks,parts,order,chosen}=current)}else{x=d[Math.floor(Math.random()*d.length)];toks=deckExampleTokens(x);parts=splitBuildTokens(toks,x);order=shuffle(parts.map((_,i)=>i));chosen=[];current={kind:"build",x,toks,parts,order,chosen}}function paintZone(){$("zone").innerHTML=chosen.map(i=>'<span class="build-card">'+tokensHtml(parts[i])+'</span>').join("")} $("play").innerHTML='<h2>BUILD</h2><div id="zone" class="casefile build-zone"></div><div class="options">'+order.map(i=>'<button class="bopt build-card" data-i="'+i+'">'+tokensHtml(parts[i])+'</button>').join("")+'</div><button id="resetb">RESET</button> <button id="checkb">CHECK</button><div id="result"></div>';paintZone();document.querySelectorAll(".bopt").forEach(b=>{if(chosen.includes(Number(b.dataset.i)))b.disabled=true;b.onclick=()=>{if(answered||b.disabled)return;b.disabled=true;chosen.push(Number(b.dataset.i));paintZone()}});$("resetb").onclick=()=>{if(answered)return;chosen.length=0;paintZone();document.querySelectorAll(".bopt").forEach(b=>b.disabled=false)};$("checkb").onclick=()=>{if(answered)return;let ok=chosen.length===parts.length&&chosen.every((v,i)=>v===i);if(ok)correct++;lock(".bopt,#checkb,#resetb");$("result").innerHTML='<div class="result">'+(ok?"✓ ":"✎ ")+'<div class="result-correct">'+tokensHtml(toks)+'</div><button id="nxt">NEXT</button></div>';$("nxt").onclick=next};wirePeek($("play"))}
reset();
</script></body></html>
