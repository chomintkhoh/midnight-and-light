<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>关联词 Logic Lab V3.1</title><link rel="stylesheet" href="../core/zh-core.css"><style>
body{font-family:Arial,"Microsoft YaHei",sans-serif;background:#f3efe5;color:#202033;margin:0}.app{max-width:1080px;margin:auto;padding:18px}.panel{background:#fffdf8;border:2px solid #202033;border-radius:22px;padding:18px;box-shadow:6px 6px 0 #202033;margin:18px 0}button,select{font:inherit;border:2px solid #202033;border-radius:12px;background:#fff;padding:9px 12px;font-weight:800}button:disabled{opacity:.55;cursor:not-allowed}.controls,.modes,.options{display:flex;gap:8px;flex-wrap:wrap}.modes button.active{background:#ffd75a}.sentence{font-size:25px;line-height:1.9}.teacher{display:grid;grid-template-columns:120px auto;gap:18px;align-items:center;justify-content:start}.avatar svg{width:120px}.bubble{border:3px solid #202033;border-radius:25px;padding:18px 20px;background:white;position:relative;max-width:800px;width:fit-content}.bubble:before{content:"";position:absolute;left:-18px;top:45px;border-width:12px 18px 12px 0;border-style:solid;border-color:transparent #202033 transparent transparent}.casefile{position:relative;max-width:860px;margin:12px auto;border:2px solid #202033;padding:20px;background:#fff;font-size:21px;line-height:2.1;min-height:180px;box-sizing:border-box}.mltok.selected{background:#ffe08b;outline:2px solid #202033;border-radius:4px}.mltok.mark-good{background:#d9f2df;outline:2px solid #2d7d46}.mltok.mark-bad{background:#ffd8d4;outline:2px solid #c43e38}.result,.notice{padding:14px;background:#eee9dc;border-left:6px solid #202033;margin-top:12px}.notice{background:#fff3bf}.listen{margin-top:10px}.score{font-weight:900}.lensHint{font-size:13px}.question{margin-top:18px}.qopt{display:block;margin:8px 0;text-align:left}.english{margin-top:10px;color:#4c4a55;font-size:16px;line-height:1.45}
@media(max-width:600px){.app{padding:10px}.panel{padding:13px}.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.modes button{width:100%;padding:9px 6px}.modes button[data-mode="build"]{grid-column:1/-1}.teacher{grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:start;justify-content:stretch}.avatar svg{width:68px}.sentence{font-size:20px}.bubble{padding:13px;border-width:2px;width:auto;max-width:none}.bubble:before{left:-13px;top:30px;border-width:9px 13px 9px 0}.casefile{padding:15px;font-size:19px}.controls{flex-direction:column;align-items:flex-start}}
</style></head><body><div class="app"><h1>关联词 Logic Lab · V3.1</h1><div class="panel controls"><select id="difficulty"><option value="basic">Basic</option><option value="mixed">Mixed</option><option value="challenge">Challenge</option></select><select id="reading"><option value="pinyin">拼音 Pinyin</option><option value="ruby">汉字+拼音 Hanzi+Pinyin</option><option value="hanzi">汉字挑战 Hanzi Only</option></select><button id="english">English ON</button></div><div class="modes"><button data-mode="teacher" class="active">👩‍🏫 老师说错了！</button><button data-mode="detective">🔎 DETECTIVE</button><button data-mode="deck">🃏 WORD DECK</button><button data-mode="match">🧩 MATCH</button><button data-mode="build">🏗️ BUILD</button></div><div class="panel"><div class="score" id="status"></div><div id="play"></div></div></div>
<script src="../../data/linking-words-masterdeck.js"></script><script src="../core/zh-core.js"></script><script src="../data/linking-words/teacher-scenes-1.js"></script><script src="../data/linking-words/teacher-scenes-2.js"></script><script src="../data/linking-words/teacher-scenes-3.js"></script><script src="../data/linking-words/teacher-scenes.js"></script><script src="../data/linking-words/detective-cases.js"></script><script>
const $=id=>document.getElementById(id),S=MLZH.settings(),audio=MLZH.player("../audio/linking-words/");let mode="teacher",round=0,correct=0,peek=0,used=new Set(),current=null,answered=false,lastAudio=null;
$("difficulty").value=S.difficulty;$("reading").value=S.reading;$("english").textContent="English "+(S.english?"ON":"OFF");
function save(){S.difficulty=$("difficulty").value;S.reading=$("reading").value;MLZH.save(S)}
$("difficulty").onchange=()=>{save();reset()};$("reading").onchange=()=>{save();paint()};$("english").onclick=()=>{S.english=!S.english;$("english").textContent="English "+(S.english?"ON":"OFF");MLZH.save(S);paint()};
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-mode]").forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.mode;reset()});
function avatar(face="confident"){let mouth=face==="smug"?"M38 64 Q50 72 62 62":face==="shocked"?"M45 62 Q50 75 55 62":face==="proud"?"M37 61 Q50 78 64 60":"M39 64 Q50 70 61 64",brow=face==="smug"?"M32 38 L44 35 M56 35 L68 38":"M32 37 L44 37 M56 37 L68 37";return '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#ffd75a" stroke="#202033" stroke-width="3"/><path d="'+brow+'" stroke="#202033" stroke-width="3"/><circle cx="39" cy="47" r="3"/><circle cx="61" cy="47" r="3"/><path d="'+mouth+'" fill="none" stroke="#202033" stroke-width="3" stroke-linecap="round"/></svg>'}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function repairOptions(right,said){let bank=(window.LINKING_WORDS_MASTER_DECK||[]).flatMap(x=>x.zh.split("……")).filter(Boolean),out=[];[right,said].forEach(v=>{if(v&&!out.includes(v))out.push(v)});for(const v of shuffle(bank)){if(!out.includes(v)){out.push(v);if(out.length===3)break}}return shuffle(out.slice(0,3))}
function tokensHtml(t){return MLZH.renderTokens(t,S.reading)}function wirePeek(root){if(S.reading==="hanzi")MLZH.wirePeek(root,()=>peek++)}
function reset(){round=correct=peek=0;used.clear();current=null;answered=false;next()}function next(){if(round>=10)return finish();round++;current=null;answered=false;render()}function paint(){if(!current)return render();if(mode==="teacher")drawTeacher();else if(mode==="detective")drawDetective();else if(mode==="deck")deck(true);else if(mode==="match")match(true);else if(mode==="build")build(true)}
function finish(){let stars=peek<=2?"⭐⭐⭐":peek<=6?"⭐⭐":"⭐";$("status").textContent="Session complete";$("play").innerHTML='<div style="text-align:center;padding:30px"><div style="font-size:58px;font-weight:900">'+correct+'/10</div><p>本局偷看拼音 '+peek+' 次 · '+stars+'</p><button id="again">PLAY ANOTHER 10</button></div>';$("again").onclick=reset}
function render(){save();$("status").textContent="Round "+round+"/10 · "+correct+" correct";({teacher,detective,deck,match,build}[mode])()}
function lock(sel){answered=true;document.querySelectorAll(sel).forEach(b=>b.disabled=true)}
function playFile(file){lastAudio=file;if(file)audio.play(file)}function replayButton(){return lastAudio?'<button class="listen" id="relisten">🔊 再听一次</button>':""}function bindReplay(){let b=$("relisten");if(b)b.onclick=()=>playFile(lastAudio)}
function teacher(){let list=ML_TEACHER_SCENES.scenes.filter(x=>x.level===S.difficulty),notice="";if(!list.length){list=ML_TEACHER_SCENES.scenes.filter(x=>x.level==="basic");notice="此难度题库制作中，暂用 Basic。"}let avail=list.filter(x=>!used.has(x.id));if(!avail.length){used.clear();avail=list}let sc=avail[Math.floor(Math.random()*avail.length)];used.add(sc.id);let ei=Math.random()<.7?Math.floor(Math.random()*sc.errors.length):-1,wrong=ei>=0?sc.errors[ei]:null,toks=sc.tokens.map(x=>[...x]);if(wrong){let i=toks.findIndex(x=>x[3]===wrong[0]);if(i>=0){toks[i][0]=wrong[1];toks[i][1]=wrong[2]}}let oi=Math.floor(Math.random()*ML_TEACHER_SCENES.openers.length);current={kind:"teacher",sc,wrong,ei,toks,oi,notice,face:"confident"};drawTeacher();setTimeout(()=>playTeacherSequence(),0)}
function playTeacherSequence(){let c=current;if(!c||c.kind!=="teacher")return;let line="line-open-"+String(c.oi+1).padStart(2,"0")+".mp3",sentence=c.wrong?c.sc.audio.errors[c.ei]:c.sc.audio.correct;lastAudio=sentence;audio.play(line,()=>audio.play(sentence))}
function drawTeacher(){let c=current,{sc,wrong,toks,notice}=c;$("play").innerHTML=(notice?'<div class="notice">'+notice+'</div>':'')+'<div class="teacher"><div class="avatar" id="avatar">'+avatar(c.face)+'</div><div class="bubble"><b>'+ML_TEACHER_SCENES.openers[c.oi]+'</b><div class="sentence">'+tokensHtml(toks)+'</div>'+(S.english?'<div class="english">老师想说的意思：'+sc.en+'</div>':'')+replayButton()+'</div></div><div class="options"><button id="noerr">✅ 老师没说错</button></div><div id="repair"></div><div id="result"></div>';bindReplay();let selected=null;document.querySelectorAll(".mltok").forEach(el=>el.onclick=()=>{if(answered)return;document.querySelectorAll(".mltok").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");selected=Number(el.dataset.i);let slot=toks[selected]&&toks[selected][3];if(!slot)return;let ct=sc.tokens.find(x=>x[3]===slot),right=ct&&ct[0],said=wrong&&wrong[0]===slot?wrong[1]:toks[selected][0],opts=repairOptions(right,said);$("repair").innerHTML='<div class="options">'+opts.map(x=>'<button class="fix">'+x+'</button>').join("")+'</div>';document.querySelectorAll(".fix").forEach(b=>b.onclick=()=>judgeTeacher(slot,b.textContent))});$("noerr").onclick=()=>judgeTeacher(null,null);wirePeek($("play"))}
function judgeTeacher(slot,fix){if(answered)return;let c=current,{sc,wrong}=c,ok=wrong?slot===wrong[0]&&fix===sc.tokens.find(x=>x[3]===wrong[0])[0]:slot===null;if(ok)correct++;lock("#noerr,.fix,.mltok");let falseAccuse=!wrong&&slot!==null,line,lf;if(ok){let i=Math.floor(Math.random()*ML_TEACHER_SCENES.praise.length);line=ML_TEACHER_SCENES.praise[i];lf="line-praise-"+String(i+1).padStart(2,"0")+".mp3";c.face=wrong?"shocked":"proud"}else if(falseAccuse){line=ML_TEACHER_SCENES.teaseRight;lf="line-tease-right.mp3";c.face="smug"}else{let i=Math.floor(Math.random()*ML_TEACHER_SCENES.tease.length);line=ML_TEACHER_SCENES.tease[i];lf="line-tease-"+String(i+1).padStart(2,"0")+".mp3";c.face="smug"}let av=$("avatar");if(av)av.innerHTML=avatar(c.face);audio.play(lf);$("result").innerHTML='<div class="result"><b>'+line+'</b><br>'+sc.tokens.map(x=>x[0]).join("")+(wrong?'<br>'+wrong[4]+' · '+wrong[5]:'')+'<br><button id="nxt">NEXT</button></div>';if(!ok){let z=document.createElement("div");z.className="ml-zero";z.innerHTML='<svg viewBox="0 0 260 260"><path d="M130 25 C55 20 22 80 35 145 C50 220 190 235 225 145 C250 75 195 20 130 25"/></svg>';document.body.appendChild(z);setTimeout(()=>z.remove(),1600)}$("nxt").onclick=next}
function normSlot(v){if(v&&v.correct)return v;if(Array.isArray(v))return{correct:v[0],correctPy:v[2]||"",errors:v[1]?[ [v[1],v[3]||"",v[4]||"LOGIC",v[5]||"",v[6]||""] ]:[]};return{correct:"",correctPy:"",errors:[]}}
function detective(){let list=ML_DETECTIVE_CASES.filter(x=>x.level===S.difficulty),notice="";if(!list.length){list=ML_DETECTIVE_CASES.filter(x=>x.level==="basic");notice="此难度题库制作中，暂用 Basic。"}let c=list[Math.floor(Math.random()*list.length)],toks=c.tokens.map(x=>[...x]),slots=Object.keys(c.slots),wrongSlots=[],errors={};let n=Math.random()<.1?0:Math.min(slots.length,1+Math.floor(Math.random()*3));shuffle(slots).slice(0,n).forEach(sl=>{let i=toks.findIndex(x=>x[3]===sl),def=normSlot(c.slots[sl]);if(!def.errors.length)return;let ei=Math.floor(Math.random()*def.errors.length),e=def.errors[ei];if(i>=0){toks[i][0]=e[0];toks[i][1]=e[1];wrongSlots.push(sl);errors[sl]=e}});current={kind:"detective",c,toks,wrongSlots,errors,marks:{},notice,closed:false};drawDetective()}
function drawDetective(){let x=current,{c,toks,wrongSlots,marks,notice}=x;$("play").innerHTML=(notice?'<div class="notice">'+notice+'</div>':'')+'<h2>案件档案 · '+tokensHtml(c.titleTokens||[[c.title,'']])+'</h2><div>本案嫌疑：'+wrongSlots.length+' 处</div><div class="casefile" id="case">'+tokensHtml(toks)+'</div>'+(S.english?'<p class="english">Read the story and judge how the events connect. Linking words are intentionally hidden from English support.</p>':'')+'<p class="lensHint">移动/拖动放大镜阅读；点击词语检查。已标记的词再点一次可取消。</p><div id="checks"></div><button id="closecase">结案</button><div id="result"></div>';Object.entries(marks).forEach(([sl,m])=>{let i=toks.findIndex(t=>t[3]===sl),el=document.querySelector('.mltok[data-i="'+i+'"]');if(el)el.classList.add(m.bad?"mark-bad":"mark-good")});document.querySelectorAll(".mltok").forEach(el=>el.onclick=()=>{if(x.closed)return;let i=Number(el.dataset.i),sl=toks[i]&&toks[i][3];if(!sl)return;if(marks[sl]){delete marks[sl];drawDetective();return}let def=normSlot(c.slots[sl]),said=toks[i][0],opts=repairOptions(def.correct,said);$("checks").innerHTML='<div class="options"><button id="good">✔ 用得对</button><button id="bad">✘ 用错了</button></div><div id="repairD"></div>';$("good").onclick=()=>{marks[sl]={bad:false};drawDetective()};$("bad").onclick=()=>{$("repairD").innerHTML='<div class="options">'+opts.map(v=>'<button class="dfix">'+v+'</button>').join("")+'</div>';document.querySelectorAll(".dfix").forEach(b=>b.onclick=()=>{marks[sl]={bad:true,fix:b.textContent};drawDetective()})}});wirePeek($("case"));installLens($("case"),toks);$("closecase").onclick=closeCase}
function installLens(el,tokens){let lens=document.createElement("div");lens.className="ml-lens";el.appendChild(lens);let move=e=>{let r=el.getBoundingClientRect(),p=e.touches?e.touches[0]:e;lens.style.display="block";lens.style.left=(p.clientX-r.left-65)+"px";lens.style.top=(p.clientY-r.top-65)+"px";let target=document.elementFromPoint(p.clientX,p.clientY),tok=target&&target.closest&&target.closest(".mltok"),i=tok?Number(tok.dataset.i):-1;lens.innerHTML=i>=0?'<div style="padding:28px 8px;text-align:center;font-size:24px">'+tokens[i][0]+'<br><small>'+(tokens[i][1]||"")+'</small></div>':""};el.addEventListener("mousemove",move);el.addEventListener("touchmove",move,{passive:true});el.addEventListener("mouseleave",()=>lens.style.display="none")}
function closeCase(){let x=current;if(x.closed)return;x.closed=true;let pts=0;Object.keys(x.c.slots).forEach(sl=>{let bad=x.wrongSlots.includes(sl),m=x.marks[sl],right=normSlot(x.c.slots[sl]).correct;if(bad&&m&&m.bad&&m.fix===right)pts+=2;else if(!bad&&m&&!m.bad)pts+=1;else if(!bad&&m&&m.bad)pts-=1});let q=x.c.question,order=shuffle(q.options.map((o,i)=>({o,i})));$("result").innerHTML='<div class="result"><b>关联词得分：'+pts+'</b><div class="question"><h3>'+tokensHtml(q.q)+'</h3>'+(S.english?'<p>'+q.qEn+'</p>':'')+order.map(v=>'<button class="qopt" data-original="'+v.i+'">'+tokensHtml(v.o)+'</button>').join("")+'</div></div>';document.querySelectorAll(".qopt").forEach(b=>b.onclick=()=>{if(answered)return;let ok=Number(b.dataset.original)===q.answer;if(ok)correct++;lock(".qopt");b.parentElement.insertAdjacentHTML("beforeend",'<p>'+(ok?"✓ +2":"✎ 0")+' · <button id="nxt">NEXT</button></p>');$("nxt").onclick=next});wirePeek($("result"))}
function deck(repaint=false){let d=window.LINKING_WORDS_MASTER_DECK||[],x=repaint&&current&&current.x?current.x:d[Math.floor(Math.random()*d.length)];current={kind:"deck",x};$("play").innerHTML='<h2>WORD DECK</h2><div class="sentence" style="text-align:center;font-size:48px">'+x.zh+'</div>'+(S.reading!=="hanzi"?'<p style="text-align:center">'+x.pinyin+'</p>':"")+(S.english?'<p style="text-align:center">'+x.en+'</p>':"")+'<div class="result">'+x.explanation+'<br>'+x.basic+'</div><button id="nxt">NEXT CARD</button>';$("nxt").onclick=next}
function match(repaint=false){let d=window.LINKING_WORDS_MASTER_DECK||[],x=repaint&&current&&current.x?current.x:d[Math.floor(Math.random()*d.length)],sentence=x.basic||x.mixed||x.challenge||"",blank=sentence;if(repaint&&current&&current.kind==="match"){x=current.x;sentence=current.sentence;blank=current.blank}else{current={kind:"match",x,sentence,blank:""};}if(!(repaint&&current.blank)){x.zh.split("……").filter(Boolean).forEach(p=>blank=blank.replace(p,"_____"));current.blank=blank}let opts=shuffle([x,...shuffle(d.filter(y=>y.id!==x.id)).slice(0,3)]);$("play").innerHTML='<h2>MATCH</h2><div class="sentence">'+blank+'</div><div class="options">'+opts.map(o=>'<button class="mopt" data-id="'+o.id+'">'+o.zh+'</button>').join("")+'</div><div id="result"></div>';document.querySelectorAll(".mopt").forEach(b=>b.onclick=()=>{if(answered)return;let ok=b.dataset.id===x.id;if(ok)correct++;lock(".mopt");$("result").innerHTML='<div class="result">'+(ok?"✓ ":"✎ ")+sentence+'<br><button id="nxt">NEXT</button></div>';$("nxt").onclick=next})}
function build(repaint=false){let d=window.LINKING_WORDS_MASTER_DECK||[],x=repaint&&current&&current.x?current.x:d[Math.floor(Math.random()*d.length)],sentence=x.basic||x.mixed||x.challenge||"",parts=repaint&&current&&current.parts?current.parts:(sentence.match(/[^，。！？；]+[，。！？；]?/g)||[sentence]),chosen=repaint&&current&&current.chosen?current.chosen:[];current={kind:"build",x,sentence,parts,chosen};$("play").innerHTML='<h2>BUILD</h2><div id="zone" class="casefile"></div><div class="options">'+shuffle(parts).map((p,i)=>'<button class="bopt" data-v="'+encodeURIComponent(p)+'">'+p+'</button>').join("")+'</div><button id="resetb">RESET</button> <button id="checkb">CHECK</button><div id="result"></div>';document.querySelectorAll(".bopt").forEach(b=>b.onclick=()=>{if(answered||b.disabled)return;b.disabled=true;chosen.push(decodeURIComponent(b.dataset.v));$("zone").textContent=chosen.join("")});$("resetb").onclick=()=>{if(answered)return;chosen=[];$("zone").textContent="";document.querySelectorAll(".bopt").forEach(b=>b.disabled=false)};$("checkb").onclick=()=>{if(answered)return;let ok=chosen.join("")===parts.join("");if(ok)correct++;lock(".bopt,#checkb,#resetb");$("result").innerHTML='<div class="result">'+(ok?"✓ ":"✎ ")+sentence+'<br><button id="nxt">NEXT</button></div>';$("nxt").onclick=next}}
reset();
</script></body></html>
