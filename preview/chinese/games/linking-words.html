<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>关联词 V3</title><link rel="stylesheet" href="../core/zh-core.css"><style>body{font-family:Arial,"Microsoft YaHei",sans-serif;background:#f3efe5;color:#202033;margin:0}.app{max-width:1080px;margin:auto;padding:18px}.panel{background:#fffdf8;border:2px solid #202033;border-radius:22px;padding:18px;box-shadow:6px 6px 0 #202033;margin:18px 0}button,select{font:inherit;border:2px solid #202033;border-radius:12px;background:#fff;padding:9px 12px;font-weight:800}.controls,.modes{display:flex;gap:8px;flex-wrap:wrap}.modes button.active{background:#ffd75a}.sentence{font-size:25px;line-height:2.1}.teacher{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}.avatar svg{width:140px}.bubble{border:3px solid #202033;border-radius:25px;padding:20px;background:white;position:relative}.bubble:before{content:"";position:absolute;left:-18px;top:45px;border-width:12px 18px 12px 0;border-style:solid;border-color:transparent #202033 transparent transparent}.tok{padding:3px;border-radius:5px;cursor:pointer}.tok.selected{background:#ffd0cd;outline:2px solid #df4b45}.options{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.casefile{position:relative;border:2px solid #202033;padding:20px;background:#fff;font-size:21px;line-height:2.1;min-height:220px}.lensHint{font-size:13px}.score{font-weight:900}.hidden{display:none}.result{padding:14px;background:#eee9dc;border-left:6px solid #202033;margin-top:12px}@media(max-width:600px){.teacher{grid-template-columns:90px 1fr}.avatar svg{width:85px}.sentence{font-size:20px}.bubble{padding:12px}}</style></head><body><div class="app"><h1>关联词 Logic Lab · V3</h1><div class="panel controls"><select id="difficulty"><option value="basic">Basic</option><option value="mixed">Mixed</option><option value="challenge">Challenge</option></select><select id="reading"><option value="pinyin">拼音 Pinyin</option><option value="ruby">汉字+拼音 Hanzi+Pinyin</option><option value="hanzi">汉字挑战 Hanzi Only</option></select><button id="english">English ON</button></div><div class="modes"><button data-mode="teacher" class="active">👩‍🏫 老师说错了！</button><button data-mode="detective">🔎 DETECTIVE</button></div><div class="panel"><div class="score" id="status"></div><div id="play"></div></div></div><script src="../../../data/linking-words-masterdeck.js"></script><script src="../core/zh-core.js"></script><script src="../data/linking-words/teacher-scenes.js"></script><script src="../data/linking-words/detective-cases.js"></script><script>
const $=x=>document.getElementById(x),S=MLZH.settings();$("difficulty").value=S.difficulty;$("reading").value=S.reading;$("english").textContent="English "+(S.english?"ON":"OFF");let mode="teacher",peek=0,round=0,correct=0,used=new Set(),audio=MLZH.player("../audio/linking-words/");
function save(){S.difficulty=$("difficulty").value;S.reading=$("reading").value;MLZH.save(S)}$("difficulty").onchange=()=>{save();reset()};$("reading").onchange=()=>{save();render()};$("english").onclick=()=>{S.english=!S.english;$("english").textContent="English "+(S.english?"ON":"OFF");MLZH.save(S);render()};document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-mode]").forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.mode;reset()});
function avatar(face="confident"){let mouth=face==="smug"?"M38 64 Q50 72 62 62":face==="shocked"?"M45 62 Q50 75 55 62":face==="proud"?"M37 61 Q50 78 64 60":"M39 64 Q50 70 61 64",brow=face==="smug"?"M32 38 L44 35 M56 35 L68 38":"M32 37 L44 37 M56 37 L68 37";return '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#ffd75a" stroke="#202033" stroke-width="3"/><path d="'+brow+'" stroke="#202033" stroke-width="3"/><circle cx="39" cy="47" r="3"/><circle cx="61" cy="47" r="3"/><path d="'+mouth+'" fill="none" stroke="#202033" stroke-width="3" stroke-linecap="round"/></svg>'}
function tokensHtml(tokens){return tokens.map((t,i)=>'<span class="tok" data-i="'+i+'">'+MLZH.renderTokens([{hz:t[0],py:t[1],role:t[2]}],S.reading)+'</span>').join("")}function wirePeek(root){if(S.reading==="hanzi")MLZH.wirePeek(root,()=>peek++)}function reset(){round=correct=peek=0;used.clear();next()}function next(){if(round>=10)return finish();round++;render()}function finish(){let stars=peek<=2?"⭐⭐⭐":peek<=6?"⭐⭐":"⭐";$("status").textContent="Session complete";$("play").innerHTML='<div style="text-align:center;padding:30px"><div style="font-size:58px;font-weight:900">'+correct+'/10</div><p>本局偷看拼音 '+peek+' 次 · '+stars+'</p><button id="again">PLAY ANOTHER 10</button></div>';$("again").onclick=reset}function render(){save();$("status").textContent="Round "+round+"/10 · "+correct+" correct";mode==="teacher"?teacher():detective()}
function safeEnglish(text,wrong){if(!S.english)return "";if(!wrong)return text;return "Understand the situation first. The missing/changed connector is not shown in English."}function teacher(){let list=ML_TEACHER_SCENES.scenes.filter(x=>x.level===S.difficulty);if(!list.length)list=ML_TEACHER_SCENES.scenes;let avail=list.filter(x=>!used.has(x.id));if(!avail.length){used.clear();avail=list}let sc=avail[Math.floor(Math.random()*avail.length)];used.add(sc.id);let wrong=Math.random()>.3?sc.errors[Math.floor(Math.random()*sc.errors.length)]:null,toks=sc.tokens.map(x=>[...x]);if(wrong){let idx=toks.findIndex(x=>x[3]===wrong[0]);toks[idx][0]=wrong[1]}let opener=ML_TEACHER_SCENES.openers[Math.floor(Math.random()*ML_TEACHER_SCENES.openers.length)];$("play").innerHTML='<div class="teacher"><div class="avatar">'+avatar("confident")+'</div><div class="bubble"><b>'+opener+'</b><div class="sentence">'+tokensHtml(toks)+'</div>'+(safeEnglish(sc.en,wrong)?'<div>'+safeEnglish(sc.en,wrong)+'</div>':"")+'</div></div><div class="options"><button id="noerr">✅ 老师没说错</button></div><div id="repair"></div><div id="result"></div>';let selected=null;document.querySelectorAll(".tok").forEach(el=>el.onclick=()=>{document.querySelectorAll(".tok").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");selected=+el.dataset.i;let slot=toks[selected][3];if(!slot)return;$("repair").innerHTML='<div class="options">'+sc.tokens.filter(x=>x[3]).map(x=>'<button class="fix">'+x[0]+'</button>').join("")+'</div>';document.querySelectorAll(".fix").forEach(b=>b.onclick=()=>judgeTeacher(wrong,toks[selected][3],b.textContent,sc)});$("noerr").onclick=()=>judgeTeacher(wrong,null,null,sc);wirePeek($("play"))}
function judgeTeacher(wrong,slot,fix,sc){let ok=wrong?slot===wrong[0]&&fix===sc.tokens.find(x=>x[3]===wrong[0])[0]:slot===null;if(ok)correct++;let line=ok?ML_TEACHER_SCENES.praise[Math.floor(Math.random()*ML_TEACHER_SCENES.praise.length)]:ML_TEACHER_SCENES.tease[Math.floor(Math.random()*ML_TEACHER_SCENES.tease.length)];$("result").innerHTML=(ok?"":'<div class="ml-zero"><svg viewBox="0 0 260 260"><path d="M130 25 C55 20 22 80 35 145 C50 220 190 235 225 145 C250 75 195 20 130 25"/></svg></div>')+'<div class="result"><b>'+line+'</b><br>'+sc.tokens.map(x=>x[0]).join("")+(wrong?'<br>'+wrong[3]+' · '+wrong[4]:"")+'<br><button id="nxt">NEXT</button></div>';$("nxt").onclick=next;setTimeout(()=>{let z=document.querySelector(".ml-zero");if(z)z.remove()},900)}
function detective(){let list=ML_DETECTIVE_CASES.filter(x=>x.level===S.difficulty);if(!list.length)list=ML_DETECTIVE_CASES;let c=list[Math.floor(Math.random()*list.length)],toks=c.tokens.map(x=>[...x]),slots=Object.keys(c.slots),wrongSlots=[];let count=Math.random()<.1?0:Math.min(slots.length,1+Math.floor(Math.random()*3));shuffle(slots).slice(0,count).forEach(sl=>{let idx=toks.findIndex(x=>x[3]===sl),e=c.slots[sl];toks[idx][0]=e[1];wrongSlots.push(sl)});$("play").innerHTML='<h2>案件档案 · '+c.title+'</h2><div>本案嫌疑：'+(S.difficulty==="challenge"?"?":wrongSlots.length+" 处")+'</div><div class="casefile" id="case">'+tokensHtml(toks)+'</div>'+(S.english?'<p>Read the story and judge the logic between the events. Connector meanings are intentionally hidden.</p>':"")+'<p class="lensHint">移动/拖动放大镜阅读；点击词语检查。</p><div id="checks"></div><button id="closecase">结案</button><div id="result"></div>';let marks={};document.querySelectorAll(".tok").forEach(el=>el.onclick=()=>{let idx=+el.dataset.i,sl=toks[idx][3];if(!sl)return;$("checks").innerHTML='<div class="options"><button id="good">✔ 用得对</button><button id="bad">✘ 用错了</button></div>';$("good").onclick=()=>marks[sl]={bad:false};$("bad").onclick=()=>{let correctWord=c.slots[sl][0];$("checks").innerHTML='<button id="fix">'+correctWord+'</button>';$("fix").onclick=()=>marks[sl]={bad:true,fix:correctWord}}});wirePeek($("case"));installLens($("case"),c.tokens);$("closecase").onclick=()=>closeCase(c,wrongSlots,marks)}
function installLens(el,tokens){let lens=document.createElement("div");lens.className="ml-lens";el.appendChild(lens);let move=e=>{let r=el.getBoundingClientRect(),p=e.touches?e.touches[0]:e;lens.style.display="block";lens.style.left=(p.clientX-r.left-65)+"px";lens.style.top=(p.clientY-r.top-65)+"px";let target=document.elementFromPoint(p.clientX,p.clientY);let tok=target&&target.closest&&target.closest(".tok");lens.innerHTML=tok?'<div style="padding:28px 8px;text-align:center;font-size:24px">'+tok.textContent+'<br><small>'+((tokens[+tok.dataset.i]||[])[1]||"")+'</small></div>':""};el.addEventListener("mousemove",move);el.addEventListener("touchmove",move,{passive:true});el.addEventListener("mouseleave",()=>lens.style.display="none")}function closeCase(c,wrong,marks){let pts=0;Object.keys(c.slots).forEach(sl=>{let isWrong=wrong.includes(sl),m=marks[sl];if(isWrong&&m&&m.bad&&m.fix===c.slots[sl][0])pts+=2;else if(!isWrong&&m&&!m.bad)pts+=1;else if(!isWrong&&m&&m.bad)pts-=1});$("result").innerHTML='<div class="result"><b>关联词得分：'+pts+'</b><h3>'+c.question.q+'</h3>'+(S.english?'<p>'+c.question.qEn+'</p>':"")+'<div class="options">'+c.question.options.map((o,i)=>'<button class="qopt" data-i="'+i+'">'+o+'</button>').join("")+'</div></div>';document.querySelectorAll(".qopt").forEach(b=>b.onclick=()=>{let ok=+b.dataset.i===c.question.answer;if(ok)correct++;b.parentElement.insertAdjacentHTML("afterend",'<p>'+(ok?"✓ +2":"✎ 0")+' · <button id="nxt">NEXT</button></p>');$("nxt").onclick=next})}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}reset();
</script></body></html>
