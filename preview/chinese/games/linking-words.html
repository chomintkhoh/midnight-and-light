<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>关联词 V3</title><link rel="stylesheet" href="../core/zh-core.css"><style>body{font-family:Arial,"Microsoft YaHei",sans-serif;background:#f3efe5;color:#202033;margin:0}.app{max-width:1080px;margin:auto;padding:18px}.panel{background:#fffdf8;border:2px solid #202033;border-radius:22px;padding:18px;box-shadow:6px 6px 0 #202033;margin:18px 0}button,select{font:inherit;border:2px solid #202033;border-radius:12px;background:#fff;padding:9px 12px;font-weight:800}.controls,.modes{display:flex;gap:8px;flex-wrap:wrap}.modes button.active{background:#ffd75a}.sentence{font-size:25px;line-height:1.9}.teacher{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;align-items:center}.teacher .sentence{margin-top:14px}.teacher .bubble{max-width:760px}.casefile{max-width:860px;margin:12px auto;box-sizing:border-box}.casefile .ml-reading{display:block;text-align:left}.casefile .ml-reading{max-width:100%}.bubble .ml-reading{display:inline}.mltok.selected{background:#ffd0cd;outline:2px solid #df4b45;border-radius:4px}.avatar svg{width:140px}.bubble{border:3px solid #202033;border-radius:25px;padding:20px;background:white;position:relative}.bubble:before{content:"";position:absolute;left:-18px;top:45px;border-width:12px 18px 12px 0;border-style:solid;border-color:transparent #202033 transparent transparent}.tok{padding:3px;border-radius:5px;cursor:pointer}.tok.selected{background:#ffd0cd;outline:2px solid #df4b45}.options{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.casefile{position:relative;border:2px solid #202033;padding:20px;background:#fff;font-size:21px;line-height:2.1;min-height:220px}.lensHint{font-size:13px}.score{font-weight:900}.hidden{display:none}.result{padding:14px;background:#eee9dc;border-left:6px solid #202033;margin-top:12px}@media(max-width:600px){.app{padding:10px}.panel{padding:13px}.teacher{grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:start}.avatar svg{width:68px}.sentence{font-size:20px}.bubble{padding:13px;border-width:2px}.bubble:before{left:-13px;top:30px;border-width:9px 13px 9px 0}.casefile{padding:15px;min-height:180px}.controls select,.controls button{max-width:100%}}</style></head><body><div class="app"><h1>关联词 Logic Lab · V3</h1><div class="panel controls"><select id="difficulty"><option value="basic">Basic</option><option value="mixed">Mixed</option><option value="challenge">Challenge</option></select><select id="reading"><option value="pinyin">拼音 Pinyin</option><option value="ruby">汉字+拼音 Hanzi+Pinyin</option><option value="hanzi">汉字挑战 Hanzi Only</option></select><button id="english">English ON</button></div><div class="modes"><button data-mode="teacher" class="active">👩‍🏫 老师说错了！</button><button data-mode="detective">🔎 DETECTIVE</button><button data-mode="deck">🃏 WORD DECK</button><button data-mode="match">🧩 MATCH</button><button data-mode="build">🏗️ BUILD</button></div><div class="panel"><div class="score" id="status"></div><div id="play"></div></div></div><script src="../../data/linking-words-masterdeck.js"></script><script src="../core/zh-core.js"></script><script src="../data/linking-words/teacher-scenes.js"></script><script src="../data/linking-words/detective-cases.js"></script><script>
const $=x=>document.getElementById(x),S=MLZH.settings();$("difficulty").value=S.difficulty;$("reading").value=S.reading;$("english").textContent="English "+(S.english?"ON":"OFF");let mode="teacher",peek=0,round=0,correct=0,used=new Set(),audio=MLZH.player("../audio/linking-words/"),current=null,answered=false,lastAudio=null;
function save(){S.difficulty=$("difficulty").value;S.reading=$("reading").value;MLZH.save(S)}$("difficulty").onchange=()=>{save();reset()};$("reading").onchange=()=>{save();paint()};$("english").onclick=()=>{S.english=!S.english;$("english").textContent="English "+(S.english?"ON":"OFF");MLZH.save(S);paint()};document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-mode]").forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.mode;reset()});
function avatar(face="confident"){let mouth=face==="smug"?"M38 64 Q50 72 62 62":face==="shocked"?"M45 62 Q50 75 55 62":face==="proud"?"M37 61 Q50 78 64 60":"M39 64 Q50 70 61 64",brow=face==="smug"?"M32 38 L44 35 M56 35 L68 38":"M32 37 L44 37 M56 37 L68 37";return '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#ffd75a" stroke="#202033" stroke-width="3"/><path d="'+brow+'" stroke="#202033" stroke-width="3"/><circle cx="39" cy="47" r="3"/><circle cx="61" cy="47" r="3"/><path d="'+mouth+'" fill="none" stroke="#202033" stroke-width="3" stroke-linecap="round"/></svg>'}
function tokensHtml(tokens){return MLZH.renderTokens(tokens,S.reading)}function wirePeek(root){if(S.reading==="hanzi")MLZH.wirePeek(root,()=>peek++)}function reset(){round=correct=peek=0;used.clear();current=null;answered=false;next()}function next(){if(round>=10)return finish();round++;current=null;answered=false;render()}function paint(){if(current&&current.mode===mode){mode==="teacher"?drawTeacher():mode==="detective"?drawDetective():render()}else render()}function lockAnswers(){answered=true;document.querySelectorAll(".mopt,.bopt,#checkb,#noerr,.fix,#good,#bad,.qopt").forEach(b=>b.disabled=true)}function finish(){let stars=peek<=2?"⭐⭐⭐":peek<=6?"⭐⭐":"⭐";$("status").textContent="Session complete";$("play").innerHTML='<div style="text-align:center;padding:30px"><div style="font-size:58px;font-weight:900">'+correct+'/10</div><p>本局偷看拼音 '+peek+' 次 · '+stars+'</p><button id="again">PLAY ANOTHER 10</button></div>';$("again").onclick=reset}function render(){save();$("status").textContent="Round "+round+"/10 · "+correct+" correct";mode==="teacher"?teacher():mode==="detective"?detective():mode==="deck"?deck():mode==="match"?match():build()}
function safeEnglish(text){return S.english?"老师想说的意思："+text:""}function deck(){let d=window.LINKING_WORDS_MASTER_DECK||[],x=d[Math.floor(Math.random()*d.length)];$("play").innerHTML='<h2>WORD DECK</h2><div class="sentence" style="text-align:center;font-size:48px">'+x.zh+'</div>'+(S.reading!=="hanzi"?'<p style="text-align:center">'+x.pinyin+'</p>':"")+(S.english?'<p style="text-align:center">'+x.en+'</p>':"")+'<div class="result">'+x.explanation+'<br>'+x[S.difficulty]+'</div><button id="nxt">NEXT CARD</button>';$("nxt").onclick=render}
function match(){let d=window.LINKING_WORDS_MASTER_DECK||[],valid=d.filter(x=>x[S.difficulty]&&x.zh.split("……").some(p=>x[S.difficulty].includes(p))),x=valid[Math.floor(Math.random()*valid.length)],sentence=x[S.difficulty];x.zh.split("……").forEach(p=>sentence=sentence.replace(p,"_____"));let wrong=d.filter(y=>y.learnerFunction!==x.learnerFunction&&y.traditionalRelation!==x.traditionalRelation).sort(()=>Math.random()-.5).slice(0,3),opts=[x,...wrong].sort(()=>Math.random()-.5);$("play").innerHTML='<h2>MATCH</h2><div class="sentence">'+sentence+'</div><div class="options">'+opts.map(o=>'<button class="mopt" data-id="'+o.id+'">'+o.zh+'</button>').join("")+'</div><div id="result"></div>';document.querySelectorAll(".mopt").forEach(b=>b.onclick=()=>{let ok=b.dataset.id===x.id;if(ok)correct++;$("result").innerHTML='<div class="result">'+(ok?"✓ ":"✎ ")+x[S.difficulty]+'<br><button id="nxt">NEXT</button></div>';$("nxt").onclick=next})}
function build(){let d=window.LINKING_WORDS_MASTER_DECK||[],x=d[Math.floor(Math.random()*d.length)],sentence=x[S.difficulty],parts=[],rest=sentence;x.zh.split("……").filter(Boolean).forEach(p=>rest=rest.replace(p,"§"+p+"§"));rest.split("§").filter(Boolean).forEach(p=>{if(x.zh.includes(p))parts.push(p);else p.split(/([，。；！？])/).filter(Boolean).forEach(q=>{if(q.length>8){let mid=Math.ceil(q.length/2);parts.push(q.slice(0,mid),q.slice(mid))}else parts.push(q)})});let chosen=[];$("play").innerHTML='<h2>BUILD</h2><div id="zone" class="casefile"></div><div class="options">'+shuffle(parts).map((p,i)=>'<button class="bopt" data-v="'+encodeURIComponent(p)+'">'+p+'</button>').join("")+'</div><button id="resetb">RESET</button> <button id="checkb">CHECK</button><div id="result"></div>';document.querySelectorAll(".bopt").forEach(b=>b.onclick=()=>{if(b.disabled)return;b.disabled=true;chosen.push(decodeURIComponent(b.dataset.v));$("zone").textContent=chosen.join("")});$("resetb").onclick=()=>{chosen=[];$("zone").textContent="";document.querySelectorAll(".bopt").forEach(b=>b.disabled=false)};$("checkb").onclick=()=>{let ok=chosen.join("")===parts.join("");if(ok)correct++;$("result").innerHTML='<div class="result">'+(ok?"✓ ":"✎ ")+sentence+'<br><button id="nxt">NEXT</button></div>';$("nxt").onclick=next}}
function teacher(){let requested=S.difficulty,list=ML_TEACHER_SCENES.scenes.filter(x=>x.level===requested);let notice="";if(!list.length){list=ML_TEACHER_SCENES.scenes.filter(x=>x.level==="basic");notice="此难度题库制作中，暂用 Basic。"}let avail=list.filter(x=>!used.has(x.id));if(!avail.length){used.clear();avail=list}let sc=avail[Math.floor(Math.random()*avail.length)];used.add(sc.id);let ei=Math.random()>.3?Math.floor(Math.random()*sc.errors.length):-1,wrong=ei>=0?sc.errors[ei]:null,toks=sc.tokens.map(x=>[...x]);if(wrong){let idx=toks.findIndex(x=>x[3]===wrong[0]);toks[idx][0]=wrong[1];toks[idx][1]=wrong[2]}let oi=Math.floor(Math.random()*ML_TEACHER_SCENES.openers.length),opener=ML_TEACHER_SCENES.openers[oi];current={mode:"teacher",sc,wrong,ei,toks,oi,opener,notice};drawTeacher();}function drawTeacher(){let {sc,wrong,ei,toks,oi,opener,notice}=current;$("play").innerHTML='+(notice?'<div class="result">'+notice+'</div>':'')+'<div class="teacher"><div class="avatar" id="avatar">'+avatar("confident")+'</div><div class="bubble"><b>'+opener+'</b><div class="sentence">'+tokensHtml(toks)+'</div>'+(safeEnglish(sc.en)?'<div>'+safeEnglish(sc.en)+'</div>':"")+'</div></div><div class="options"><button id="noerr">✅ 老师没说错</button></div><div id="repair"></div><div id="result"></div>';let selected=null;document.querySelectorAll(".mltok").forEach(el=>el.onclick=()=>{document.querySelectorAll(".mltok").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");selected=+el.dataset.i;let slot=toks[selected]&&toks[selected][3];if(!slot)return;let correctTok=sc.tokens.find(x=>x[3]===slot),correctWord=correctTok&&correctTok[0],wrongWord=wrong&&wrong[0]===slot?wrong[1]:toks[selected][0],pool=(window.LINKING_WORDS_MASTER_DECK||[]).map(x=>x.zh.split("……")[0]).filter(x=>x&&x!==correctWord&&x!==wrongWord),third=pool[Math.floor(Math.random()*pool.length)]||"所以",opts=shuffle([correctWord,wrongWord,third].filter((x,i,a)=>x&&a.indexOf(x)===i));$("repair").innerHTML='<div class="options">'+opts.map(x=>'<button class="fix">'+x+'</button>').join("")+'</div>';document.querySelectorAll(".fix").forEach(b=>b.onclick=()=>judgeTeacher(wrong,slot,b.textContent,sc));});$("noerr").onclick=()=>judgeTeacher(wrong,null,null,sc);wirePeek($("play"))}
function judgeTeacher(wrong,slot,fix,sc){if(answered)return;let ok=wrong?slot===wrong[0]&&fix===sc.tokens.find(x=>x[3]===wrong[0])[0]:slot===null;if(ok)correct++;lockAnswers();let falseAccusation=!wrong&&slot!==null,line=ok?ML_TEACHER_SCENES.praise[Math.floor(Math.random()*ML_TEACHER_SCENES.praise.length)]:falseAccusation?(ML_TEACHER_SCENES.teaseRight||"老师这次可没有说错哦。"):ML_TEACHER_SCENES.tease[Math.floor(Math.random()*ML_TEACHER_SCENES.tease.length)];let av=$("avatar");if(av)av.innerHTML=avatar(ok?(wrong?"shocked":"proud"):"smug");$("result").innerHTML=(ok?"":'')+'<div class="result"><b>'+line+'</b><br>'+sc.tokens.map(x=>x[0]).join("")+(wrong?'<br>'+wrong[4]+' · '+wrong[5]:"")+'<br><button id="nxt">NEXT</button></div>';if(!ok){let z=document.createElement("div");z.className="ml-zero";z.innerHTML='<svg viewBox="0 0 260 260"><path d="M130 25 C55 20 22 80 35 145 C50 220 190 235 225 145 C250 75 195 20 130 25"/></svg>';document.body.appendChild(z);setTimeout(()=>z.remove(),1600)}$("nxt").onclick=next}
function detective(){let list=ML_DETECTIVE_CASES.filter(x=>x.level===S.difficulty);if(!list.length)list=ML_DETECTIVE_CASES;let c=list[Math.floor(Math.random()*list.length)],toks=c.tokens.map(x=>[...x]),slots=Object.keys(c.slots),wrongSlots=[];let count=Math.random()<.1?0:Math.min(slots.length,1+Math.floor(Math.random()*3));shuffle(slots).slice(0,count).forEach(sl=>{let idx=toks.findIndex(x=>x[3]===sl),e=c.slots[sl];toks[idx][0]=e[1];wrongSlots.push(sl)});$("play").innerHTML='<h2>案件档案 · '+c.title+'</h2><div>本案嫌疑：'+(S.difficulty==="challenge"?"?":wrongSlots.length+" 处")+'</div><div class="casefile" id="case">'+tokensHtml(toks)+'</div>'+(S.english?'<p>Read the story and judge the logic between the events. Connector meanings are intentionally hidden.</p>':"")+'<p class="lensHint">移动/拖动放大镜阅读；点击词语检查。</p><div id="checks"></div><button id="closecase">结案</button><div id="result"></div>';let marks={};document.querySelectorAll(".mltok").forEach(el=>el.onclick=()=>{let idx=+el.dataset.i,sl=toks[idx]&&toks[idx][3];if(!sl)return;$("checks").innerHTML='<div class="options"><button id="good">✔ 用得对</button><button id="bad">✘ 用错了</button></div>';$("good").onclick=()=>marks[sl]={bad:false};$("bad").onclick=()=>{let correctWord=c.slots[sl][0];$("checks").innerHTML='<button id="fix">'+correctWord+'</button>';$("fix").onclick=()=>marks[sl]={bad:true,fix:correctWord}}});wirePeek($("case"));installLens($("case"),c.tokens);$("closecase").onclick=()=>closeCase(c,wrongSlots,marks)}
function installLens(el,tokens){let lens=document.createElement("div");lens.className="ml-lens";el.appendChild(lens);let move=e=>{let r=el.getBoundingClientRect(),p=e.touches?e.touches[0]:e;lens.style.display="block";lens.style.left=(p.clientX-r.left-65)+"px";lens.style.top=(p.clientY-r.top-65)+"px";let target=document.elementFromPoint(p.clientX,p.clientY);let tok=target&&target.closest&&target.closest(".mltok");lens.innerHTML=tok?'<div style="padding:28px 8px;text-align:center;font-size:24px">'+tok.textContent+'<br><small>'+((tokens[+tok.dataset.i]||[])[1]||"")+'</small></div>':""};el.addEventListener("mousemove",move);el.addEventListener("touchmove",move,{passive:true});el.addEventListener("mouseleave",()=>lens.style.display="none")}function closeCase(c,wrong,marks){let pts=0;Object.keys(c.slots).forEach(sl=>{let isWrong=wrong.includes(sl),m=marks[sl];if(isWrong&&m&&m.bad&&m.fix===c.slots[sl][0])pts+=2;else if(!isWrong&&m&&!m.bad)pts+=1;else if(!isWrong&&m&&m.bad)pts-=1});$("result").innerHTML='<div class="result"><b>关联词得分：'+pts+'</b><h3>'+c.question.q+'</h3>'+(S.english?'<p>'+c.question.qEn+'</p>':"")+'<div class="options">'+c.question.options.map((o,i)=>'<button class="qopt" data-i="'+i+'">'+o+'</button>').join("")+'</div></div>';document.querySelectorAll(".qopt").forEach(b=>b.onclick=()=>{let ok=+b.dataset.i===c.question.answer;if(ok)correct++;b.parentElement.insertAdjacentHTML("afterend",'<p>'+(ok?"✓ +2":"✎ 0")+' · <button id="nxt">NEXT</button></p>');$("nxt").onclick=next})}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}reset();
</script></body></html>
