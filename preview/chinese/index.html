<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow" /><meta name="viewport" content="width=device-width,initial-scale=1">
<title>华文练习</title>
<style>
:root{--ink:#202033;--paper:#f3efe5;--yellow:#ffd75a;--bar-h:64px}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);font-family:Arial,"Microsoft YaHei",sans-serif;color:var(--ink)}
.topbar{min-height:64px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fffdf8;border-bottom:2px solid var(--ink)}
.tabs{display:flex;flex:1;gap:8px}.tab,.scale button{min-height:48px;border:2px solid var(--ink);border-radius:12px;background:#fff;font:700 18px/1 Arial,"Microsoft YaHei",sans-serif;padding:8px 14px;cursor:pointer}
.tab{flex:1}.tab.active,.scale button.active{background:var(--yellow)}
.scale{display:flex;gap:6px;margin-left:auto}.scale button{min-width:52px}
.frames{height:calc(100dvh - var(--bar-h));overflow:hidden}.practice{display:none;width:100%;height:100%;border:0;background:white}.practice.active{display:block}
@media(max-width:600px){.topbar{flex-wrap:wrap;padding:8px}.tabs{order:1;flex:0 0 100%;width:100%}.tab{width:50%;padding:8px 6px}.scale{order:2;width:100%;justify-content:flex-end}.scale button{min-width:58px}}
</style></head>
<body>
<nav class="topbar" id="topbar" aria-label="华文练习切换">
  <div class="tabs">
    <button class="tab" data-tab="vocab">📚 词语</button>
    <button class="tab" data-tab="linking">🔗 关联词</button>
  </div>
  <div class="scale" aria-label="字级">
    <button data-scale="0.85">A-</button><button data-scale="1">A</button><button data-scale="1.25">A+</button>
  </div>
</nav>
<div class="frames">
  <iframe id="vocabFrame" class="practice" src="../../chinese-vocab-practice.html" title="词语练习"></iframe>
  <iframe id="linkingFrame" class="practice" src="games/linking-words.html" title="关联词练习"></iframe>
</div>
<script>
const KEY="ml.zh.settings",bar=document.getElementById("topbar"),frames=[vocabFrame,linkingFrame];
function settings(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}}
function store(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function setBar(){document.documentElement.style.setProperty("--bar-h",bar.getBoundingClientRect().height+"px")}
new ResizeObserver(setBar).observe(bar);setBar();
function broadcastScale(v){frames.forEach(f=>{try{f.contentWindow.postMessage({type:"ml.zh.scale",scale:v},"*")}catch(e){}})}
function applyScale(v){v=Number(v)||1;document.querySelectorAll("[data-scale]").forEach(b=>b.classList.toggle("active",Number(b.dataset.scale)===v));broadcastScale(v)}
function selectTab(tab,pushHash=true){tab=tab==="linking"?"linking":"vocab";document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));vocabFrame.classList.toggle("active",tab==="vocab");linkingFrame.classList.toggle("active",tab==="linking");let s=settings();s.tab=tab;store(s);if(pushHash&&location.hash!=="#"+tab)history.replaceState(null,"","#"+tab);frames.forEach(f=>{try{f.contentWindow.postMessage({type:"ml.zh.tab",tab},"*")}catch(e){}})}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>selectTab(b.dataset.tab));
document.querySelectorAll("[data-scale]").forEach(b=>b.onclick=()=>{let s=settings();s.scale=Number(b.dataset.scale);store(s);applyScale(s.scale)});
frames.forEach(f=>f.addEventListener("load",()=>broadcastScale(settings().scale||1)));
window.addEventListener("hashchange",()=>selectTab(location.hash.slice(1),false));
let s=settings(),initial=["vocab","linking"].includes(location.hash.slice(1))?location.hash.slice(1):(s.tab||"vocab");selectTab(initial,true);applyScale(s.scale||1);
</script></body></html>
