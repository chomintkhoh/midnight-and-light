<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>关联词 Logic Lab</title><style>
*{box-sizing:border-box} :root{--ink:#202033;--paper:#fffdf8;--line:#d8d2c5;--yellow:#ffd75a;--red:#ef6b65;--blue:#6f91d8;--green:#72b68a;--purple:#8b79bd}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;color:var(--ink);background:#f3efe5;background-image:linear-gradient(#ded8ca 1px,transparent 1px),linear-gradient(90deg,#ded8ca 1px,transparent 1px);background-size:28px 28px}button,select{font:inherit}.app{max-width:1120px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{font-weight:900}.back{color:var(--ink)}.hero{padding:28px 4px 14px}.hero h1{font-size:clamp(34px,7vw,68px);margin:0;letter-spacing:-2px}.hero p{font-size:18px;margin:8px 0}.toolbar{position:sticky;top:8px;z-index:10;background:#fffdf8ee;backdrop-filter:blur(8px);border:2px solid var(--ink);border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;box-shadow:5px 5px 0 var(--ink)}button,select{border:2px solid var(--ink);border-radius:12px;background:#fff;padding:9px 12px;font-weight:800;cursor:pointer}.on{background:var(--yellow)}.hub{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:26px 0}.game{min-height:145px;text-align:left;padding:15px;border:2px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);background:var(--paper);transition:.15s}.game:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}.game.active{background:var(--yellow)}.game .icon{font-size:32px}.game b{display:block;font-size:19px;margin:8px 0}.stage{background:var(--paper);border:2px solid var(--ink);border-radius:24px;padding:20px;box-shadow:7px 7px 0 var(--ink);min-height:500px}.hidden{display:none!important}.decktop{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{display:inline-block;padding:5px 9px;border:2px solid var(--ink);border-radius:999px;font-size:12px;font-weight:900}.flash{max-width:720px;height:390px;margin:22px auto;perspective:1200px}.inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:.45s;cursor:pointer}.flash.flip .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border:3px solid var(--ink);border-radius:26px;background:#fff;padding:30px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:9px 9px 0 var(--ink)}.face.backface{transform:rotateY(180deg);align-items:stretch;text-align:left;background:#fff7cf}.zh{font-size:clamp(38px,7vw,68px);font-weight:1000}.py,.en{font-size:20px;margin-top:10px}.context{font-size:21px;line-height:1.7;padding:16px;background:#fff;border:2px solid var(--ink);border-radius:14px;margin-top:14px}.nav,.choices,.cards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.primary{background:var(--yellow)}.taskhead{display:flex;justify-content:space-between;align-items:center}.taskhead h2{margin:0}.prompt{font-size:23px;line-height:1.7;background:#fff7cf;border:2px solid var(--ink);padding:18px;border-radius:16px;margin:22px 0}.choice,.chunk{font-size:18px;min-width:150px;box-shadow:3px 3px 0 var(--ink)}.choice.good{background:#ccebd5}.choice.bad{background:#ffd0cd}.buildzone{min-height:105px;border:3px dashed var(--ink);border-radius:18px;padding:14px;margin:18px 0;display:flex;gap:8px;flex-wrap:wrap;align-content:flex-start}.chunk.used{opacity:.35}.detectiveBoard{background:#fff;border:2px solid var(--ink);padding:22px;border-radius:16px;font-size:23px;line-height:1.8}.suspect{padding:2px 5px;border-radius:6px;cursor:pointer}.suspect.marked{background:#ffd0cd;outline:3px solid var(--red);text-decoration:line-through}.feedback{margin:18px 0;padding:14px;border-left:6px solid var(--ink);background:#eee9dc;min-height:54px;line-height:1.5}.switchbox{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}.logiccard{border:2px solid var(--ink);border-radius:16px;padding:18px;background:#fff}.arrow{font-size:34px;font-weight:900}.functionMap{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.dot{padding:6px 9px;border-radius:999px;border:1px solid var(--ink);font-size:11px;font-weight:900}.count{font-weight:900}@media(max-width:800px){.hub{grid-template-columns:1fr 1fr}.game:last-child{grid-column:1/-1}.stage{padding:13px}.flash{height:440px}.switchbox{grid-template-columns:1fr}.arrow{transform:rotate(90deg);text-align:center}.hero h1{letter-spacing:-1px}}
</style></head><body><div class="app"><div class="top"><div class="brand">ミッドナイトとライト · Midnight & Light</div><a class="back" href="../index.html">Home</a></div><div class="hero"><span class="pill">LOGIC LAB · 46 CARDS</span><h1>关联词</h1><p>Don’t memorize a list. Build the logic.</p></div>
<div class="toolbar"><select id="difficulty"><option value="basic">Basic</option><option value="mixed">Mixed</option><option value="challenge">Challenge</option></select><select id="category"><option value="ALL">All logic families</option></select><button id="py" class="on">Pinyin ON</button><button id="en" class="on">English ON</button><button id="sound">🔊 Speak</button></div>
<div class="hub"><button class="game active" data-mode="deck"><span class="icon">🃏</span><b>WORD DECK</b><span>Explore the logic map</span></button><button class="game" data-mode="match"><span class="icon">🧩</span><b>MATCH</b><span>Situation → best signal</span></button><button class="game" data-mode="switch"><span class="icon">🔀</span><b>SWITCH</b><span>Flip the logic</span></button><button class="game" data-mode="build"><span class="icon">🏗️</span><b>BUILD</b><span>Assemble the sentence</span></button><button class="game" data-mode="detective"><span class="icon">🕵️</span><b>DETECTIVE</b><span>Circle → repair → explain</span></button></div>
<section class="stage"><div id="deckView"><div class="decktop"><div><span class="pill" id="family"></span> <span class="pill" id="relation"></span></div><span class="count" id="count"></span></div><div class="functionMap" id="map"></div><div class="flash" id="flash"><div class="inner"><div class="face"><div class="zh" id="zh"></div><div class="py" id="pinyin"></div><div class="en" id="english"></div><small>Tap to turn the card</small></div><div class="face backface"><b id="explain"></b><div class="context" id="example"></div><p id="compare"></p></div></div></div><div class="nav"><button id="prev">←</button><button id="random" class="primary">🎲 DRAW</button><button id="next">→</button></div></div><div id="gameView" class="hidden"><div class="taskhead"><h2 id="title"></h2><span class="pill" id="score">0 solved</span></div><div id="body"></div><div class="feedback" id="feedback">Choose a game above.</div><button id="nextGame" class="primary hidden">NEXT CASE →</button></div></section></div>
<script src="data/linking-words-masterdeck.js"></script><script>
const D=window.LINKING_WORDS_MASTER_DECK,$=x=>document.getElementById(x),labels={CAUSE:"CAUSE",RESULT:"RESULT",RESULT_NEXT:"RESULT → ACTION",CAUSE_DECISION:"CAUSE → DECISION",TURN:"TURN",TURN_SOFT:"SOFT TURN",TURN_FORMAL:"FORMAL TURN",TURN_EXPECTATION:"EXPECTATION TURN",OPPOSITE:"OPPOSITE",STILL:"STILL",MORE:"ADD MORE",MORE_FORMAL:"ADD MORE",MORE_STRONG:"STRONGER",MORE_PAIR:"MORE",CONDITION:"IF",SUFFICIENT:"ENOUGH IF",NECESSARY:"ONLY IF",TRIGGER:"TRIGGER",NECESSARY_WARNING:"UNLESS",CONCESSION:"DESPITE",UNRESTRICTED:"NO MATTER",CHOICE_COMPARE:"CHOICE",CHOICE_PREFERENCE:"PREFERENCE",PARALLEL:"PARALLEL",PARALLEL_GROUP:"GROUPS",PARALLEL_ASPECT:"TWO SIDES",SEQUENCE:"SEQUENCE",IMMEDIATE_SEQUENCE:"IMMEDIATE",EXPECTED:"EXPECTED",SURPRISE:"SURPRISE",CORRECTION:"CORRECTION"};let pool=[...D],i=0,mode="deck",py=true,en=true,solved=0,current;
const diff=$("difficulty"),cat=$("category");[...new Set(D.map(x=>x.learnerFunction))].forEach(x=>cat.insertAdjacentHTML("beforeend",'<option value="'+x+'">'+(labels[x]||x)+'</option>'));
function ctx(x){return x[diff.value]}function parts(x){return x.zh.split("……").filter(Boolean)}function usable(x){return parts(x).some(p=>ctx(x).includes(p))}function rand(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function shape(x){return x.zh.includes("……")?"pair":"single"}function distract(x,n=3){let a=D.filter(y=>y.id!==x.id&&shape(y)===shape(x)&&(y.traditionalRelation===x.traditionalRelation||y.learnerFunction===x.learnerFunction));if(a.length<n)a=D.filter(y=>y.id!==x.id&&shape(y)===shape(x));return shuffle(a).slice(0,n)}function activePool(requireUsable=false){let a=cat.value==="ALL"?D:D.filter(x=>x.learnerFunction===cat.value);if(requireUsable)a=a.filter(usable);return a.length?a:(requireUsable?D.filter(usable):D)}
function renderDeck(){pool=activePool();if(i>=pool.length)i=0;let x=pool[i];$("family").textContent=labels[x.learnerFunction]||x.learnerFunction;$("relation").textContent=x.traditionalRelation;$("count").textContent=(i+1)+" / "+pool.length;$("zh").textContent=x.zh;$("pinyin").textContent=py?x.pinyin:"";$("english").textContent=en?x.en:"";$("explain").textContent=x.explanation;$("example").textContent=ctx(x);$("compare").textContent="COMPARE ↔ "+x.contrast;$("flash").classList.remove("flip");$("map").innerHTML=[...new Set(pool.map(z=>z.learnerFunction))].map(f=>'<span class="dot">'+(labels[f]||f)+'</span>').join("")}
$("flash").onclick=()=>$("flash").classList.toggle("flip");$("prev").onclick=()=>{i=(i-1+pool.length)%pool.length;renderDeck()};$("next").onclick=()=>{i=(i+1)%pool.length;renderDeck()};$("random").onclick=()=>{i=Math.floor(Math.random()*pool.length);renderDeck()};$("py").onclick=()=>{py=!py;$("py").classList.toggle("on",py);$("py").textContent="Pinyin "+(py?"ON":"OFF");renderDeck()};$("en").onclick=()=>{en=!en;$("en").classList.toggle("on",en);$("en").textContent="English "+(en?"ON":"OFF");renderDeck()};cat.onchange=()=>{i=0;mode==="deck"?renderDeck():newGame()};diff.onchange=()=>mode==="deck"?renderDeck():newGame();$("sound").onclick=()=>{let x=mode==="deck"?pool[i]:current;if(!x)return;let u=new SpeechSynthesisUtterance(x.zh.replaceAll("……","，"));u.lang="zh-CN";speechSynthesis.cancel();speechSynthesis.speak(u)};
document.querySelectorAll(".game").forEach(b=>b.onclick=()=>{document.querySelectorAll(".game").forEach(z=>z.classList.remove("active"));b.classList.add("active");mode=b.dataset.mode;$("deckView").classList.toggle("hidden",mode!=="deck");$("gameView").classList.toggle("hidden",mode==="deck");mode==="deck"?renderDeck():newGame()});$("nextGame").onclick=newGame;
function setup(t){$("title").textContent=t;$("feedback").textContent="";$("nextGame").classList.add("hidden");$("score").textContent=solved+" solved"}function done(ok,msg){if(ok)solved++;$("score").textContent=solved+" solved";$("feedback").textContent=(ok?"✓ ":"↺ ")+msg;$("nextGame").classList.remove("hidden")}
function blank(x){let s=ctx(x);parts(x).forEach(p=>s=s.replace(p,"_____"));return s}function newGame(){current=rand(activePool(mode==="match"||mode==="detective"));({match,switchGame,build,detective}[mode==="switch"?"switchGame":mode]||match)()}
function match(){setup("MATCH · Find the logic that fits");let opts=shuffle([current,...distract(current)]);$("body").innerHTML='<div class="prompt">'+blank(current)+'</div><div class="choices">'+opts.map(o=>'<button class="choice" data-id="'+o.id+'">'+o.zh+'</button>').join("")+'</div>';document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{let ok=b.dataset.id===current.id;b.classList.add(ok?"good":"bad");document.querySelectorAll(".choice").forEach(z=>{z.disabled=true;if(z.dataset.id===current.id)z.classList.add("good")});done(ok,current.explanation+" · "+ctx(current))})}
function switchGame(){setup("SWITCH · Make the logic turn");let target=D.find(x=>x.zh===current.contrast)||rand(distract(current,1));$("body").innerHTML='<div class="switchbox"><div class="logiccard"><b>ORIGINAL · '+current.zh+'</b><div class="context">'+ctx(current)+'</div></div><div class="arrow">→</div><div class="logiccard"><b>TARGET · '+target.zh+'</b><p>'+(labels[target.learnerFunction]||target.learnerFunction)+'</p><button id="reveal" class="primary">I changed the context · SHOW MODEL</button></div></div>';$("reveal").onclick=()=>{done(true,target.explanation+" · MODEL: "+ctx(target));$("reveal").disabled=true}}
function build(){setup("BUILD · Assemble the sentence");let candidates=activePool().filter(x=>/[，；]/.test(ctx(x)));current=rand(candidates.length?candidates:D.filter(x=>/[，；]/.test(ctx(x))));let sentence=ctx(current),pieces=sentence.replace(/[。！？]$/,"").split(/[，；]/).map(x=>x.trim()).filter(Boolean),chosen=[];$("body").innerHTML='<div class="buildzone" id="zone"><small>Build here</small></div><div class="cards">'+shuffle(pieces).map((p,j)=>'<button class="chunk" data-i="'+j+'">'+p+'</button>').join("")+'</div><div class="nav" style="margin-top:18px"><button id="resetBuild">RESET</button><button id="checkBuild" class="primary">CHECK BUILD</button></div>';document.querySelectorAll(".chunk").forEach(b=>b.onclick=()=>{if(b.classList.contains("used"))return;b.classList.add("used");chosen.push(b.textContent);$("zone").insertAdjacentHTML("beforeend",'<span class="chunk">'+b.textContent+'</span>')});$("resetBuild").onclick=build;$("checkBuild").onclick=()=>done(chosen.join("")===pieces.join(""),"MODEL: "+sentence)}
function detective(){setup("DETECTIVE · 老师说错了！");let key=parts(current).find(p=>ctx(current).includes(p));let wrongCard=rand(distract(current,1)),wrong=parts(wrongCard)[0],shown=ctx(current).replace(key,wrong),repair=key;$("body").innerHTML='<p><b>READ → INSPECT → CIRCLE → REPAIR</b></p><div class="detectiveBoard">'+shown.replace(wrong,'<span id="suspect" class="suspect">'+wrong+'</span>')+'</div><p>Tap the suspicious word, then repair it.</p><div class="choices">'+shuffle([repair,...parts(rand(distract(current,1)))]).map(w=>'<button class="choice repair" data-word="'+w+'">'+w+'</button>').join("")+'</div>';$("suspect").onclick=()=>$("suspect").classList.toggle("marked");document.querySelectorAll(".repair").forEach(b=>b.onclick=()=>{let ok=$("suspect").classList.contains("marked")&&b.dataset.word===repair;b.classList.add(ok?"good":"bad");document.querySelectorAll(".repair").forEach(z=>z.disabled=true);done(ok,"REPAIR: "+repair+" · "+current.explanation+" · MODEL: "+ctx(current))})}
renderDeck();
</script></body></html>
