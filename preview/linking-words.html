e:preserve-3d;transition:.45s;cursor:pointer}.flash.flip .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border:3px solid var(--ink);border-radius:26px;background:#fff;padding:30px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:9px 9px 0 var(--ink)}.backface{transform:rotateY(180deg);align-items:stretch;text-align:left;background:#fff7cf}.zh{font-size:clamp(38px,7vw,68px);font-weight:1000}.py,.en{font-size:20px;margin-top:10px}.cardHint{font-size:14px;font-weight:1000;letter-spacing:1px;margin-top:12px}.backgrid{display:grid;gap:10px}.backblock,.logiccard,.compareCard{border:2px solid var(--ink);border-radius:14px;padding:12px;background:#fff}.backblock small{font-weight:1000;display:block;margin-bottom:4px}.cardlevels,.teacherTools{margin-top:12px}.drawMode .py,.drawMode .en,.drawMode .cardHint{display:none}.drawMode.revealed .py,.drawMode.revealed .en,.drawMode.revealed .cardHint{display:block}.comparePanel{margin:18px auto}.compareGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.compareCard h3{font-size:28px;margin:5px 0}.context,.prompt,.detectiveBoard{font-size:21px;line-height:1.7;padding:16px;background:#fff;border:2px solid var(--ink);border-radius:14px;margin-top:12px}.prompt{background:#fff7cf;margin:22px 0}.choice,.chunk{font-size:18px;min-width:145px;box-shadow:3px 3px 0 var(--ink)}.choice.good{background:#ccebd5}.choice.bad{background:#ffd0cd}.buildzone{min-height:110px;border:3px dashed var(--ink);border-radius:18px;padding:14px;margin:18px 0;display:flex;gap:8px;flex-wrap:wrap;align-content:flex-start}.chunk.used{opacity:.3}.suspect{padding:2px 5px;border-radius:6px;cursor:pointer}.suspect.marked{background:#ffd0cd;outline:3px solid var(--red);text-decoration:line-through}.feedback{margin:18px 0;padding:14px;border-left:6px solid var(--ink);background:#eee9dc;min-height:54px;line-height:1.5}.hintline{margin:10px 0;color:#555}.progress{height:12px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;flex:1}.progress>i{display:block;height:100%;background:var(--yellow);width:0}.streak{font-weight:1000}.summary{text-align:center;padding:30px}.summary .big{font-size:64px;font-weight:1000}.weak{display:inline-block;margin:5px;padding:7px 10px;border:2px solid var(--ink);border-radius:999px}.timer{font-weight:1000}.timer.danger{color:#b73535}.teacherSwitch{margin-top:12px;padding:14px;border:2px dashed var(--ink);border-radius:14px}.englishExplain{font-size:14px;color:#555;margin-top:4px}.speaker{padding:6px 9px}.roundbar{margin:12px 0}@media(max-width:800px){.hub{grid-template-columns:1fr 1fr}.compareGrid{grid-template-columns:1fr}.stage{padding:13px}.flash{height:470px}.hero h1{font-size:48px}.roundbar{flex-wrap:wrap}}
</style></head><body><div class="app"><div class="top"><div class="brand">ミッドナイトとライト · Midnight & Light</div><a href="../index.html">Home</a></div><div class="hero"><span class="pill">LOGIC LAB · 46 CARDS</span><h1>关联词</h1><p>Don’t memorize a list. Build the logic.</p></div>
<div class="toolbar"><select id="difficulty"><option value="basic">Basic</option><option value="mixed">Mixed</option><option value="challenge">Challenge</option></select><select id="category"><option value="ALL">All logic families</option></select><button id="py" class="on">Pinyin ON</button><button id="en" class="on">English ON</button></div>
<div class="hub"><button class="game active" data-mode="deck"><span class="icon">🃏</span><b>WORD DECK</b><span>Learn · compare · speak</span></button><button class="game" data-mode="match"><span class="icon">🧩</span><b>MATCH</b><span>Situation → logic</span></button><button class="game" data-mode="build"><span class="icon">🏗️</span><b>BUILD</b><span>Build with word cards</span></button><button class="game" data-mode="detective"><span class="icon">🕵️</span><b>DETECTIVE</b><span>老师说错了！</span></button></div>
<section class="stage"><div id="deckView"><div class="decktop"><div><span class="pill" id="family"></span> <span class="pill" id="relation"></span></div><span id="count"></span></div><div class="functionMap" id="map"></div><div class="flash" id="flash"><div class="inner"><div class="face"><button class="speaker" id="cardSound">🔊</button><div class="zh" id="zh"></div><div class="py" id="pinyin"></div><div class="en" id="english"></div><div class="cardHint" id="logicHint"></div><small id="tapHint">Tap to turn the card</small></div><div class="face backface"><div class="backgrid"><div class="backblock"><small>WHAT IT DOES</small><b id="explain"></b><div class="englishExplain" id="explainEn"></div></div><div class="backblock"><small>SEE IT</small><div id="example"></div></div><div class="backblock"><small>DON’T MIX IT UP WITH</small><b id="compare"></b></div></div><div class="cardlevels"><button class="levelbtn" data-level="basic">BASIC</button><button class="levelbtn" data-level="mixed">MIXED</button><button class="levelbtn" data-level="challenge">CHALLENGE</button></div></div></div></div><div class="nav"><button id="prev">←</button><button id="random" class="primary">🎲 DRAW</button><button id="next">→</button></div><div class="teacherTools"><button id="revealDraw" class="hidden primary">REVEAL CARD</button><button id="compareBtn">⇄ COMPARE</button><button id="switchBtn">🗣 SWITCH / SPEAK</button></div><div id="switchPanel" class="teacherSwitch hidden"></div><div id="comparePanel" class="comparePanel hidden"></div></div>
<div id="gameView" class="hidden"><div class="taskhead"><h2 id="title"></h2><span class="pill" id="roundText"></span></div><div class="roundbar"><div class="progress"><i id="progressFill"></i></div><span class="streak" id="streak"></span><span class="timer hidden" id="timer"></span></div><div id="body"></div><div class="hintline" id="assist"></div><div class="feedback" id="feedback"></div><button id="nextGame" class="primary hidden">NEXT →</button></div></section></div>
<script src="data/linking-words-masterdeck.js"></script><script>
const D=window.LINKING_WORDS_MASTER_DECK,$=x=>document.getElementById(x),labels={CAUSE:"CAUSE",RESULT:"RESULT",RESULT_NEXT:"RESULT → ACTION",CAUSE_DECISION:"CAUSE → DECISION",TURN:"TURN",TURN_SOFT:"SOFT TURN",TURN_FORMAL:"FORMAL TURN",TURN_EXPECTATION:"EXPECTATION TURN",OPPOSITE:"OPPOSITE",CORRECTION:"CORRECTION",STILL:"STILL",MORE:"ADD MORE",MORE_FORMAL:"ADD MORE",MORE_STRONG:"STRONGER",MORE_PAIR:"MORE",CONDITION:"IF",SUFFICIENT:"ENOUGH IF",NECESSARY:"ONLY IF",TRIGGER:"TRIGGER",NECESSARY_WARNING:"UNLESS",CONCESSION:"DESPITE",UNRESTRICTED:"NO MATTER",CHOICE_COMPARE:"CHOICE",CHOICE_PREFERENCE:"PREFERENCE",PARALLEL:"PARALLEL",PARALLEL_GROUP:"GROUPS",PARALLEL_ASPECT:"TWO SIDES",SEQUENCE:"SEQUENCE",IMMEDIATE_SEQUENCE:"IMMEDIATE",EXPECTED:"EXPECTED",SURPRISE:"SURPRISE"},enExplain={CAUSE:"gives a reason",RESULT:"shows a result",RESULT_NEXT:"a cause leads to the next action",CAUSE_DECISION:"a known fact leads to a decision",TURN:"turns to a contrasting idea",TURN_SOFT:"adds a softer contrast",TURN_FORMAL:"formal contrast",TURN_EXPECTATION:"reality differs from expectation",OPPOSITE:"the result moves in the opposite direction",CORRECTION:"corrects the first idea",STILL:"the situation continues",MORE:"adds information",MORE_FORMAL:"adds information, more formal",MORE_STRONG:"adds a stronger or more surprising point",MORE_PAIR:"adds a second point",CONDITION:"sets a condition",SUFFICIENT:"this condition is enough",NECESSARY:"this condition is required",TRIGGER:"once this happens, the result follows",NECESSARY_WARNING:"unless the exception happens",CONCESSION:"the result stays despite the condition",UNRESTRICTED:"the result stays in every case",CHOICE_COMPARE:"prefers the second choice",CHOICE_PREFERENCE:"strongly prefers the first choice",PARALLEL:"two things happen together",PARALLEL_GROUP:"shows different groups",PARALLEL_ASPECT:"shows two sides",SEQUENCE:"shows order",IMMEDIATE_SEQUENCE:"the second action follows immediately",EXPECTED:"the result matches expectation",SURPRISE:"the result is unexpected"};
let pool=[...D],i=0,mode="deck",py=true,en=true,current,cardLevel="basic",drawActive=false,drawRevealed=false,round=0,correct=0,streak=0,bestStreak=0,misses={},answered=false,timerId=null,timeLeft=0;const diff=$("difficulty"),cat=$("category");
[...new Set(D.map(x=>x.learnerFunction))].forEach(x=>cat.insertAdjacentHTML("beforeend",'<option value="'+x+'">'+(labels[x]||x)+'</option>'));
function ctx(x,l=diff.value){return x[l]}function parts(x){return x.zh.split("……").filter(Boolean)}function rand(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function family(x){return labels[x.learnerFunction]||x.learnerFunction}function activePool(){let a=cat.value==="ALL"?D:D.filter(x=>x.learnerFunction===cat.value);return a.length?a:D}function speak(t){let u=new SpeechSynthesisUtterance(t.replaceAll("……","，"));u.lang="zh-CN";speechSynthesis.cancel();speechSynthesis.speak(u)}
function renderDeck(){pool=activePool();if(i>=pool.length)i=0;let x=pool[i];$("family").textContent=family(x);$("relation").textContent=x.traditionalRelation;$("count").textContent=(i+1)+" / "+pool.length;$("zh").textContent=x.zh;$("pinyin").textContent=py?x.pinyin:"";$("english").textContent=en?x.en:"";$("logicHint").textContent=family(x);$("explain").textContent=x.explanation;$("explainEn").textContent=en?(enExplain[x.learnerFunction]||x.en):"";$("example").textContent=x[cardLevel];$("compare").textContent=x.contrast;$("flash").classList.remove("flip");$("flash").classList.toggle("drawMode",drawActive);$("flash").classList.toggle("revealed",drawRevealed);$("revealDraw").classList.toggle("hidden",!drawActive||drawRevealed);$("tapHint").textContent=drawActive&&!drawRevealed?"Say the meaning / function / a sentence first":"Tap to turn the card";document.querySelectorAll(".levelbtn").forEach(b=>b.classList.toggle("active",b.dataset.level===cardLevel));$("map").innerHTML=[...new Set(pool.map(z=>z.learnerFunction))].map(f=>'<span class="dot">'+(labels[f]||f)+'</span>').join("")}
$("flash").onclick=()=>{if(drawActive&&!drawRevealed)return;$("flash").classList.toggle("flip")};$("cardSound").onclick=e=>{e.stopPropagation();speak(pool[i].zh)};$("prev").onclick=()=>{drawActive=false;i=(i-1+pool.length)%pool.length;renderDeck()};$("next").onclick=()=>{drawActive=false;i=(i+1)%pool.length;renderDeck()};$("random").onclick=()=>{i=Math.floor(Math.random()*pool.length);drawActive=true;drawRevealed=false;$("comparePanel").classList.add("hidden");$("switchPanel").classList.add("hidden");renderDeck()};$("py").onclick=()=>{py=!py;$("py").classList.toggle("on",py);$("py").textContent="Pinyin "+(py?"ON":"OFF");renderDeck()};$("en").onclick=()=>{en=!en;$("en").classList.toggle("on",en);$("en").textContent="English "+(en?"ON":"OFF");renderDeck()};document.querySelectorAll(".levelbtn").forEach(b=>b.onclick=e=>{e.stopPropagation();cardLevel=b.dataset.level;renderDeck()});$("revealDraw").onclick=()=>{drawRevealed=true;renderDeck()};
$("compareBtn").onclick=()=>{let x=pool[i],y=D.find(z=>z.zh===x.contrast);$("switchPanel").classList.add("hidden");if(!y)$("comparePanel").innerHTML="<b>No paired comparison prepared yet.</b>";else $("comparePanel").innerHTML='<div class="compareGrid"><div class="compareCard"><span class="pill">'+family(x)+'</span><h3>'+x.zh+'</h3><p>'+x.explanation+'</p><div class="englishExplain">'+(en?enExplain[x.learnerFunction]||x.en:"")+'</div><div class="context">'+x[cardLevel]+'</div></div><div class="compareCard"><span class="pill">'+family(y)+'</span><h3>'+y.zh+'</h3><p>'+y.explanation+'</p><div class="englishExplain">'+(en?enExplain[y.learnerFunction]||y.en:"")+'</div><div class="context">'+y[cardLevel]+'</div></div></div>';$("comparePanel").classList.toggle("hidden")};
$("switchBtn").onclick=()=>{let x=pool[i],y=D.find(z=>z.zh===x.contrast)||rand(D.filter(z=>z.learnerFunction!==x.learnerFunction));$("comparePanel").classList.add("hidden");$("switchPanel").innerHTML='<b>SWITCH / SPEAK · No score</b><p>Original: '+x[cardLevel]+'</p><p>Target: <b>'+y.zh+'</b> · '+family(y)+'</p><p>Change the situation so <b>'+y.zh+'</b> becomes natural. Say your version aloud, then reveal the model.</p><button id="switchReveal">SHOW MODEL</button><div id="switchModel"></div>';$("switchPanel").classList.remove("hidden");$("switchReveal").onclick=()=>{$("switchModel").innerHTML='<div class="context">'+y[cardLevel]+'</div>'}};
cat.onchange=()=>{i=0;drawActive=false;mode==="deck"?renderDeck():startSession()};diff.onchange=()=>mode==="deck"?renderDeck():startSession();
document.querySelectorAll(".game").forEach(b=>b.onclick=()=>{document.querySelectorAll(".game").forEach(z=>z.classList.remove("active"));b.classList.add("active");mode=b.dataset.mode;$("deckView").classList.toggle("hidden",mode!=="deck");$("gameView").classList.toggle("hidden",mode==="deck");mode==="deck"?(stopTimer(),renderDeck()):startSession()});$("nextGame").onclick=nextRound;
function startSession(){stopTimer();round=correct=streak=bestStreak=0;misses={};nextRound()}function nextRound(){stopTimer();if(round>=10)return summary();answered=false;round++;$("roundText").textContent="ROUND "+round+" / 10";$("progressFill").style.width=((round-1)*10)+"%";$("streak").textContent=streak?"🔥 "+streak:"";$("feedback").textContent="";$("nextGame").classList.add("hidden");current=rand(activePool());if(mode==="match")match();if(mode==="build")build();if(mode==="detective")detective();if(diff.value==="challenge")startTimer()}function record(ok,msg){if(answered)return;answered=true;stopTimer();if(ok){correct++;streak++;bestStreak=Math.max(bestStreak,streak);tone(true)}else{streak=0;misses[current.learnerFunction]=(misses[current.learnerFunction]||0)+1;tone(false)}$("streak").textContent=streak?"🔥 "+streak:"";$("feedback").textContent=(ok?"✓ ":"✎ ")+msg;$("nextGame").classList.remove("hidden");$("progressFill").style.width=(round*10)+"%"}
let audioCtx=null;function tone(ok){try{let A=window.AudioContext||window.webkitAudioContext;if(!audioCtx)audioCtx=new A();if(audioCtx.state==="suspended")audioCtx.resume();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=ok?660:190;g.gain.setValueAtTime(.08,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.18);o.start();o.stop(audioCtx.currentTime+.18)}catch(e){}}function startTimer(){timeLeft=20;$("timer").classList.remove("hidden");$("timer").textContent="⏱ "+timeLeft+"s";timerId=setInterval(()=>{timeLeft--;$("timer").textContent="⏱ "+timeLeft+"s";$("timer").classList.toggle("danger",timeLeft<=5);if(timeLeft<=0){stopTimer();record(false,"Time! "+modelText())}},1000)}function stopTimer(){clearInterval(timerId);timerId=null;$("timer").classList.add("hidden");$("timer").classList.remove("danger")}function modelText(){return "Model: "+ctx(current)}
function differentDistractors(x,n=3){let bad=D.filter(y=>y.id!==x.id&&y.learnerFunction!==x.learnerFunction&&y.traditionalRelation!==x.traditionalRelation);return shuffle(bad).slice(0,n)}function gamePinyin(x){return py?'<div class="hintline">'+x.pinyin+'</div>':""}function gameEnglish(x){return en?'<div class="hintline">'+x.en+'</div>':""}
function blankTarget(x){let s=ctx(x);parts(x).forEach(p=>s=s.replace(p,"_____"));return s}function match(){let ma=activePool().filter(x=>parts(x).some(p=>ctx(x).includes(p)));current=rand(ma.length?ma:activePool());let opts=shuffle([current,...differentDistractors(current)]);$("title").textContent="MATCH · Choose the logic";$("body").innerHTML='<div class="prompt">'+blankTarget(current)+'</div>'+gamePinyin(current)+gameEnglish(current)+'<div class="choices">'+opts.map(o=>'<button class="choice" data-id="'+o.id+'">'+o.zh+'</button>').join("")+'</div>';document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{let ok=b.dataset.id===current.id;b.classList.add(ok?"good":"bad");document.querySelectorAll(".choice").forEach(z=>{z.disabled=true;if(z.dataset.id===current.id)z.classList.add("good")});record(ok,current.explanation+" · "+modelText())})}
function tokenize(x){let s=ctx(x).replace(/[。！？]$/,""),ps=parts(x),out=[];ps.forEach(p=>s=s.replace(p,"§"+p+"§"));let segments=s.split("§").filter(Boolean);segments.forEach(seg=>{if(ps.includes(seg))out.push(seg);else{seg.split(/([，；])/).filter(Boolean).forEach(piece=>{if(/[，；]/.test(piece)){out.push(piece);return}let t=piece.trim();if(!t)return;let chunks=t.length<=5?[t]:t.match(/.{1,4}/g)||[t];out.push(...chunks)})}});return out.filter(Boolean)}function build(){current=rand(activePool());let pieces=tokenize(current),chosen=[];$("title").textContent="BUILD · Build with word cards";$("body").innerHTML='<div class="buildzone" id="zone"><small>Build here</small></div><div class="cards">'+shuffle(pieces).map((p,j)=>'<button class="chunk" data-v="'+encodeURIComponent(p)+'">'+p+'</button>').join("")+'</div><div class="nav" style="margin-top:18px"><button id="resetBuild">RESET</button><button id="checkBuild" class="primary">CHECK</button></div>';$("assist").innerHTML=gamePinyin(current)+gameEnglish(current);document.querySelectorAll(".chunk").forEach(b=>b.onclick=()=>{if(b.classList.contains("used"))return;b.classList.add("used");let v=decodeURIComponent(b.dataset.v);chosen.push(v);$("zone").insertAdjacentHTML("beforeend",'<span class="chunk">'+v+'</span>')});$("resetBuild").onclick=()=>{if(answered)return;chosen=[];$("zone").innerHTML="<small>Build here</small>";document.querySelectorAll(".chunk").forEach(b=>b.classList.remove("used"))};$("checkBuild").onclick=()=>record(chosen.join("")===pieces.join(""),modelText())}
const detectiveCases=[["因为","但是","所以"],["虽然","所以","但是"],["如果","但是","就"],["只要","才","就"],["只有","就","才"],["即使","所以","也"],["无论","就","都"],["不管","才","都"],["不但","但是","而且"],["先","但是","再"],["果然","竟然","果然"],["竟然","果然","竟然"]];
function makeCase(){let candidates=activePool().filter(x=>parts(x).some(p=>ctx(x).includes(p)));for(let tries=0;tries<30;tries++){let x=rand(candidates),p=parts(x).find(q=>ctx(x).includes(q)),rule=detectiveCases.find(r=>r[0]===p);if(rule)return{x,key:p,wrong:rule[1],repair:p}}let x=rand(candidates),p=parts(x).find(q=>ctx(x).includes(q)),other=rand(D.filter(y=>y.learnerFunction!==x.learnerFunction));return{x,key:p,wrong:parts(other)[0],repair:p}}
function detective(){let c=makeCase();current=c.x;let shown=ctx(current).replace(c.key,c.wrong);$("title").textContent="DETECTIVE · 老师说错了！";$("body").innerHTML='<p><b>READ → INSPECT → CIRCLE → REPAIR</b></p><div class="detectiveBoard">'+shown.replace(c.wrong,'<span id="suspect" class="suspect">'+c.wrong+'</span>')+'</div>'+gamePinyin(current)+gameEnglish(current)+'<p>Tap the wrong signal word, then repair it.</p><div class="choices">'+shuffle([c.repair,...differentDistractors(current,2).map(x=>parts(x)[0])]).map(w=>'<button class="choice repair" data-word="'+w+'">'+w+'</button>').join("")+'</div>';$("suspect").onclick=()=>$("suspect").classList.toggle("marked");document.querySelectorAll(".repair").forEach(b=>b.onclick=()=>{let ok=$("suspect").classList.contains("marked")&&b.dataset.word===c.repair;b.classList.add(ok?"good":"bad");document.querySelectorAll(".repair").forEach(z=>z.disabled=true);record(ok,"Repair: "+c.repair+" · "+current.explanation+" · "+modelText())})}
function summary(){stopTimer();let weak=Object.entries(misses).sort((a,b)=>b[1]-a[1]).slice(0,3);$("title").textContent="SESSION COMPLETE";$("roundText").textContent="10 QUESTIONS";$("progressFill").style.width="100%";$("streak").textContent="";$("body").innerHTML='<div class="summary"><div class="big">'+correct+'/10</div><p>Best streak: 🔥 '+bestStreak+'</p><h3>'+(weak.length?"Needs more practice":"Excellent consistency")+'</h3>'+(weak.length?weak.map(([k,v])=>'<span class="weak">'+(labels[k]||k)+' · '+v+'</span>').join(""):"<p>No weak family recorded this round.</p>")+'<div class="nav" style="margin-top:22px"><button id="again" class="primary">PLAY ANOTHER 10</button></div></div>';$("assist").textContent="";$("feedback").textContent="";$("nextGame").classList.add("hidden");$("again").onclick=startSession}
renderDeck();
</script></body></html>
