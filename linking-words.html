<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>关联词 / Linking & Signal Words</title><style>
*{box-sizing:border-box}:root{--ink:#25273b;--a:#5966a8;--d:#2c356f;--line:#dcdff0;--soft:#f7f7fc}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;color:var(--ink);background:radial-gradient(circle at 90% 8%,#fff3d9 0,transparent 20rem),radial-gradient(circle at 8% 5%,#e9ebfa 0,transparent 22rem),var(--soft);min-height:100vh}button,select,textarea{font:inherit}.app{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px}.brand{font-weight:900;color:var(--d)}h1{font-size:clamp(27px,5vw,44px);margin:22px 0 4px}.sub{color:#666d8b}.panel{background:#ffffffdd;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 8px 26px #2c356f12;margin:14px 0}.controls,.nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}.btn,.chip,select{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;cursor:pointer}.primary,.chip.active{background:var(--d);color:#fff}.modegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.mode{min-height:100px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px;cursor:pointer;box-shadow:0 5px 0 #2c356f12}.mode b{display:block;margin-bottom:6px}.hidden{display:none!important}.flash{perspective:1000px;height:390px;margin:16px auto;max-width:700px}.flash-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}.flash.flipped .flash-inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:26px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;box-shadow:0 10px 0 #2c356f10,0 20px 40px #2c356f12}.back{transform:rotateY(180deg);align-items:stretch;text-align:left}.word{font-size:clamp(34px,7vw,60px);font-weight:900;color:var(--d)}.py{font-size:20px;color:#6a7191;margin-top:12px}.hint{font-size:18px;color:#6a7191;margin-top:8px}.badge{display:inline-block;background:#eef0fb;color:var(--d);padding:6px 10px;border-radius:999px;font-size:13px;font-weight:800}.example,.situation{font-size:20px;line-height:1.65;background:#f8f8fc;border-radius:16px;padding:15px;margin-top:12px}.count{text-align:center;color:#747a96}.gamehead{display:flex;justify-content:space-between}.score{font-weight:900}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option,.token{padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;font-weight:800}.good{background:#e4f5e9!important}.bad{background:#fde8e8!important}.feedback{min-height:52px;margin:12px 0;font-weight:700;line-height:1.5}.buildzone{min-height:80px;border:2px dashed #b7bcda;border-radius:16px;padding:12px;margin:14px 0;display:flex;gap:8px;flex-wrap:wrap}.wordpiece{cursor:pointer;border-radius:5px;padding:2px}.marked{outline:3px solid #c86f70;background:#fff1f1}.case{font-size:18px;font-weight:900;color:var(--d);margin:10px 0}textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:14px;padding:12px}@media(max-width:760px){.modegrid{grid-template-columns:1fr 1fr}.options{grid-template-columns:1fr}.flash{height:430px}.app{padding:11px}}
</style></head><body><div class="app"><div class="top"><div class="brand">ミッドナイトとライト · Midnight & Light</div><a href="index.html">Home</a></div><h1>关联词 / Linking & Signal Words</h1><p class="sub">46-word Master Deck · learn the logic, not just the translation.</p>
<section class="panel"><div class="modegrid"><button class="mode" data-mode="flash"><b>🃏 WORD DECK</b>Flip · shuffle · draw</button><button class="mode" data-mode="match"><b>🎴 MATCH</b>Situation × word</button><button class="mode" data-mode="switch"><b>🔀 SWITCH</b>Change the context</button><button class="mode" data-mode="build"><b>🏗️ BUILD</b>Build the sentence</button><button class="mode" data-mode="detective"><b>🔎 DETECTIVE</b>Spot · repair</button></div></section>
<section class="panel"><div class="controls"><select id="difficulty"><option value="basic">Basic</option><option value="mixed">Mixed</option><option value="challenge">Challenge</option></select><select id="category"><option value="ALL">All functions</option></select><button id="pinyin" class="chip active">Pinyin ON</button><button id="english" class="chip active">English ON</button><button id="speak" class="btn">🔊</button></div>
<div id="flashView"><div class="count" id="count"></div><div class="flash" id="flash"><div class="flash-inner"><div class="face"><span class="badge" id="fcat"></span><div class="word" id="fword"></div><div class="py" id="fpy"></div><div class="hint" id="fen"></div><small>Tap card to flip</small></div><div class="face back"><div><span class="badge" id="brel"></span></div><h2 id="bword"></h2><div id="bexplain"></div><div class="example" id="bexample"></div><small id="bcontrast"></small></div></div></div><div class="nav"><button class="btn" id="prev">← Prev</button><button class="btn" id="random">🎲 Random Draw</button><button class="btn" id="shuffle">Shuffle</button><button class="btn" id="next">Next →</button></div></div>
<div id="gameView" class="hidden"><div class="gamehead"><b id="gameTitle"></b><span class="score" id="score">0 / 0</span></div><div id="gameBody"></div><div class="feedback" id="feedback"></div><button class="btn primary hidden" id="nextGame">Next →</button></div></section></div>
<script src="data/linking-words-masterdeck.js"></script><script>
const D=window.LINKING_WORDS_MASTER_DECK,$=id=>document.getElementById(id);let filtered=[...D],idx=0,showPy=true,showEn=true,mode="flash",points=0,round=0,current=null;const diff=$("difficulty"),cat=$("category");
[...new Set(D.map(x=>x.learnerFunction))].sort().forEach(x=>cat.insertAdjacentHTML("beforeend","<option>"+x+"</option>"));
function ex(x){return x[diff.value]}function render(){let x=filtered[idx];$("count").textContent=(idx+1)+" / "+filtered.length;$("fcat").textContent=x.learnerFunction;$("fword").textContent=x.zh;$("fpy").textContent=showPy?x.pinyin:"";$("fen").textContent=showEn?x.en:"";$("brel").textContent=x.traditionalRelation;$("bword").textContent=x.zh;$("bexplain").textContent=x.explanation;$("bexample").textContent=ex(x);$("bcontrast").textContent="Compare / repair with: "+x.contrast;$("flash").classList.remove("flipped")}
$("flash").onclick=()=>$("flash").classList.toggle("flipped");$("prev").onclick=()=>{idx=(idx-1+filtered.length)%filtered.length;render()};$("next").onclick=()=>{idx=(idx+1)%filtered.length;render()};$("random").onclick=()=>{idx=Math.floor(Math.random()*filtered.length);render()};$("shuffle").onclick=()=>{filtered.sort(()=>Math.random()-.5);idx=0;render()};
$("pinyin").onclick=e=>{showPy=!showPy;e.target.textContent="Pinyin "+(showPy?"ON":"OFF");e.target.classList.toggle("active",showPy);render()};$("english").onclick=e=>{showEn=!showEn;e.target.textContent="English "+(showEn?"ON":"OFF");e.target.classList.toggle("active",showEn);render()};
cat.onchange=()=>{filtered=D.filter(x=>cat.value==="ALL"||x.learnerFunction===cat.value);idx=0;render()};diff.onchange=()=>mode==="flash"?render():newGame();
$("speak").onclick=()=>{let x=mode==="flash"?filtered[idx]:current;if(!x)return;let u=new SpeechSynthesisUtterance(x.zh.replaceAll("……","，"));u.lang="zh-CN";speechSynthesis.cancel();speechSynthesis.speak(u)};
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;$("flashView").classList.toggle("hidden",mode!=="flash");$("gameView").classList.toggle("hidden",mode==="flash");if(mode==="flash")render();else{points=round=0;newGame()}});
function sample(a,n){return [...a].sort(()=>Math.random()-.5).slice(0,n)}function distract(x,n=3){let p=D.filter(y=>y.id!==x.id&&(y.learnerFunction===x.learnerFunction||y.traditionalRelation===x.traditionalRelation));if(p.length<n)p=D.filter(y=>y.id!==x.id);return sample(p,n)}function partsOf(x){return x.zh.split("……").filter(Boolean)}function usable(x){let s=ex(x);return partsOf(x).some(p=>s.includes(p))}function choicePool(){let p=(filtered.length?filtered:D).filter(usable);return p.length?p:D.filter(usable)}function blankSentence(x){let s=ex(x);partsOf(x).forEach(p=>s=s.replace(p,"____"));return s}
function setup(t){$("gameTitle").textContent=t;$("feedback").textContent="";$("nextGame").classList.add("hidden");$("score").textContent=points+" / "+round}function finish(ok,msg){round++;if(ok)points++;$("score").textContent=points+" / "+round;$("feedback").textContent=(ok?"✓ ":"✎ ")+msg;$("nextGame").classList.remove("hidden")}function newGame(){current=sample(filtered.length?filtered:D,1)[0];if(mode==="match")match();if(mode==="switch")sw();if(mode==="build")build();if(mode==="detective")detect()}$("nextGame").onclick=newGame;
function match(){current=sample(choicePool(),1)[0];setup("🎴 MATCH · Choose the linking word that completes the logic");let os=sample([current,...distract(current)],4);$("gameBody").innerHTML='<div class="situation">'+blankSentence(current)+'</div><div class="options">'+os.map(o=>'<button class="option" data-id="'+o.id+'">'+o.zh+'</button>').join("")+'</div>';document.querySelectorAll(".option").forEach(b=>b.onclick=()=>{let ok=b.dataset.id===current.id;b.classList.add(ok?"good":"bad");if(!ok){let right=document.querySelector('[data-id="'+current.id+'"]');if(right)right.classList.add("good")}document.querySelectorAll(".option").forEach(z=>z.disabled=true);finish(ok,current.explanation+" Model: "+ex(current))})}
function sw(){let a=D.find(y=>y.zh===current.contrast)||distract(current,1)[0];setup("🔀 SWITCH · Rewrite the context for the target logic");$("gameBody").innerHTML='<div class="situation"><b>Original:</b> '+ex(current)+'</div><p><b>'+current.zh+'</b> → target <b>'+a.zh+'</b></p><textarea id="rewrite" placeholder="Change the context. Keep the target word natural."></textarea><button class="btn primary" id="model">Check the target logic</button>';$("model").onclick=()=>{let wrote=$("rewrite").value.trim().length>3;round++;if(wrote)points++;$("score").textContent=points+" / "+round;$("feedback").textContent=(wrote?"✓ Attempt recorded. ":"Write your version first. ")+a.explanation+" Model: "+ex(a);$("nextGame").classList.toggle("hidden",!wrote)}}
function build(){setup("🏗️ BUILD · Put the sentence chunks in order");let sentence=ex(current),clean=sentence.replace(/[。！？]$/,""),parts=clean.split(/[，；]/).map(x=>x.trim()).filter(Boolean);if(parts.length<2){current=sample((filtered.length?filtered:D).filter(x=>ex(x).includes("，")),1)[0];return build()}let shuffled=sample(parts,parts.length),chosen=[];$("gameBody").innerHTML='<p>Tap cards in order.</p><div class="buildzone" id="zone"></div><div class="options">'+shuffled.map((p,i)=>'<button class="token" data-i="'+i+'">'+p+'</button>').join("")+'</div><button class="btn primary" id="check">Check</button>';document.querySelectorAll(".token").forEach(b=>b.onclick=()=>{if(b.disabled)return;b.disabled=true;chosen.push(b.textContent);$("zone").insertAdjacentHTML("beforeend","<span class=token>"+b.textContent+"</span>")});$("check").onclick=()=>finish(chosen.join("")===parts.join(""),"Model: "+sentence)}
function detect(){current=sample(choicePool(),1)[0];setup("🔎 DETECTIVE · READ → CIRCLE → REPAIR");let s=ex(current),key=partsOf(current).find(p=>s.includes(p));if(!key)return detect();let wrongCard=distract(current,1)[0],wrong=partsOf(wrongCard)[0]||wrongCard.zh,shown=s.replace(key,wrong),repairs=sample([current,...distract(current,2)],3);$("gameBody").innerHTML='<div class="case">CASE FILE</div><div class="situation">'+shown.replace(wrong,'<span class="wordpiece" id="suspect">'+wrong+'</span>')+'</div><p>1. Circle the wrong signal word. 2. Choose the repair.</p><div class="options">'+repairs.map(o=>'<button class="option repairChoice" data-id="'+o.id+'">'+o.zh+'</button>').join("")+'</div>';$("suspect").onclick=e=>e.target.classList.toggle("marked");document.querySelectorAll(".repairChoice").forEach(b=>b.onclick=()=>{let ok=$("suspect").classList.contains("marked")&&b.dataset.id===current.id;b.classList.add(ok?"good":"bad");document.querySelectorAll(".repairChoice").forEach(z=>z.disabled=true);finish(ok,(ok?"CASE SOLVED +1. ":"CASE FAILED. ")+"Repair: "+current.zh+". "+current.explanation+" Model: "+s)})}
render();
</script></body></html>
