  const marks=new Array(tokens.length).fill(false),connectors=String(connectorZh||"").split("……").filter(Boolean).map(x=>Array.from(x));

  for(const chars of connectors){
    let found=-1;
    for(let i=seek;i<=tokens.length-chars.length;i++){if(chars.every((c,j)=>tokens[i+j]&&tokens[i+j][0]===c)){found=i;break}}
    if(found<0){for(let i=0;i<=tokens.length-chars.length;i++){if(!marks.slice(i,i+chars.length).some(Boolean)&&chars.every((c,j)=>tokens[i+j]&&tokens[i+j][0]===c)){found=i;break}}}
    if(found>=0){for(let j=0;j<chars.length;j++)marks[found+j]=true;seek=found+chars.length}
  }
  // 先按分句标点切：标点跟着前一张卡，卡片不会跨过分句。
  const stop=t=>BUILD_STOP.test(t[0]),parts=[];let i=0,pending=[];
  function add(p){if(pending.length){p.unshift(...pending);pending=[]}parts.push(p)}
  function pushGap(a,b){
    if(a>=b)return;
    const slice=tokens.slice(a,b).map(t=>[...t]),n=slice.length;
    // 6 字以内整段一张，不为了凑字数切开。
    if(n<=6){add(slice);return}
    // 超过 6 字：只在词语边界切，每张 1–6 字，尽量接近 4 字。
    const edge=new Set([0,n]);
    try{const seg=new Intl.Segmenter("zh",{granularity:"word"});let pos=0;for(const x of seg.segment(slice.map(t=>t[0]).join(""))){pos+=Array.from(x.segment).length;edge.add(pos)}}catch(e){}
    const best=new Array(n+1).fill(null);best[0]={cost:0,cuts:[]};
    for(let k=0;k<n;k++){if(!best[k])continue;for(let e=k+1;e<=Math.min(n,k+6);e++){let s=e-k,c=best[k].cost+(s-4)*(s-4)+(edge.has(e)?0:1000);if(!best[e]||c<best[e].cost)best[e]={cost:c,cuts:[...best[k].cuts,e]}}}
    let a2=0;for(const e of best[n].cuts){add(slice.slice(a2,e));a2=e}
  }
  while(i<tokens.length){
    if(stop(tokens[i])){if(parts.length)parts[parts.length-1].push([...tokens[i]]);else pending.push([...tokens[i]]);i++}
    else if(marks[i]){let j=i+1;while(j<tokens.length&&marks[j])j++;add(tokens.slice(i,j).map(t=>[...t]));i=j}
    else{let j=i+1;while(j<tokens.length&&!marks[j]&&!stop(tokens[j]))j++;pushGap(i,j);i=j}
  }
  return parts
}
function buildParts(x,tokens){
  // 优先用 Mint 审核过的切法（build-cards.js）；文字对不上时才自动切。
  let s=window.ML_BUILD_CARDS&&ML_BUILD_CARDS[x.id]&&ML_BUILD_CARDS[x.id][S.difficulty||"basic"];
  if(s&&s.replace(/\|/g,"")===tokens.map(t=>t[0]).join("")){let parts=[],i=0;for(const c of s.split("|")){let n=Array.from(c).length;parts.push(tokens.slice(i,i+n).map(t=>[...t]));i+=n}return parts}
  return splitExampleTokens(tokens,x.zh)
}
function buildEligible(parts){
  if(parts.length<3)return false;
  return parts.every(p=>{let k=p.findIndex(t=>BUILD_STOP.test(t[0])),body=k<0?p:p.slice(0,k);if(!body.length||body.length>6)return false;return k<0||p.slice(k).every(t=>BUILD_STOP.test(t[0]))})
}

function detective(){let list=ML_DETECTIVE_CASES.filter(x=>x.level===S.difficulty),notice="";if(!list.length){list=ML_DETECTIVE_CASES.filter(x=>x.level==="basic");notice="此难度题库制作中，暂用 Basic。"}let c=list[Math.floor(Math.random()*list.length)],toks=c.tokens.map(x=>[...x]),slots=Object.keys(c.slots),wrongSlots=[],errors={};let n=Math.random()<.1?0:Math.min(slots.length,1+Math.floor(Math.random()*3));shuffle(slots).slice(0,n).forEach(sl=>{let i=toks.findIndex(x=>x[3]===sl),def=normSlot(c.slots[sl]);if(!def.errors.length)return;let ei=Math.floor(Math.random()*def.errors.length),e=def.errors[ei];if(i>=0){toks[i][0]=e[0];toks[i][1]=e[1];wrongSlots.push(sl);errors[sl]=e}});inspectMode=false;current={kind:"detective",c,toks,wrongSlots,errors,marks:{},notice,closed:false,peekedIndices:new Set()};drawDetective()}
function markIndex(key,toks){return key.startsWith("@")?Number(key.slice(1)):toks.findIndex(t=>t[3]===key)}
function openDetectiveCheck(i){let x=current;if(!x||x.closed)return;let {c,toks,marks}=x,t=toks[i];if(!t||/^[，。！？；：、,.!?;：“”‘’（）()…—-]+$/.test(t[0]))return;let sl=t[3]||"",key=sl||("@"+i);if(marks[key]){delete marks[key];drawDetective();return}let def=sl?normSlot(c.slots[sl]):{correct:t[0],correctPy:t[1]||"",errors:[]},said=t[0],opts=repairOptions(def.correct,said),py=(S.reading==="hanzi"?"":(t[1]||""));$("checks").innerHTML='<div class="detective-check-card"><div class="check-lens"><img src="../assets/magnifier.svg" alt=""><span class="check-lens-word">'+said+'</span></div><div>'+(py?'<div class="inspect-py">'+py+'</div>':'')+'<div class="options" style="margin-top:10px"><button id="good">✔ Correct 用得对</button><button id="bad">✘ Wrong 用错了</button></div><div id="repairD"></div></div></div>';$("good").onclick=()=>{marks[key]={bad:false,index:i};drawDetective()};$("bad").onclick=()=>{$("repairD").innerHTML='<div class="options">'+opts.map(v=>'<button class="dfix choice" data-value="'+v+'">'+choiceHtml(v,v===def.correct?(def.correctPy||t[1]||pyFor(v)):v===said?(t[1]||pyFor(v)):pyFor(v))+'</button>').join("")+'</div>';document.querySelectorAll(".dfix").forEach(b=>b.onclick=()=>{marks[key]={bad:true,fix:b.dataset.value,index:i};drawDetective()})}}
function wireDetectiveHover(caseEl,toks){if(matchMedia("(max-width:600px)").matches)return;caseEl.querySelectorAll(".mltok:not(.punct)").forEach(el=>{el.addEventListener("mouseenter",()=>{if(S.reading!=="hanzi")return;let i=Number(el.dataset.i);clearTimeout(hoverPeekTimer);hoverPeekTimer=setTimeout(()=>{let py=toks[i]&&toks[i][1];if(!py)return;el.classList.add("peeking");el.setAttribute("data-show",py);if(!current.peekedIndices.has(i)){current.peekedIndices.add(i);peek++}},800)});el.addEventListener("mouseleave",()=>{clearTimeout(hoverPeekTimer);el.classList.remove("peeking");el.removeAttribute("data-show")})})}
function drawDetective(){let x=current,{c,toks,wrongSlots,marks,notice}=x,isMobile=matchMedia("(max-width:600px)").matches,caseClass="casefile detective-case"+(isMobile?(inspectMode?" inspect-on":" inspect-off"):"");$("play").innerHTML=(notice?'<div class="notice">'+notice+'</div>':'')+'<h2>🔍 Find the mistakes · 抓错字</h2><h3>'+tokensHtml(c.titleTokens||[[c.title,""]])+'</h3><div class="case-count">Mistakes in this story · 本案错误：<b>'+wrongSlots.length+'</b></div><div class="'+caseClass+'" id="case">'+tokensHtml(toks)+(isMobile?'<button class="inspect-toggle'+(inspectMode?" active":"")+'" id="inspectToggle" aria-label="切换检查模式"><img src="../assets/magnifier.svg" alt=""></button>':'')+'</div><p class="lensHint">'+(isMobile?(inspectMode?"Checking is ON — tap a linking word. 检查模式已开启：点关联词。":"Read first. Tap 🔍 (bottom right) to start checking. 先阅读，要检查时按右下角 🔍。"):"Move the magnifier onto a linking word and click it. 把放大镜移到关联词上，点一下检查。")+'</p><div id="checks"></div><button id="closecase">Close case 结案</button><div id="result"></div>';
Object.entries(marks).forEach(([key,m])=>{let i=markIndex(key,toks),el=document.querySelector('.mltok[data-i="'+i+'"]');if(el)el.classList.add(m.bad?"mark-bad":"mark-good")});
let caseEl=$("case");caseEl.querySelectorAll(".mltok").forEach(el=>el.onclick=()=>{if(x.closed)return;if(isMobile&&!inspectMode)return;openDetectiveCheck(Number(el.dataset.i))});wireDetectiveHover(caseEl,toks);
let toggle=$("inspectToggle");if(toggle)toggle.onclick=e=>{e.stopPropagation();inspectMode=!inspectMode;drawDetective()};$("closecase").onclick=closeCase}
function closeCase(){let x=current;if(x.closed)return;x.closed=true;let pts=0;Object.keys(x.c.slots).forEach(sl=>{let bad=x.wrongSlots.includes(sl),m=x.marks[sl],right=normSlot(x.c.slots[sl]).correct;if(bad&&m&&m.bad&&m.fix===right)pts+=2;else if(!bad&&m&&!m.bad)pts+=1;else if(!bad&&m&&m.bad)pts-=1});let q=x.c.question,order=shuffle(q.options.map((o,i)=>({o,i})));$("result").innerHTML='<div class="result"><b>Score · 关联词得分：'+pts+'</b>'+(S.english?'<div class="english">'+x.c.en+'</div>':'')+'<div class="question"><h3>'+tokensHtml(q.q)+'</h3>'+(S.english?'<p class="english">'+q.qEn+'</p>':'')+order.map(v=>'<button class="qopt" data-original="'+v.i+'">'+choiceTokensHtml(v.o)+'</button>').join("")+'</div></div>';document.querySelectorAll(".qopt").forEach(b=>b.onclick=()=>{if(answered)return;let ok=Number(b.dataset.original)===q.answer;if(ok)correct++;lock(".qopt");b.parentElement.insertAdjacentHTML("beforeend",'<p>'+(ok?"✓ +2":"✎ 0")+' · <button id="nxt">NEXT</button></p>');$("nxt").onclick=next});wirePeek($("result"))}

function deck(repaint=false){let d=window.LINKING_WORDS_MASTER_DECK||[],x=repaint&&current&&current.x?current.x:d[Math.floor(Math.random()*d.length)],toks=deckExampleTokens(x);current={kind:"deck",x};$("play").innerHTML='<h2>WORD DECK</h2><div class="choice" style="text-align:center">'+connectorChoiceHtml(x)+'</div>'+(S.english?'<p style="text-align:center">'+x.en+'</p>':"")+'<div class="deck-example sentence">'+tokensHtml(toks)+'</div><div class="result">'+usageHtml(x)+'</div><button id="nxt">NEXT CARD</button>';$("nxt").onclick=next;wirePeek($("play"))}
function match(repaint=false){let d=window.LINKING_WORDS_MASTER_DECK||[],x=repaint&&current&&current.x?current.x:d[Math.floor(Math.random()*d.length)],toks,blank,optionIds;if(repaint&&current&&current.kind==="match"){x=current.x;toks=current.toks;blank=current.blank;optionIds=current.optionIds}else{toks=deckExampleTokens(x);blank=blankDeckTokens(toks,x.zh);optionIds=shuffle([x,...shuffle(d.filter(y=>y.id!==x.id&&y.traditionalRelation!==x.traditionalRelation&&y.learnerFunction!==x.learnerFunction&&y.zh.includes('……')===x.zh.includes('……'))).slice(0,3)]).map(o=>o.id);current={kind:"match",x,toks,blank,optionIds}}let opts=optionIds.map(id=>d.find(o=>o.id===id)).filter(Boolean);$("play").innerHTML='<h2>MATCH</h2><div class="sentence">'+tokensHtml(blank)+'</div><div class="options">'+opts.map(o=>'<button class="mopt choice" data-id="'+o.id+'">'+connectorChoiceHtml(o)+'</button>').join("")+'</div><div id="result"></div>';document.querySelectorAll(".mopt").forEach(b=>b.onclick=()=>{if(answered)return;let ok=b.dataset.id===x.id;if(ok)correct++;lock(".mopt");$("result").innerHTML='<div class="result">'+(ok?"✓ ":"✎ ")+'<div class="result-correct">'+tokensHtml(toks)+'</div>'+usageHtml(x)+'<button id="nxt">NEXT</button></div>';$("nxt").onclick=next});wirePeek($("play"))}
function build(repaint=false){
  let d=window.LINKING_WORDS_MASTER_DECK||[],x,toks,parts,order,chosen,decoy;
  if(repaint&&current&&current.kind==="build"){({x,toks,parts,order,chosen,decoy}=current)}
  else{
    let found=null;
    for(const cand of shuffle(d)){let tt=deckExampleTokens(cand),pp=buildParts(cand,tt);if(buildEligible(pp)){found={x:cand,toks:tt,parts:pp};break}}
    if(!found){x=d[Math.floor(Math.random()*d.length)];toks=deckExampleTokens(x);parts=buildParts(x,toks)}else({x,toks,parts}=found);
    // 卡片不显示标点（标点会泄露顺序）；另加一张逻辑不同的关联词当干扰卡。
    parts=parts.map(p=>p.filter(t=>!BUILD_STOP.test(t[0]))).filter(p=>p.length);
    let wrong=shuffle(d.filter(y=>y.traditionalRelation!==x.traditionalRelation&&y.learnerFunction!==x.learnerFunction))[0];
    decoy=wrong?{id:wrong.id,tok:[[wrong.zh.split("……").filter(Boolean)[0],(wrong.pinyin||"").split("…").filter(Boolean)[0]||""]]}:null;
    let all=parts.map((_,i)=>i);if(decoy)all.push(parts.length);
    order=shuffle(all);chosen=[];current={kind:"build",x,toks,parts,order,chosen,decoy}
  }
  const card=i=>i<parts.length?parts[i]:decoy.tok;
  function paintZone(){$("zone").innerHTML=chosen.map(i=>'<span class="build-card">'+tokensHtml(card(i))+'</span>').join("")}
  $("play").innerHTML='<h2>BUILD</h2><div id="zone" class="casefile build-zone"></div><div class="options">'+order.map(i=>'<button class="bopt build-card" data-i="'+i+'">'+tokensHtml(card(i))+'</button>').join("")+'</div><button id="resetb">RESET</button> <button id="checkb">CHECK</button><div id="result"></div>';
  paintZone();
  document.querySelectorAll(".bopt").forEach(b=>{if(chosen.includes(Number(b.dataset.i)))b.disabled=true;b.onclick=()=>{if(answered||b.disabled)return;b.disabled=true;chosen.push(Number(b.dataset.i));paintZone()}});
  $("resetb").onclick=()=>{if(answered)return;chosen.length=0;paintZone();document.querySelectorAll(".bopt").forEach(b=>b.disabled=false)};
  $("checkb").onclick=()=>{if(answered)return;let usedDecoy=!!decoy&&chosen.includes(parts.length),ok=!usedDecoy&&chosen.length===parts.length&&chosen.every((v,i)=>v===i);if(ok)correct++;lock(".bopt,#checkb,#resetb");let dx=decoy&&d.find(y=>y.id===decoy.id);$("result").innerHTML='<div class="result">'+(ok?"✓ ":"✎ ")+(usedDecoy?'「'+decoy.tok[0][0]+'」不适合这句。':'')+'<div class="result-correct">'+tokensHtml(toks)+'</div>'+usageHtml(x)+(usedDecoy&&dx?usageHtml(dx):'')+'<button id="nxt">NEXT</button></div>';$("nxt").onclick=next};
  wirePeek($("play"))
}
