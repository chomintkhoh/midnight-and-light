*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;min-height:100vh;font-family:Inter,"Zen Kaku Gothic New",sans-serif;color:var(--warm);background:radial-gradient(circle at 20% 8%,rgba(182,169,218,.17),transparent 31rem),linear-gradient(180deg,var(--glow),var(--bg) 44%)}

.feedback{max-width:720px;margin:12px auto 0}.oops{border:2px solid rgba(224,135,154,.55);background:rgba(224,135,154,.11);border-radius:20px;padding:14px 16px;animation:pop .3s}@keyframes pop{from{transform:scale(.94);opacity:.2}to{transform:none;opacity:1}}.fb-tag{font-weight:800;color:#F2D27A}.fb-tag.funny{color:#F3B8C4}.fb-emoji{font-size:clamp(2.5rem,8vw,4.5rem);margin:7px 0}.fb-joke{font-size:clamp(1.05rem,2.7vw,1.35rem);font-weight:800;line-height:1.45}.teach{margin-top:10px;border-radius:13px;background:rgba(217,196,142,.13);padding:10px 12px;text-align:left;line-height:1.55}.teach b{color:var(--gold)}.correct{font-size:1.55rem;font-weight:800;color:var(--good);margin-top:10px}.answer{font-family:"Zen Kaku Gothic New";font-size:clamp(1.3rem,4vw,1.9rem);margin:8px 0}.next{min-width:160px;margin-top:10px}.stamp{position:absolute;width:88px;height:88px;object-fit:contain;right:2px;top:2px;transform:rotate(-8deg);pointer-events:none}.fallback{position:absolute;right:6px;top:4px;border:4px double var(--good);color:var(--good);border-radius:50%;width:76px;height:76px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;transform:rotate(-8deg)}

<script>
const app=document.getElementById("app"),who=document.getElementById("who");
const STAMP_SRC="./assets/images/great-stamp.png";
const REPORT_URL="https://script.google.com/macros/s/AKfycbyudegTYiMN3lR_DccPITENYKQfAEimsJqsigTqj3ea8slXMCGN1Q0OrSu8UTv_kYs/exec";
const CODE_KEY="mlStudentCode";
const STUDENT_CODE=(()=>{const clean=v=>(v||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,20);const q=clean(new URLSearchParams(location.search).get("s"));if(q){try{localStorage.setItem(CODE_KEY,q)}catch(e){}return q}try{return clean(localStorage.getItem(CODE_KEY))}catch(e){return ""}})();
if(STUDENT_CODE)who.className="who-bar",who.innerHTML=`<a href="practice.html">← All practice</a><span class="who-code">Student <b>${STUDENT_CODE}</b></span><a href="practice.html?switch=1">Not you?</a>`;
else who.className="no-code",who.innerHTML=`⚠ I don't know who you are yet. <a href="practice.html">Enter your code</a>`;
function el(t,c,txt){const x=document.createElement(t);if(c)x.className=c;if(txt!==undefined)x.textContent=txt;return x}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
const PREF_KEY="thingsPlacesPrefsV1";let lang="en";try{const p=JSON.parse(localStorage.getItem(PREF_KEY)||"null");if(p&&p.lang)lang=p.lang}catch(e){}
const SESSION_KEY="thingsPlacesSessionV1";function newSession(){return {code:STUDENT_CODE,start:Date.now(),items:{}}}function loadSession(){try{const x=JSON.parse(localStorage.getItem(SESSION_KEY)||"null");if(x&&x.code===STUDENT_CODE&&Date.now()-x.start<6*3600*1000)return x}catch(e){}return newSession()}let session=loadSession();function saveSession(){try{localStorage.setItem(SESSION_KEY,JSON.stringify(session))}catch(e){}}
const STAMP_CARD=20;function stampKey(){return "timePracticeStamps_"+(STUDENT_CODE||"guest")}function loadStamps(){try{const x=JSON.parse(localStorage.getItem(stampKey())||"null");if(x&&typeof x.count==="number")return x}catch(e){}return {count:0,cards:0}}function addStamp(){const s=loadStamps();s.count++;if(s.count>=STAMP_CARD){s.count=0;s.cards++;const t=el("div","toast","🎉 Stamp card full! A new card starts now.");document.body.append(t);setTimeout(()=>t.remove(),3000)}try{localStorage.setItem(stampKey(),JSON.stringify(s))}catch(e){}updateDoneBtn()}
function logResult(activity,item,ok){const k=activity+"||"+item,it=session.items[k]||{activity,item,tries:0,wrong:0,solved:false};it.tries++;if(ok){if(!it.solved)addStamp();it.solved=true}else it.wrong++;session.items[k]=it;saveSession();updateDoneBtn()}
function stamp(host){host.querySelectorAll(".stamp,.fallback").forEach(x=>x.remove());const im=new Image();im.className="stamp";im.src=STAMP_SRC;im.alt="Great!";im.onerror=()=>{im.remove();host.append(el("div","fallback","GREAT!"))};host.append(im)}
const SFX=(()=>{const a=new Audio("./assets/audio/ui/success-stamp.mp3");a.preload="auto";a.volume=.7;return {play(){try{a.pause();a.currentTime=.25;a.play().catch(()=>{})}catch(e){}}}})();
