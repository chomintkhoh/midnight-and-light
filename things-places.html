<body>
<main class="shell">
<header class="hero">
<h1>Things &amp; Places</h1>
<p>これ・も・の・じゃないです・ここ・そこ・あれ</p>
<div class="music-control" data-shared-bgm aria-label="Background music"></div>
<div id="who"></div>
</header>
<section id="app" aria-live="polite"></section>
</main>
<script src="./data/things-places-kids.js"></script>
<script>
const app=document.getElementById("app"),who=document.getElementById("who");
const STAMP_SRC="./assets/images/great-stamp.png";
const REPORT_URL="https://script.google.com/macros/s/AKfycbyudegTYiMN3lR_DccPITENYKQfAEimsJqsigTqj3ea8slXMCGN1Q0OrSu8UTv_kYs/exec";
const CODE_KEY="mlStudentCode";
const STUDENT_CODE=(()=>{const clean=v=>(v||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,20);const q=clean(new URLSearchParams(location.search).get("s"));if(q){try{localStorage.setItem(CODE_KEY,q)}catch(e){}return q}try{return clean(localStorage.getItem(CODE_KEY))}catch(e){return ""}})();
if(STUDENT_CODE)who.className="who-bar",who.innerHTML=`<a href="practice.html?s=${encodeURIComponent(STUDENT_CODE)}">← All practice</a><span class="who-code">Student <b>${STUDENT_CODE}</b></span><a href="practice.html?switch=1">Not you?</a>`;
else who.className="no-code",who.innerHTML=`⚠ I don't know who you are yet. <a href="practice.html">Enter your code</a>`;
function el(t,c,txt){const x=document.createElement(t);if(c)x.className=c;if(txt!==undefined)x.textContent=txt;return x}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
const PREF_KEY="thingsPlacesPrefsV1";let lang="en";try{const p=JSON.parse(localStorage.getItem(PREF_KEY)||"null");if(p&&p.lang)lang=p.lang}catch(e){}
const SESSION_BASE="thingsPlacesSessionV2";
function sessionKey(){return SESSION_BASE+"_"+(STUDENT_CODE||"guest")}
function makeSessionId(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8)}
function newSession(){return {id:makeSessionId(),code:STUDENT_CODE,start:Date.now(),items:{},attempts:[],stamped:{},sent:false}}
function loadSession(){try{const x=JSON.parse(localStorage.getItem(sessionKey())||"null");if(x&&x.code===STUDENT_CODE&&Date.now()-x.start<6*3600*1000){if(!Array.isArray(x.attempts))x.attempts=[];if(!x.stamped)x.stamped={};if(typeof x.sent!=="boolean")x.sent=false;if(!x.id)x.id=makeSessionId();return x}}catch(e){}return newSession()}
let session=loadSession();function saveSession(){try{localStorage.setItem(sessionKey(),JSON.stringify(session))}catch(e){}}
const STAMP_CARD=20;function stampKey(){return "timePracticeStamps_"+(STUDENT_CODE||"guest")}function loadStamps(){try{const x=JSON.parse(localStorage.getItem(stampKey())||"null");if(x&&typeof x.count==="number")return x}catch(e){}return {count:0,cards:0}}function addStamp(){const s=loadStamps();s.count++;if(s.count>=STAMP_CARD){s.count=0;s.cards++;const t=el("div","toast","🎉 Stamp card full! A new card starts now.");document.body.append(t);setTimeout(()=>t.remove(),3000)}try{localStorage.setItem(stampKey(),JSON.stringify(s))}catch(e){}updateDoneBtn()}
function logResult(activity,item,ok,picked){
 if(session.sent){session=newSession()}
 const k=activity+"||"+item,it=session.items[k]||{activity,item,tries:0,wrong:0,solved:false};
 it.tries++;if(ok){if(!session.stamped[item]){addStamp();session.stamped[item]=true}it.solved=true}else it.wrong++;
 session.items[k]=it;
 if(!ok&&picked)session.attempts.push({activity,item,picked,at:Date.now()});
 saveSession();updateDoneBtn()
}
function stamp(host){host.querySelectorAll(".stamp,.fallback").forEach(x=>x.remove());const im=new Image();im.className="stamp";im.src=STAMP_SRC;im.alt="Great!";im.onerror=()=>{im.remove();host.append(el("div","fallback","GREAT!"))};host.append(im)}
const SFX=(()=>{const a=new Audio("./assets/audio/ui/success-stamp.mp3");a.preload="auto";a.volume=.7;return {play(){try{a.pause();a.currentTime=.25;a.play().catch(()=>{})}catch(e){}}}})();
const TEXT={
 en:{intro:"Practise one grammar point at a time, or mix them together. Wrong answers may get teased first. Then the grammar will explain itself properly.",choose:"Choose a practice",pick:"Which sentence fits?",real:"🤔 A valid sentence—check its meaning",funny:"😈 An unusual meaning…",meaning:"This sentence says:",teach:"Now the serious part:",correct:"✓ Correct!",next:"Next →",menu:"← Menu",again:"Practice again",other:"Choose another",done:"Round complete!",first:"first try",q:"Question",explore:"👀 Explore other answers",exploreTitle:"Try it on purpose: what would the other answers mean?",exploreNote:"Explore mode does not change your score or your first answer.",backCorrect:"✓ Your original answer is still correct.",retry:"Try again. Now choose the sentence you think is correct:",hint:"Hint"},
 zh:{intro:"可以单独练一个文法，也可以全部混合。答错时可能会先被吐槽一下，然后才认真解释。",choose:"选择练习",pick:"哪一句最符合？",real:"🤔 句子成立，看看它的意思",funny:"😈 这个意思有点离奇……",meaning:"这句话的意思：",teach:"好，认真来：",correct:"✓ 答对了！",next:"下一题 →",menu:"← 菜单",again:"再练一次",other:"换其他练习",done:"这一轮完成！",first:"第一次就答对",q:"第",explore:"👀 看看其他答案",exploreTitle:"故意试试看：如果选别的会怎样？",exploreNote:"这里是探索模式，不会扣分，也不会改掉刚才的成绩。",backCorrect:"✓ 原本的答案还是正确的。",retry:"再试一次。现在选你认为正确的句子：",hint:"小提示"}
};
const L=(en,zh)=>lang==="zh"?zh:en,t=k=>TEXT[lang][k];
function langToggle(){const row=el("div","lang-row");[["en","English"],["zh","中文"]].forEach(([v,n])=>{const b=el("button",lang===v?"active":"",n);b.onclick=()=>{lang=v;try{localStorage.setItem(PREF_KEY,JSON.stringify({lang}))}catch(e){}render()};row.append(b)});return row}
let state={screen:"menu",group:"mix",queue:[],idx:0,score:0,tries:0,round:{}};
function render(){app.innerHTML="";if(state.screen==="menu")renderMenu();else if(state.screen==="play")renderPlay();else renderEnd()}
function renderMenu(){const p=el("section","panel");p.append(langToggle(),el("p","menu-intro",t("intro")));const guide=el("div","mini-guide");guide.innerHTML=lang==="zh"?'<div><b>ここ</b>我这里<br>靠近说话人</div><div><b>そこ</b>你那里<br>靠近听话人</div><div><b>あれ</b>远处那个东西<br>不是地点词</div>':'<div><b>ここ</b>HERE<br>near the speaker</div><div><b>そこ</b>THERE<br>near the listener</div><div><b>あれ</b>THAT thing over there<br>not a place word</div>';p.append(guide,el("div","play-title",t("choose")));const g=el("div","mode-grid");TP_GROUPS.forEach(m=>{const b=el("button","mode-card"+(m.id==="mix"?" mix":""));b.innerHTML=`<span class="mode-icon">${m.icon}</span><span class="mode-jp">${m.jp}</span><span class="mode-name">${L(m.en,m.zh)}</span>`;b.onclick=()=>start(m.id);g.append(b)});p.append(g);app.append(p)}
function buildQueue(group){
 if(group!=="mix")return shuffle(TP_QUESTIONS.filter(q=>q.group===group)).slice(0,8);
 /* Mixed means mixed: guarantee every grammar family appears.
    10 questions = 2 from each family + 2 extras from different families. */
 const groups=["this","no","negative","place"],picked=[],used=new Set();
 groups.forEach(g=>shuffle(TP_QUESTIONS.filter(q=>q.group===g)).slice(0,2).forEach(q=>{picked.push(q);used.add(q.id)}));
 const extraGroups=shuffle(groups).slice(0,2);
 extraGroups.forEach(g=>{const q=shuffle(TP_QUESTIONS.filter(x=>x.group===g&&!used.has(x.id)))[0];if(q){picked.push(q);used.add(q.id)}});
 return shuffle(picked)
}
function start(group){state={screen:"play",group,queue:buildQueue(group),idx:0,score:0,tries:0,round:{}};render();try{window.scrollTo({top:0,behavior:"smooth"})}catch(e){window.scrollTo(0,0)}}
function groupInfo(){return TP_GROUPS.find(x=>x.id===state.group)||TP_GROUPS[0]}
function progress(){const d=el("div","progress"),f=el("div","progress-fill");f.style.width=`${Math.round((state.idx/state.queue.length)*100)}%`;d.append(f,el("span","",`${Math.min(state.idx+1,state.queue.length)} / ${state.queue.length}`));return d}
function targetIcon(q){if(q.id.includes("library"))return "📚";if(q.id.includes("bank"))return "🏦";if(q.id.includes("school"))return "🏫";if(q.id.includes("umbrella"))return "☂️";if(q.id.includes("book"))return "📖";if(q.id.includes("pencil"))return "✏️";return "❓"}
function placeMap(q){const map=el("div","place-map"),kind=q.id.includes("-koko-")?"koko":q.id.includes("-soko-")?"soko":"are",icon=targetIcon(q);const labels=lang==="zh"?["我／说话人","你／听话人","远处"]:["ME / speaker","YOU / listener","FAR AWAY"];for(let i=0;i<3;i++){const active=(kind==="koko"&&i===0)||(kind==="soko"&&i===1)||(kind==="are"&&i===2),z=el("div","place-zone"+(active?" active":"")+(i===2?" far":""));z.append(el("div","place-label",labels[i]));if(i===0)z.append(el("div","place-person","🙋"));if(i===1)z.append(el("div","place-person","🧒"));if(active)z.append(el("div","place-target",icon));if(active)z.append(el("div","place-word",lang==="zh"?"目标":"TARGET"));map.append(z)}return map}

function summarize(){const acts={};Object.values(session.items).forEach(it=>{const a=acts[it.activity]||(acts[it.activity]={n:0,first:0,later:0,notyet:0,mistakes:[]});a.n++;if(it.solved&&it.wrong===0)a.first++;else if(it.solved)a.later++;else a.notyet++;if(it.wrong>0)a.mistakes.push(it)});return acts}function minutesSpent(){return Math.max(1,Math.round((Date.now()-session.start)/60000))}
function reportPayload(acts){const st=loadStamps();const summary=Object.entries(acts).map(([k,a])=>`${ACT_ZH[k]||k}：${a.first}/${a.n} 一次答对`+(a.later?`，${a.later} 题后来改对`:"")+(a.notyet?`，${a.notyet} 题未完成`:"")).join("；")+`；印章卡：已集满 ${st.cards} 张，目前 ${st.count}/${STAMP_CARD}`;const mistakes=Object.entries(acts).flatMap(([k,a])=>a.mistakes.map(m=>`${ACT_ZH[k]||k}：${m.item}（错${m.wrong}次${m.solved?"，后来改对":"，未答对"}）`)).join("\n");const confusion={};(session.attempts||[]).forEach(x=>{const q=TP_QUESTIONS.find(q=>q.id===x.item),right=q&&q.options.find(o=>o.ok);if(!right)return;const key=right.jp+" → "+x.picked;confusion[key]=(confusion[key]||0)+1});const pairs=Object.entries(confusion).sort((a,b)=>b[1]-a[1]).slice(0,8);const confusionText=pairs.length?"\n\n常见混淆：\n"+pairs.map(([k,n])=>k+"（"+n+"次）").join("\n"):"";const detail=JSON.stringify({activities:Object.fromEntries(Object.entries(acts).map(([k,a])=>[k,{questions:a.n,firstTry:a.first,fixedLater:a.later,notSolved:a.notyet}])),confusions:Object.fromEntries(pairs)});return {code:STUDENT_CODE,page:"things-places.html",sessionId:session.id,minutes:minutesSpent(),summary:summary||"（没有做任何题目）",mistakes:mistakes+confusionText,detail}}
