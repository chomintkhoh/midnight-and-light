<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hiragana Lesson | ミッドナイトとライト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#23263a;--muted:#7a7686;--line:#e2dccf;--gold:#b88a1e;--lav:#6f5aa8;--lavbg:#efeaf8;--good:#2f8a46;--goodbg:#e4f3e7;--bad:#c2475d;--badbg:#fbe9ec}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Zen Kaku Gothic New",system-ui,sans-serif}
button{font:inherit;cursor:pointer}
.jp{font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font-size:18px;margin:0 8px 0 0;font-weight:800}
.blocks{display:flex;gap:6px;flex-wrap:wrap}
.blocks button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px}
.blocks button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.count{margin-left:auto;color:var(--muted);font-weight:700;font-size:14px}
.bar{height:5px;background:var(--line)}.bar i{display:block;height:100%;background:var(--lav);transition:width .25s}
.stage{width:min(1180px,96vw);margin:14px auto 0;min-height:calc(100vh - 170px)}
.slide{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 26px;box-shadow:0 8px 24px rgba(0,0,0,.05)}
.kicker{color:var(--gold);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:14px;text-align:center}
.title{font-size:clamp(28px,3.4vw,42px);font-weight:800;text-align:center;margin:6px 0 4px}
.sub{color:var(--muted);text-align:center;font-size:clamp(17px,1.8vw,20px);margin:4px 0 14px}
.nav{display:flex;justify-content:center;gap:10px;margin:14px 0 24px}
.nav button{min-width:150px;padding:12px 18px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:17px}
.nav .next{background:var(--ink);color:#fff;border-color:var(--ink)}
.nav button:disabled{opacity:.35;cursor:default}
/* title slide */
.kgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;max-width:760px;margin:18px auto}
.ktile{border:2px solid var(--line);border-radius:18px;background:#fff;font-size:clamp(46px,6vw,74px);padding:8px 0;line-height:1.2}
.ktile:hover{border-color:var(--lav);background:var(--lavbg)}
/* learn slide */
.learn{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:26px;align-items:start}
.lhead{display:flex;align-items:center;justify-content:center;gap:18px}
.bigk{font-size:clamp(110px,13vw,170px);line-height:1;font-weight:700}
.snd{width:72px;height:72px;border-radius:50%;border:2px solid var(--line);background:var(--lavbg);font-size:30px}
.stroke-box{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:6px}
.stroke-svg{width:min(240px,60vw);aspect-ratio:1;border:2px solid var(--line);border-radius:18px;background:
 linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat,linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat,#fffdf8}
.stroke-svg path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.stroke-svg .g{stroke:#e4dfd3;stroke-width:5}
.stroke-svg .s{stroke:var(--ink);stroke-width:5;stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
.stroke-svg .s.on{stroke-dashoffset:0;opacity:1;transition:stroke-dashoffset .9s ease}
.stroke-svg .s.now{stroke:#d1495b}
.stroke-svg text{font-size:8px;font-weight:800;fill:#d1495b;font-family:Inter,sans-serif}
.srow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.srow button,.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px}
.snote{color:var(--muted);font-size:15px;min-height:1.4em}
.words{display:grid;gap:10px}
.wcard{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:12px;border:2px solid var(--line);border-radius:18px;background:#fff;padding:8px 14px;text-align:left}
.wcard:hover{border-color:var(--lav)}
.wcard .em{font-size:48px;text-align:center}
.wcard .lex{width:64px;height:64px;image-rendering:pixelated;display:block;margin:auto}
.q-pic .lex{width:min(40vw,200px);height:min(40vw,200px);image-rendering:pixelated}
.wcard .em.noimg{font-size:15px;color:var(--muted);font-weight:700}
.wcard .w{font-size:clamp(34px,3.6vw,46px);font-weight:700}
.wcard .w b{color:#d1495b}
.wcard .m{color:var(--lav);font-weight:800;font-size:18px;visibility:hidden;text-align:right}
.wcard.on{background:var(--lavbg);border-color:var(--lav)}.wcard.on .m{visibility:visible}
.pad-wrap{margin-top:14px}
.pad-title{font-weight:800;color:var(--gold);font-size:15px;margin:0 0 6px}
.pad{position:relative;width:100%;height:210px;border:2px dashed var(--line);border-radius:18px;background:#fffdf8;touch-action:none;overflow:hidden}
.pad canvas{position:absolute;inset:0;width:100%;height:100%}
.pad .ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-around;font-size:150px;color:#ece6d8;pointer-events:none}
/* quiz slides */
.q-area{text-align:center}
.q-pic{font-size:clamp(90px,12vw,140px);line-height:1.1}
.q-opts{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:18px auto;max-width:900px}
.q-opt{border:2px solid var(--line);border-radius:18px;background:#fff;font-size:clamp(46px,6vw,70px);min-width:120px;padding:4px 18px}
.q-opt.ok{background:var(--goodbg);border-color:var(--good)}
.q-opt.no{background:var(--badbg);border-color:var(--bad);opacity:.6}
.q-msg{font-size:22px;font-weight:800;min-height:1.5em}
.q-msg.ok{color:var(--good)}.q-msg.no{color:var(--bad)}
.big-btn{border:none;background:var(--lav);color:#fff;border-radius:999px;padding:12px 24px;font-size:19px;font-weight:800}
.score{color:var(--muted);font-weight:700}
/* homework slide */
.hw{max-width:760px;margin:10px auto;display:grid;gap:14px}
.hw-item{display:flex;gap:14px;align-items:flex-start;border:2px solid var(--line);border-radius:18px;padding:14px 18px;background:#fff;font-size:20px}
.hw-item .ic{font-size:36px}
.hw-item b{display:block;margin-bottom:4px}
.hw-item a{color:var(--lav);font-weight:800}
.credit{text-align:center;font-size:11px;color:var(--muted);margin:6px 0 0}
.credit a{color:inherit}
@media(max-width:860px){.learn{grid-template-columns:1fr}.kgrid{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.wcard{grid-template-columns:56px 1fr}.wcard .m{grid-column:1/-1;text-align:left}}
/* shop extra */
.blocks button.extra{border-color:var(--gold);color:var(--gold)}.blocks button.extra.on{background:var(--gold);color:#fff}
.shelf{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:14px auto;max-width:900px}
.item{border:2px solid var(--line);border-radius:18px;background:#fff;padding:8px 12px;min-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px}
.item:hover{border-color:var(--lav);background:var(--lavbg)}
.item img{width:84px;height:84px;image-rendering:pixelated}
.item .w{font-size:28px;font-weight:700}.item .m{color:var(--muted);font-size:14px;font-weight:700}
.phr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:960px;margin:10px auto}
.pcard{border:2px solid var(--line);border-radius:18px;background:#fff;padding:12px 16px;text-align:left;display:flex;align-items:center;gap:12px}
.pcard .who{font-size:34px}.pcard .jp{font-size:clamp(26px,2.8vw,34px);font-weight:700;display:block}
.pcard .m{color:var(--lav);font-weight:800;font-size:17px;visibility:hidden}.pcard.on{background:var(--lavbg);border-color:var(--lav)}.pcard.on .m{visibility:visible}
.chat{max-width:760px;margin:8px auto;display:grid;gap:10px}
.line{display:flex;gap:10px;align-items:center;opacity:0;transform:translateY(6px);transition:.3s}.line.show{opacity:1;transform:none}
.line.c{flex-direction:row-reverse}
.bub{border-radius:18px;padding:10px 16px;font-size:clamp(24px,2.6vw,32px);font-weight:700;background:#fff;border:2px solid var(--line);cursor:pointer}
.line.c .bub{background:var(--lavbg);border-color:var(--lav)}
.line .who{font-size:38px}
.pics{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:360px;margin:6px auto}
.pics img{width:64px;height:64px;image-rendering:pixelated}
.sent{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;font-size:clamp(30px,3.4vw,42px);font-weight:700;margin:12px 0}
.slot{min-width:150px;border-bottom:4px solid var(--lav);text-align:center;padding:0 8px;color:var(--lav)}
.slot.ok{color:var(--good);border-color:var(--good)}
.tiles{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:8px auto}
.tile{border:2px solid var(--line);border-radius:14px;background:#fff;font-size:clamp(26px,2.8vw,34px);font-weight:700;padding:4px 16px}
.tile:disabled{color:var(--ink);cursor:default}.tile.no{background:var(--badbg);border-color:var(--bad);opacity:.6}.tile.ok{background:var(--goodbg);border-color:var(--good)}
.tlabel{font-weight:800;color:var(--gold);font-size:14px;text-align:center;margin-top:8px}
.basket{min-height:96px;border:3px dashed var(--line);border-radius:22px;max-width:720px;margin:10px auto;padding:8px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;background:#fffdf8}
.basket img{width:56px;height:56px;image-rendering:pixelated}
.basket .empty{color:var(--muted);font-weight:700}
.reveal{color:var(--muted);font-size:clamp(24px,2.6vw,30px);font-weight:700;min-height:1.4em}
.srow .big-btn{border:none;background:var(--lav);color:#fff;padding:12px 24px;font-size:19px;font-weight:800}
.srow .big-btn:disabled{opacity:.35;cursor:default}
.tip{max-width:760px;margin:10px auto 0;color:var(--muted);font-size:14px;text-align:center}
@media(max-width:860px){.phr{grid-template-columns:1fr}}
/* live class */
.live-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px}
.live-btn.on{background:var(--goodbg);border-color:var(--good);color:var(--good)}.live-btn.wait{background:#fff7d6;border-color:#e9d38a}
.lp{position:fixed;top:60px;right:14px;z-index:20;width:min(380px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.15);padding:16px 18px;display:none}
.lp.open{display:block}
.lp h3{margin:0 0 6px;font-size:18px}.lp p{margin:6px 0;color:var(--muted);font-size:14px;line-height:1.45}
.lp .code{font-size:40px;font-weight:800;letter-spacing:.15em;text-align:center;color:var(--lav);margin:4px 0}
.lp input{width:100%;font:inherit;font-size:13px;padding:8px;border:1px solid var(--line);border-radius:10px}
.lp .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.lp .row button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.lp .row .main{background:var(--ink);color:#fff;border-color:var(--ink)}
.lp .st{font-weight:800;margin:8px 0 0}.lp .st.ok{color:var(--good)}.lp .st.no{color:var(--bad)}
.mnem{display:flex;gap:12px;align-items:center;margin:12px auto 0;max-width:520px;background:#fff7d6;border:1px solid #e9d38a;border-radius:14px;padding:10px 14px;font-size:17px;line-height:1.45}.mnem .me{font-size:38px;line-height:1}
</style>
</head>
<body>
<div class="top">
  <h1>✍️ Hiragana Lesson</h1>
  <div class="blocks" id="blocks"></div>
  <div class="blocks" id="modes"><button data-m="lesson" title="Teach every letter">📖 Lesson</button><button data-m="review" title="Skip the learning pages: quiz only">🔁 Review</button></div>
  <span class="count" id="count"></span>
  <button class="live-btn" id="liveBtn" data-local title="Do the lesson together on two devices — no screen sharing">📡 Live</button>
</div>
<div class="bar"><i id="barFill"></i></div>
<main class="stage" id="stage"></main>
<div class="lp" id="lp" data-local></div>

<script src="../data/hiragana-words.js"></script>
<script src="../data/hiragana-strokes.js"></script>
<script src="../data/lexicon-images.js"></script>
<script src="../data/hiragana-mnemonics.js"></script>
<script>
const $=id=>document.getElementById(id);
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
/* seeded random: both devices in a live class get the same questions */
let rnd=Math.random;
function setSeed(a){a>>>=0;rnd=function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let audio=null;
function play(src){if(!src||(typeof Live!=="undefined"&&Live.muted))return;try{if(audio)audio.pause();audio=new Audio("../"+src);audio.play().catch(()=>{})}catch(e){}}
const KANA=Object.fromEntries(HW_KANA.map(k=>[k.kana,k.words]));

/* ---------- slide list for a block ---------- */
/* ---------- Extra topic: shopping (uses ひとつ〜とお + いくつ) ---------- */
const SHOP_BLOCK={id:"shop",label:"🛒 おみせ",extra:true};
const TSU=["","ひとつ","ふたつ","みっつ","よっつ","いつつ","むっつ","ななつ","やっつ","ここのつ","とお"];
const SHOP_ITEMS=[["りんご","apple"],["みかん","mandarin orange"],["いちご","strawberry"],["あめ","candy"],["たまご","egg"],["えんぴつ","pencil"]];
const shopImg=it=>lexImg(it[0],it[1],"../");
const imgTag=it=>`<img src="${shopImg(it)}" alt="${it[1]}">`;
let jaVoice=null;
function pickVoice(){if(!("speechSynthesis" in window))return;const v=speechSynthesis.getVoices();jaVoice=v.find(x=>/^ja/i.test(x.lang))||null}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t){try{if(!("speechSynthesis" in window)||Live.muted)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/〇〇/g,""));u.lang="ja-JP";if(jaVoice)u.voice=jaVoice;u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function randOrder(){return {it:SHOP_ITEMS[Math.floor(rnd()*SHOP_ITEMS.length)],n:1+Math.floor(rnd()*10)}}
const orderText=o=>`${o.it[0]}を ${TSU[o.n]} ください`;

let block=HW_BLOCKS[0],slides=[],idx=0;
let lessonMode="lesson";
function buildSlides(){
  if(block.id==="shop"){slides=lessonMode==="review"
    ?[{type:"shopTitle"},{type:"shopOrder"},{type:"shopClerk"},{type:"shopPlay"}]
    :[{type:"shopTitle"},{type:"shopPhrases"},{type:"shopDialogue"},{type:"shopOrder"},{type:"shopClerk"},{type:"shopPlay"}];return}
  const ks=block.kana;slides=[{type:"title"}];
  if(lessonMode==="review"){slides.push({type:"check",upto:ks,final:true},{type:"first"},{type:"homework"});return}
  ks.forEach((k,i)=>{
    slides.push({type:"learn",kana:k});
    if((i+1)%5===0&&i<ks.length-1)slides.push({type:"check",upto:ks.slice(0,i+1)});
  });
  slides.push({type:"check",upto:ks,final:true});
  slides.push({type:"first"});
  slides.push({type:"homework"});
}
function go(i){idx=Math.max(0,Math.min(slides.length-1,i));render();
  const u=new URL(location.href);u.searchParams.set("b",block.id);u.searchParams.set("p",idx+1);u.searchParams.set("m",lessonMode);history.replaceState(null,"",u)}
function nav(st){const n=el("div","nav"),p=el("button","","← Back"),x=el("button","next",idx===slides.length-1?"Done ✓":"Next →");
  p.disabled=idx===0;p.onclick=()=>go(idx-1);x.onclick=()=>idx<slides.length-1?go(idx+1):go(0);n.append(p,x);st.append(n)}
function render(){
  if(audio)audio.pause();
  try{speechSynthesis.cancel()}catch(e){}
  const s=slides[idx],st=$("stage");st.innerHTML="";
  $("count").textContent=`${idx+1} / ${slides.length}`;
  $("barFill").style.width=((idx+1)/slides.length*100)+"%";
  document.querySelectorAll("#blocks button").forEach(b=>b.classList.toggle("on",b.dataset.id===block.id));
  document.querySelectorAll("#modes button").forEach(b=>b.classList.toggle("on",b.dataset.m===lessonMode));
  const card=el("section","slide");st.append(card);
  R[s.type](card,s);nav(st);
  window.scrollTo(0,0);
}

/* ---------- renderers ---------- */
const R={
title(c){
  c.append(el("div","kicker","Today's hiragana"),el("div","title jp",block.label),el("div","sub","Tap a letter to jump to it. Press → to start."));
  const g=el("div","kgrid");
  block.kana.forEach(k=>{const b=el("button","ktile jp",k);b.onclick=()=>go(slides.findIndex(s=>s.kana===k));g.append(b)});
  c.append(g);
},
learn(c,s){
  const k=s.kana,n=block.kana.indexOf(k)+1;
  c.append(el("div","kicker",`Letter ${n} of ${block.kana.length}`));
  const wrap=el("div","learn"),left=el("div"),right=el("div");
  const head=el("div","lhead"),big=el("div","bigk jp",k),snd=el("button","snd","🔊");
  snd.title="Play the sound";snd.onclick=()=>play(KANA_AUDIO[k]);head.append(big,snd);left.append(head);
  const mn=(typeof HIRA_MNEMONIC!=="undefined")&&HIRA_MNEMONIC[k];
  if(mn)left.append(el("div","mnem",`<span class="me">${mn[0]}</span><span><b>${mn[1]}</b><br>${mn[2]}</span>`));
  left.append(strokeBox(k));
  right.append(el("div","sub",'Tap a word: hear it, then see what it means.'));
  const ws=el("div","words");
  (KANA[k]||[]).forEach(([w,pic,en])=>{
    const b=el("button","wcard");
    const hl=w.replace(k,`<b>${k}</b>`);
    const im=lexImg(w,en,"../");
    b.append(im?el("div","em",`<img class="lex" src="${im}" alt="">`):el("div","em"+(pic?"":" noimg"),pic||"🖼️"),el("div","w jp",hl),el("div","m",en));
    b.onclick=()=>{b.classList.add("on");play(HW_AUDIO[w])};ws.append(b)});
  right.append(ws,pad(k));
  wrap.append(left,right);c.append(wrap);
  c.append(el("div","credit",KANA_CREDIT));
  setTimeout(()=>play(KANA_AUDIO[k]),250);
},
check(c,s){
  c.append(el("div","kicker",s.final?"Review · all letters":"Quick check"),el("div","title","Listen. Which letter is it?"),el("div","sub","Say it out loud first, then tap."));
  const area=el("div","q-area");c.append(area);
  let score=0,asked=0,last=null;
  const ask=()=>{
    area.innerHTML="";
    let t;do{t=s.upto[Math.floor(rnd()*s.upto.length)]}while(s.upto.length>1&&t===last);last=t;
    const opts=shuffle([t,...shuffle(s.upto.filter(x=>x!==t)).slice(0,Math.min(4,s.upto.length-1))]);
    const again=el("button","big-btn","🔊 Listen again");again.onclick=()=>play(KANA_AUDIO[t]);
    const box=el("div","q-opts"),msg=el("div","q-msg"),sc=el("div","score",`${score} / ${asked}`);
    let first=true;
    opts.forEach(o=>{const b=el("button","q-opt jp",o);b.onclick=()=>{
      if(o===t){b.classList.add("ok");msg.className="q-msg ok";msg.textContent="✓ That's right!";if(first)score++;asked++;sc.textContent=`${score} / ${asked}`;
        box.querySelectorAll("button").forEach(x=>x.disabled=true);const nx=el("button","big-btn","Next question →");nx.style.marginTop="10px";nx.onclick=ask;area.append(nx)}
      else{b.classList.add("no");b.disabled=true;first=false;msg.className="q-msg no";msg.textContent="↻ Try again";play(KANA_AUDIO[t])}}
      ;box.append(b)});
    area.append(again,box,msg,sc);setTimeout(()=>play(KANA_AUDIO[t]),200);
  };ask();
},
first(c){
  c.append(el("div","kicker","Word game"),el("div","title","Which letter does it start with?"),el("div","sub","Look at the picture and say the word, then tap its first letter."));
  const area=el("div","q-area");c.append(area);
  const pool=block.kana.flatMap(k=>(KANA[k]||[]).filter(w=>w[0].startsWith(k)&&(w[1]||lexImg(w[0],w[2]))).map(w=>({k,w})));
  let order=shuffle(pool),i=0;
  const ask=()=>{

/* ---------- stroke order ---------- */
function strokeBox(k){
  const box=el("div","stroke-box"),paths=KANA_STROKES[k]||[];
  const svgNS="http://www.w3.org/2000/svg",svg=document.createElementNS(svgNS,"svg");
  svg.setAttribute("viewBox","0 0 109 109");svg.setAttribute("class","stroke-svg");
  const ink=[];
  paths.forEach(d=>{const g=document.createElementNS(svgNS,"path");g.setAttribute("d",d);g.setAttribute("class","g");svg.append(g)});
  paths.forEach((d,i)=>{const p=document.createElementNS(svgNS,"path");p.setAttribute("d",d);p.setAttribute("class","s");p.setAttribute("pathLength","1");svg.append(p);ink.push(p);
    const t=document.createElementNS(svgNS,"text");const m=d.match(/M\s*([\d.]+)[ ,]([\d.]+)/);if(m){t.setAttribute("x",+m[1]-7);t.setAttribute("y",+m[2]-2);t.textContent=i+1;t.style.opacity=0;svg.append(t);p._num=t}});
  let shown=0,timer=null;
  const note=el("div","snote",`${paths.length} stroke${paths.length>1?"s":""}`);
  const show=n=>{ink.forEach((p,i)=>{p.classList.toggle("now",i===n-1);if(i<n){p.classList.add("on");p._num&&(p._num.style.opacity=1)}else{p.classList.remove("on");p._num&&(p._num.style.opacity=0)}});shown=n;note.textContent=n?`Stroke ${n} of ${paths.length}`:`${paths.length} stroke${paths.length>1?"s":""}`};
  const reset=()=>{clearInterval(timer);ink.forEach(p=>{p.style.transition="none";p.classList.remove("on","now");p._num&&(p._num.style.opacity=0)});svg.getBoundingClientRect();ink.forEach(p=>p.style.transition="");shown=0};
  const row=el("div","srow"),playAll=el("button","","▶ Play"),step=el("button","","Next stroke"),clr=el("button","","↺");
  playAll.onclick=()=>{reset();let n=0;timer=setInterval(()=>{n++;show(n);if(n>=paths.length)clearInterval(timer)},1000);show(0)};
  step.onclick=()=>{clearInterval(timer);if(shown>=paths.length)reset();show(shown+1)};
  clr.onclick=()=>{reset();show(0)};
  row.append(playAll,step,clr);box.append(svg,note,row);
  setTimeout(()=>playAll.onclick(),500);
  return box;
}

/* ---------- writing pad (teacher demo) ---------- */
function pad(k){
  const w=el("div","pad-wrap");w.append(el("div","pad-title","✏️ Write it together"));
  const p=el("div","pad"),ghost=el("div","ghost jp",`<span>${k}</span><span></span><span></span>`),cv=document.createElement("canvas");
  p.append(ghost,cv);w.append(p);
  const row=el("div","srow"),clr=el("button","","Clear"),gh=el("button","","Hide guide");row.style.marginTop="8px";
  clr.onclick=()=>{const c=cv.getContext("2d");c.clearRect(0,0,cv.width,cv.height)};
  cv._draw=()=>{};
  gh.onclick=()=>{const h=ghost.style.visibility==="hidden";ghost.style.visibility=h?"":"hidden";gh.textContent=h?"Hide guide":"Show guide"};
  row.append(clr,gh);w.append(row);
  requestAnimationFrame(()=>{const r=p.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;
    const c=cv.getContext("2d");c.scale(dpr,dpr);c.lineWidth=7;c.lineCap="round";c.lineJoin="round";c.strokeStyle="#23263a";
    let down=false;const pt=e=>{const b=cv.getBoundingClientRect();return [(e.clientX-b.left)/b.width,(e.clientY-b.top)/b.height]};
    const pens={};
    /* nx,ny = 0..1 so drawings line up on screens of different sizes */
    cv._draw=(who,k,nx,ny)=>{const b=cv.getBoundingClientRect(),x=nx*b.width,y=ny*b.height;c.strokeStyle=who==="me"?"#23263a":"#6f5aa8";
      if(k==="d"){pens[who]=[x,y]}else if(k==="m"&&pens[who]){c.beginPath();c.moveTo(pens[who][0],pens[who][1]);c.lineTo(x,y);c.stroke();pens[who]=[x,y]}else if(k==="u"){delete pens[who]}};
    const local=(k,e)=>{const [nx,ny]=e?pt(e):[0,0];cv._draw("me",k,nx,ny);Live.send({t:"d",p:[...document.querySelectorAll(".pad canvas")].indexOf(cv),k,x:+nx.toFixed(4),y:+ny.toFixed(4)})};
    cv.addEventListener("pointerdown",e=>{down=true;cv.setPointerCapture(e.pointerId);local("d",e)});
    cv.addEventListener("pointermove",e=>{if(down)local("m",e)});
    ["pointerup","pointercancel"].forEach(t=>cv.addEventListener(t,()=>{if(down){down=false;local("u")}}));
  });
  return w;
}

/* ---------- LIVE CLASS: two devices, one lesson (no screen sharing) ----------
   Teacher presses 📡 Live → gets a link → sends it to the student.
   Every tap, page turn and drawing is copied to the other device.
   Uses PeerJS (free, no account): devices connect directly to each other. */
const Live={peer:null,conn:null,role:null,code:null,applying:false,muted:false,status:"off",
  send(m){if(this.applying||!this.conn||!this.conn.open)return;try{this.conn.send(m)}catch(e){}},
  buttons(){return [...document.querySelectorAll("button")].filter(b=>!b.closest("[data-local]"))},
  opts(){const h=new URLSearchParams(location.search).get("peerhost");if(!h)return {};const [host,port]=h.split(":");return {host,port:+port||443,path:"/",secure:location.protocol==="https:"}},
  loadLib(){return new Promise((ok,bad)=>{if(window.Peer)return ok();const srcs=["https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js","https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"];
    const tryN=i=>{if(i>=srcs.length)return bad();const sc=document.createElement("script");sc.src=srcs[i];sc.onload=()=>ok();sc.onerror=()=>tryN(i+1);document.head.append(sc)};tryN(0)})},
  set(st,msg){this.status=st;const b=$("liveBtn");b.classList.toggle("on",st==="on");b.classList.toggle("wait",st==="wait");
    b.textContent=st==="on"?(this.role==="host"?"🟢 Live: student here":"🟢 Live with teacher"):st==="wait"?"🟡 Live: waiting":"📡 Live";this.msg=msg||"";this.draw()},
  draw(){const p=$("lp");if(!p.classList.contains("open"))return;p.innerHTML="";
    if(!this.role){p.innerHTML=`<h3>📡 Live class</h3><p>Do this lesson together on two devices. The student opens your link on their own tablet or computer: no screen sharing. Every tap, page and drawing shows on both screens.</p>`;
      const r=el("div","row"),st=el("button","main","Start live class"),cl=el("button","","Close");st.onclick=()=>this.host();cl.onclick=()=>p.classList.remove("open");r.append(st,cl);p.append(r);return}
    if(this.role==="host"&&this.code){const link=location.origin+location.pathname+"?live="+this.code;
      p.append(el("h3","","📡 Live class"),el("p","","Send this link to your student (WhatsApp / chat):"));
      const inp=el("input");inp.readOnly=true;inp.value=link;inp.onclick=()=>inp.select();p.append(inp,el("p","","Room code"),el("div","code",this.code))}
    else p.append(el("h3","","📡 Live class"));
    p.append(el("div","st "+(this.status==="on"?"ok":this.status==="err"?"no":""),this.msg));
    const r=el("div","row");
    if(this.role==="host"&&this.code){const cp=el("button","main","Copy link");cp.onclick=()=>{const v=location.origin+location.pathname+"?live="+this.code;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>cp.textContent="Copied ✓").catch(()=>{p.querySelector("input").select()})};r.append(cp)}
    if(this.status==="on"){const rs=el("button","","🔄 Re-sync");rs.title="Use if the two screens look different";rs.onclick=()=>this.role==="host"?this.sync():this.send({t:"hello"});r.append(rs)}
    if(this.role==="guest"&&this.status==="err"){const rt=el("button","main","Try again");rt.onclick=()=>this.join(this.code);r.append(rt)}
    const mu=el("button","",this.muted?"🔇 Sound off here":"🔊 Sound on here");mu.title="Turn off sound on this device (stops echo in the call)";mu.onclick=()=>{this.muted=!this.muted;this.draw()};r.append(mu);
    const en=el("button","","End");en.onclick=()=>this.end();const cl=el("button","","Close");cl.onclick=()=>p.classList.remove("open");r.append(en,cl);p.append(r)},
  async start(){try{await this.loadLib()}catch(e){this.set("err","Could not load the live tool. Check the internet and refresh.");return false}return true},
  async host(){this.role="host";this.set("wait","Starting…");if(!await this.start())return;
    const code=String(1000+Math.floor(Math.random()*9000));this.code=code;
    const peer=this.peer=new Peer("mnl-hira-"+code,this.opts());
    peer.on("open",()=>this.set("wait","Waiting for the student to open the link…"));
    peer.on("connection",c=>{if(this.conn)try{this.conn.close()}catch(e){}this.wire(c)});
    peer.on("error",e=>{if(e.type==="unavailable-id"){peer.destroy();this.host();return}this.set("err","Connection problem: "+e.type)});
    peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}})},
  async join(code){this.role="guest";this.code=code;$("lp").classList.add("open");this.set("wait","Joining class "+code+"…");if(!await this.start())return;
    if(this.peer)try{this.peer.destroy()}catch(e){}
    const peer=this.peer=new Peer(this.opts());
    peer.on("open",()=>this.wire(peer.connect("mnl-hira-"+code,{serialization:"json",reliable:true})));
    peer.on("error",e=>this.set("err",e.type==="peer-unavailable"?"Teacher's class is not open yet. Ask your teacher, then press Try again.":"Connection problem: "+e.type))},
  wire(c){this.conn=c;
    c.on("open",()=>{this.set("on",this.role==="host"?"✓ Student connected. Teach as normal: both screens move together.":"✓ Connected to your teacher!");if(this.role==="guest"){this.send({t:"hello"});setTimeout(()=>$("lp").classList.remove("open"),1500)}});

  sync(){const seed=Math.floor(Math.random()*2**31);setSeed(seed);buildSlides();go(idx);this.send({t:"state",b:block.id,m:lessonMode,i:idx,seed})},
  recv(m){if(!m||!m.t)return;this.applying=true;try{

  }finally{this.applying=false}},
  end(){try{this.conn&&this.conn.close()}catch(e){}try{this.peer&&this.peer.destroy()}catch(e){}this.conn=this.peer=null;this.role=null;this.code=null;this.set("off");
    const u=new URL(location.href);u.searchParams.delete("live");history.replaceState(null,"",u);this.draw()}
};

const ALL_BLOCKS=HW_BLOCKS.concat([SHOP_BLOCK]);
ALL_BLOCKS.forEach(b=>{const x=el("button","jp"+(b.extra?" extra":""),b.label);x.dataset.id=b.id;x.onclick=()=>{block=b;buildSlides();go(0)};$("blocks").append(x)});
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();go(idx+1);Live.send({t:"go",i:idx})}else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();go(idx-1);Live.send({t:"go",i:idx})}});
document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>{lessonMode=b.dataset.m;buildSlides();go(0)});
$("liveBtn").onclick=()=>{const p=$("lp");p.classList.toggle("open");Live.draw()};
(function(){const q=new URLSearchParams(location.search);if(q.get("m")==="review")lessonMode="review";const b=ALL_BLOCKS.find(x=>x.id===q.get("b"));if(b)block=b;buildSlides();go((+q.get("p")||1)-1);if(/^\d{4}$/.test(q.get("live")||""))Live.join(q.get("live"))})();
</script>
</body>
</html>
