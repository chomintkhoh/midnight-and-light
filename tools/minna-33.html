<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第33課 Live | ミッドナイトとライト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<!--
  大家的日本語 第33課 线上课件（Live：老师和学生各用自己的装置）
  - 一堂 60 分钟：单词 → 命令形／禁止形 → 看板挑战 → 传话游戏 → 课本（会话・听解）→ 情景＋总结
  - 课本的会话、练习、听解、問題都不放进来（版权）：上课时翻课本。这里的句子、情景都是自己写的。
  - 「看板」和「传话」是信息差活动：两台装置看到的不一样，要开口问对方。
    每台装置自己选角色（不同步）。两人用同一台装置时：老师选一边，学生选另一边。
-->
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#23263a;--muted:#7a7686;--line:#e2dccf;--gold:#b88a1e;--lav:#6f5aa8;--lavbg:#efeaf8;--good:#2f8a46;--goodbg:#e4f3e7;--bad:#c2475d;--badbg:#fbe9ec;--warn:#fff7d6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Zen Kaku Gothic New",system-ui,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
.jp,.slide{font-family:"Zen Kaku Gothic New","Noto Sans JP",Inter,sans-serif}
rt{font-size:.5em;color:var(--muted)}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font-size:18px;margin:0 8px 0 0;font-weight:800}
.blocks{display:flex;gap:6px;flex-wrap:wrap}
.blocks button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.blocks button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.count{margin-left:auto;color:var(--muted);font-weight:700;font-size:14px}
.bar{height:5px;background:var(--line)}.bar i{display:block;height:100%;background:var(--lav);transition:width .25s}
.stage{width:min(1100px,96vw);margin:14px auto 0;min-height:calc(100vh - 170px)}
.slide{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 24px;box-shadow:0 8px 24px rgba(0,0,0,.05)}
.kicker{color:var(--gold);font-weight:800;letter-spacing:.12em;font-size:14px;text-align:center}
.title{font-size:clamp(26px,3.2vw,40px);font-weight:800;text-align:center;margin:6px 0 4px}
.sub{color:var(--muted);text-align:center;font-size:clamp(16px,1.7vw,19px);margin:4px 0 14px}
.nav{display:flex;justify-content:center;gap:10px;margin:14px 0 24px}
.nav button{min-width:140px;padding:12px 18px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:17px}
.nav .next{background:var(--ink);color:#fff;border-color:var(--ink)}
.nav button:disabled{opacity:.35;cursor:default}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:800;font-size:16px}
.btn.main{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.soft{background:var(--lavbg);border-color:#d9d0ee}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;margin:10px 0}
.tip{background:var(--warn);border:1px solid #eedc9a;border-radius:14px;padding:10px 14px;font-size:16px;margin:12px auto;max-width:760px}
.note{color:var(--muted);font-size:14px;text-align:center}
/* vocab */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.vcard{border:2px solid var(--line);border-radius:16px;background:#fff;padding:10px 12px;text-align:left;display:grid;gap:2px}
.vcard:hover{border-color:var(--lav)}
.vcard .k{font-size:24px;font-weight:700}.vcard .r{color:var(--muted);font-size:15px}
.vcard .m{font-size:15px;color:var(--lav);font-weight:700;visibility:hidden}
.vcard.show .m{visibility:visible}
.vcard .g{font-size:12px;color:var(--gold);font-weight:800}
/* grammar table */
.gt{border-collapse:collapse;margin:10px auto;font-size:clamp(17px,1.9vw,22px)}
.gt td,.gt th{border:1px solid var(--line);padding:8px 14px;text-align:center}
.gt th{background:var(--lavbg);font-size:15px}
.gt .hl{color:var(--bad);font-weight:800}
.scenes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px}
.scene{border:2px solid var(--line);border-radius:18px;padding:14px;background:#fff;text-align:center}
.scene .em{font-size:44px}.scene .say{font-size:24px;font-weight:700;margin:6px 0}
.scene .m{color:var(--muted);font-size:14px}
/* quiz */
.q{max-width:720px;margin:0 auto;text-align:center}
.q .stem{font-size:clamp(24px,3vw,34px);font-weight:700;margin:10px 0}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:14px 0}
.opt{border:2px solid var(--line);border-radius:16px;background:#fff;padding:14px;font-size:22px;font-weight:700}
.opt.ok{background:var(--goodbg);border-color:var(--good)}.opt.ng{background:var(--badbg);border-color:var(--bad)}
.fb{min-height:1.6em;font-weight:800;font-size:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.chip{border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px;background:var(--lavbg)}
.chip.ok{background:var(--goodbg);color:var(--good)}.chip.ng{background:var(--badbg);color:var(--bad)}
/* signs */
.street{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;background:linear-gradient(#dfe8ef,#eef2f4);border-radius:18px;padding:16px}
.sign{border-radius:10px;padding:12px 6px;font-weight:800;font-size:clamp(20px,2.4vw,28px);text-align:center;border:3px solid currentColor;background:#fff;line-height:1.25}
.sign.red{color:#c0262d}.sign.green{color:#17804a}.sign.blue{color:#1e5aa8}.sign.black{color:#23263a}.sign.orange{color:#c56a00}
.sign.tri{clip-path:none}
.sign.pick{outline:4px solid var(--gold);outline-offset:3px}
.sign.done{opacity:.45}
.big-sign{font-size:clamp(44px,7vw,80px);padding:22px 10px;max-width:520px;margin:10px auto}
/* roles */
.roles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.roles button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;font-weight:800;font-size:16px}
.roles button.on{border-color:var(--lav);background:var(--lavbg)}
.card2{border:2px dashed #d9d0ee;border-radius:18px;padding:14px 16px;background:#fbf9ff;max-width:720px;margin:10px auto;text-align:left;font-size:20px;line-height:1.7}
.card2 b{color:var(--lav)}
.secret{background:#fff;border:2px solid var(--gold);border-radius:18px;padding:14px 16px;max-width:720px;margin:10px auto;font-size:20px;line-height:1.7}
.phone{max-width:520px;margin:10px auto;background:#23263a;color:#fff;border-radius:22px;padding:16px 18px;font-size:22px;line-height:1.6}
.phone .who{font-size:14px;color:#c9c3e6;font-weight:800}
.phrase{font-size:20px}
.hide{filter:blur(7px);user-select:none}
.book{max-width:720px;margin:10px auto;font-size:20px;line-height:1.9}
.book li{margin:6px 0}
@media (max-width:640px){.slide{padding:16px 12px}.gt{font-size:16px}.gt td,.gt th{padding:6px 8px}}
</style>
</head>

<div class="top">
  <h1 class="jp">第33課</h1>

</div>
<div class="bar"><i id="barFill"></i></div>

<script src="live.js"></script>
<script>
const $=id=>document.getElementById(id);
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
/* {漢字|かんじ} → ruby；画面用 */
const R=s=>String(s).replace(/\{([^{}|]+)\|([^{}]+)\}/g,"<ruby>$1<rt>$2</rt></ruby>");
/* 念出来用：去掉 ruby，换成读音 */
/* 只要汉字（看板：提问方不能看到读音）*/
const K=s=>String(s).replace(/\{([^{}|]+)\|[^{}]+\}/g,"$1");
const SPK=s=>String(s).replace(/\{([^{}|]+)\|([^{}]+)\}/g,"$2").replace(/<[^>]+>/g,"");
let jaVoice=null;
function pickVoice(){try{jaVoice=speechSynthesis.getVoices().find(x=>/^ja/i.test(x.lang))||null}catch(e){}}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t){try{if(Live.muted||!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(SPK(t));u.lang="ja-JP";if(jaVoice)u.voice=jaVoice;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
/* 两台装置一样的随机 */
let rnd=Math.random;
function setSeed(a){a>>>=0;rnd=function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* =====================================================================
   内容（全部自己写的）
   ===================================================================== */
/* 单词：课本第33课 单词表。[读音, 汉字, 中文, English, 组] */

 ["にげます","{逃|に}げます","逃跑","run away","动词 II"],["さわぎます","{騒|さわ}ぎます","吵闹","make a noise","动词 I"],
 ["あきらめます","あきらめます","放弃","give up","动词 II"],["なげます","{投|な}げます","丢、投","throw","动词 II"],
 ["まもります","{守|まも}ります","遵守","keep, obey","动词 I"],["はじまります","{始|はじ}まります","（仪式）开始","[a ceremony] begin","动词 I"],
 ["しゅっせきします","{出席|しゅっせき}します","出席（会议）","attend","动词 III"],["つたえます","{伝|つた}えます","转告","convey","动词 II"],
 ["ちゅういします","{注意|ちゅうい}します","小心（车）","be careful","动词 III"],["はずします","{外|はず}します","离开（座位）","be away [from one's desk]","动词 I"],
 ["もどります","{戻|もど}ります","回来","come back","动词 I"],["[でんわが]あります","[{電話|でんわ}が]あります","有（电话）","have [a phone call]","动词 I"],
 ["リサイクルします","リサイクルします","回收","recycle","动词 III"],
 ["だめ[な]","だめ[な]","不行","no good, not allowed","な形"],["おなじ","{同|おな}じ","一样","same","な形"],
 ["けいさつ","{警察|けいさつ}","警察","police","名词"],["せき","{席|せき}","座位","seat","名词"],["マーク","マーク","记号","mark, symbol","名词"],["ボール","ボール","球","ball","名词"],

 ["きけん","{危険|きけん}","危险","danger","看板"],["しようきんし","{使用禁止|しようきんし}","禁止使用","do not use","看板"],["たちいりきんし","{立入禁止|たちいりきんし}","禁止进入","keep out","看板"],
 ["じょこう","{徐行|じょこう}","慢行","go slow","看板"],["いりぐち","{入口|いりぐち}","入口","entrance","看板"],["でぐち","{出口|でぐち}","出口","exit","看板"],
 ["ひじょうぐち","{非常口|ひじょうぐち}","紧急出口","emergency exit","看板"],["むりょう","{無料|むりょう}","免费","free of charge","看板"],["わりびき","{割引|わりびき}","折扣","discount","看板"],
 ["のみほうだい","{飲|の}み{放題|ほうだい}","无限畅饮","all you can drink","看板"],["しようちゅう","{使用中|しようちゅう}","使用中","in use","看板"],["ぼしゅうちゅう","{募集中|ぼしゅうちゅう}","招募中","applications wanted","看板"],
 ["〜ちゅう","〜{中|ちゅう}","正在〜","-ing","其他"],["どういう〜","どういう〜","什么样的〜","what kind of","其他"],["いくら[〜ても]","いくら[〜ても]","不管多少〜都","however ~","其他"],
 ["もう[〜ない]","もう[〜ない]","已经不〜","(not) any longer","其他"],["あと〜","あと〜","还剩〜","~ left","其他"],["〜ほど","〜ほど","大约〜","about ~","其他"]
];

const VERBS=[
 ["{急|いそ}ぎます",1,"{急|いそ}げ","{急|いそ}ぐな"],["{走|はし}ります",1,"{走|はし}れ","{走|はし}るな"],["{頑張|がんば}ります",1,"{頑張|がんば}れ","{頑張|がんば}るな"],
 ["{止|と}まります",1,"{止|と}まれ","{止|と}まるな"],["{守|まも}ります",1,"{守|まも}れ","{守|まも}るな"],["{騒|さわ}ぎます",1,"{騒|さわ}げ","{騒|さわ}ぐな"],
 ["{待|ま}ちます",1,"{待|ま}て","{待|ま}つな"],["{遊|あそ}びます",1,"{遊|あそ}べ","{遊|あそ}ぶな"],["{飲|の}みます",1,"{飲|の}め","{飲|の}むな"],
 ["{触|さわ}ります",1,"{触|さわ}れ","{触|さわ}るな"],["{逃|に}げます",2,"{逃|に}げろ","{逃|に}げるな"],["{投|な}げます",2,"{投|な}げろ","{投|な}げるな"],
 ["{寝|ね}ます",2,"{寝|ね}ろ","{寝|ね}るな"],["{見|み}ます",2,"{見|み}ろ","{見|み}るな"],["あきらめます",2,"あきらめろ","あきらめるな"],
 ["{来|き}ます",3,"{来|こ}い","{来|く}るな"],["します",3,"しろ","するな"],["{注意|ちゅうい}します",3,"{注意|ちゅうい}しろ","{注意|ちゅうい}するな"]
];
/* 什么时候真的会听到／看到 */
const WHEN=[
 ["⚽","{頑張|がんば}れ！{走|はし}れ！","比赛加油（球场上的观众）","Cheering at a match"],
 ["🌋","{逃|に}げろ！","地震、火灾，紧急的时候","Emergencies"],
 ["🚦","{止|と}まれ","马路上的交通标识","Road signs"],
 ["🚧","{触|さわ}るな　{入|はい}るな","警告牌、告示","Warning signs"],
 ["👨‍👦","{早|はや}く{寝|ね}ろ！","爸爸对孩子（很凶）","A dad to his kid (strict)"],

];
/* 看板挑战（信息差）：[看板, 颜色, 读音, 意思（用这课的说法）, 中文, 在哪里看到] */
const SIGNS=[
 ["{土足禁止|どそくきんし}","red","どそくきんし","くつで{入|はい}るな","不能穿鞋进去","旅館、お寺"],
 ["{撮影禁止|さつえいきんし}","red","さつえいきんし","{写真|しゃしん}を{撮|と}ってはいけない","不能拍照","{美術館|びじゅつかん}、お寺"],
 ["{禁煙|きんえん}","red","きんえん","たばこを{吸|す}ってはいけない","禁止吸烟","レストラン、{駅|えき}"],

 ["{使用中|しようちゅう}","orange","しようちゅう","{今|いま}{使|つか}っている","使用中","トイレ"],

 ["{無料|むりょう}","blue","むりょう","お{金|かね}を{払|はら}わなくてもいい","免费","Wi-Fi、お{茶|ちゃ}"],
 ["{飲|の}み{放題|ほうだい}","blue","のみほうだい","いくら{飲|の}んでも、{値段|ねだん}は{同|おな}じ","无限畅饮","{居酒屋|いざかや}"],
 ["{予約席|よやくせき}","black","よやくせき","{予約|よやく}した{人|ひと}の{席|せき}","预约席","レストラン"],

/* 传话 A：〜と言っていました（普通形！）[谁, 留言（丁寧形）, 转告时（普通形）, 错的选项×2] */
const MSGS=[
 ["{旅館|りょかん}の{人|ひと}","{晩|ばん}ごはんは７{時|じ}からです。","{晩|ばん}ごはんは７{時|じ}からだ",["{晩|ばん}ごはんは６{時|じ}からだ","{朝|あさ}ごはんは７{時|じ}からだ"]],

 ["{店|みせ}の{人|ひと}","この{店|みせ}は{月曜日|げつようび}が{休|やす}みです。","この{店|みせ}は{月曜日|げつようび}が{休|やす}みだ",["この{店|みせ}は{日曜日|にちようび}が{休|やす}みだ","この{店|みせ}は{毎日|まいにち}{開|あ}いている"]],

/* 传话 B：〜と伝えていただけませんか [打电话找谁, 不在的理由, 要转告的话（中文提示）, 转告（普通形）] */
const ASKS=[

function rolePicker(sl,key,askLabel,ansLabel){

  sl.append(r,el("div","note","每台装置自己选。两人用同一台装置时：老师选一边，学生选另一边。 · Each device picks its own side."));

/* 小测验（两边都可以答，看到对方答对没有）*/
function quiz(sl,key,stem,right,wrongs,opt){
  const box=el("div","q");box.append(el("div","stem",R(stem)));
  const order=shuffle([right,...wrongs]);const os=el("div","opts"),fb=el("div","fb");
  const mine=answers[key]&&answers[key][myName||"me"];
  order.forEach(o=>{const b=el("button","opt",R(o));b.dataset.local="1";
    if(mine){if(o===right)b.classList.add("ok");else if(o===mine)b.classList.add("ng")}
    b.onclick=()=>{if(answers[key]&&answers[key][myName||"me"])return;const ok=o===right;(answers[key]=answers[key]||{})[myName||"me"]=o;
      Live.send({t:"ans",k:key,who:myName||"?",ok});if(ok)say(opt&&opt.speak?opt.speak:o);render()};os.append(b)});
  box.append(os);
  if(mine)fb.innerHTML=mine===right?"✓ 正解！":"✗ "+R(right);
  box.append(fb);
  const ch=el("div","chips");Object.entries(answers[key]||{}).forEach(([w,v])=>{if(w===(myName||"me"))return;ch.append(el("span","chip "+(v===true?"ok":v===false?"ng":""),`${w} ${v===true?"✓":v===false?"✗":"…"}`))});
  box.append(ch);sl.append(box);
}

  if(side)sl.append(el("div","secret",`<b>${R(side.name)}</b><br>`+side.lines.map(x=>"・"+R(x)).join("<br>")));else sl.append(el("div","tip","先选你演哪一边 ↑"));
  itemNav(sl,ROLEPLAY.length,"下一个情景 ▶")},
 eCheck(sl){head(sl,"まとめ","{今日|きょう}の チェック");const q=CHECK[S.item%CHECK.length];quiz(sl,"c"+S.item,q[0],q[1],[q[2],q[3]]);itemNav(sl,CHECK.length)},
 eBye(sl){head(sl,"おつかれさまでした","{今日|きょう}できるようになったこと");
  sl.append(el("div","card2",R(`✅ {看板|かんばん}を{読|よ}んで、{意味|いみ}を{聞|き}ける・{説明|せつめい}できる<br>✅ 「{頑張|がんば}れ！」「{入|はい}るな」が わかる<br>✅ {人|ひと}の{話|はなし}を{伝|つた}えられる（〜と{言|い}っていました）<br>✅ {電話|でんわ}で {伝言|でんごん}を {頼|たの}める（〜と{伝|つた}えていただけませんか）`)));
  sl.append(el("div","tip",R("回家作业：在 Google Maps 或照片里找一个日本的看板，下次用「これは〜と{読|よ}みます。〜という{意味|いみ}です。」介绍给大家。")))}
};
function vocabSlide(sl,zh,ja,f){head(sl,"単語 · "+zh,ja,"点卡片：听发音，看意思");const g=el("div","vgrid");
  VOCAB.filter(f).forEach((v,i)=>{const k="v"+v[0];const c=el("button","vcard"+(S.picked[k]?" show":""),`<span class="g">${v[4]}</span><span class="k jp">${R(v[1])}</span><span class="r">${v[0]}</span><span class="m">${v[2]} · ${v[3]}</span>`);
    c.onclick=()=>{say(v[0].replace(/[\[\]〜]/g,""));set({picked:{...S.picked,[k]:1}})};g.append(c)});sl.append(g);
  const r=el("div","row");const all=el("button","btn soft","👁️ 全部显示意思");all.onclick=()=>{const p={...S.picked};VOCAB.filter(f).forEach(v=>p["v"+v[0]]=1);set({picked:p})};
  const hide=el("button","btn","🙈 全部盖起来");hide.onclick=()=>set({picked:{}});r.append(all,hide);sl.append(r)}

function render(){
  try{speechSynthesis.cancel()}catch(e){}
  setSeed(S.seed+(S.b.charCodeAt(0)*31)+S.i*7);
  const list=slidesOf(S.b),st=$("stage");st.innerHTML="";
  const sl=el("section","slide");V[list[S.i]](sl);st.append(sl);nav(st);
  document.querySelectorAll("#blocks button").forEach(b=>b.classList.toggle("on",b.dataset.id===S.b));
  const k=BLOCKS.findIndex(x=>x.id===S.b),tot=BLOCKS.reduce((a,b)=>a+slidesOf(b.id).length,0),done=BLOCKS.slice(0,k).reduce((a,b)=>a+slidesOf(b.id).length,0)+S.i+1;
  $("count").textContent=`${BLOCKS[k].label} ${S.i+1}/${list.length} · ~${BLOCKS[k].min} 分`;$("barFill").style.width=(done/tot*100)+"%";
  const u=new URL(location.href);u.searchParams.set("b",S.b);u.searchParams.set("p",S.i+1);history.replaceState(null,"",u);
}
BLOCKS.forEach(b=>{const x=el("button","",b.label);x.dataset.id=b.id;x.onclick=()=>{answers={};set({b:b.id,i:0,item:0,reveal:false,picked:{}})};$("blocks").append(x)});
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();go(S.i+1)}else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();go(S.i-1)}});
Live.init({room:"m33",mount:$("liveMount"),
  onHello(){Live.send({t:"st",s:S})},
  onData(m){
    if(m.t==="st"){if(m.s.b!==S.b||m.s.i!==S.i)answers={};S=m.s;render()}
    else if(m.t==="ans"){(answers[m.k]=answers[m.k]||{})[m.who||("学生"+(m._from||""))]=m.ok;render()}
  }});
(function(){const q=new URLSearchParams(location.search);const b=BLOCKS.find(x=>x.id===q.get("b"));if(b)S.b=b.id;S.i=Math.max(0,Math.min(slidesOf(S.b).length-1,(+q.get("p")||1)-1));S.seed=Math.floor(Math.random()*1e9);render()})();
</script>
