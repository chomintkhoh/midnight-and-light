<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Picture Quiz</title>
<style>
  :root{
    --bg:#f5f3ee;
    --card:#ffffff;
    --text:#222;
    --muted:#6f6f6f;
    --line:#ddd8cf;
    --shadow:0 10px 30px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Noto Sans JP",sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  .wrap{
    width:min(980px,94vw);
    margin:28px auto 50px;
  }
  h1{
    margin:0 0 6px;
    font-size:clamp(26px,4vw,42px);
  }
  .sub{
    color:var(--muted);
    margin-bottom:18px;
  }
  .panel,.quiz{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:var(--shadow);
  }
  .panel{
    padding:18px;
    margin-bottom:18px;
  }
  .drop{
    border:2px dashed #aaa49a;
    border-radius:14px;
    padding:24px 16px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
    background:#faf9f6;
  }
  .drop.drag{
    border-color:#222;
    background:#f0eee8;
  }
  .drop strong{display:block;font-size:18px;margin-bottom:6px}
  input[type=file]{display:none}
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin-top:14px;
  }
  select,button{
    border:1px solid #cbc5ba;
    border-radius:12px;
    background:white;
    color:#222;
    font-size:15px;
    padding:10px 14px;
  }
  button{
    cursor:pointer;
    font-weight:650;
  }
  button:hover{filter:brightness(.97)}
  button.primary{
    background:#222;
    color:white;
    border-color:#222;
  }
  button.good{
    background:#e8f5ea;
    border-color:#b8d9be;
  }
  button.bad{
    background:#fdecec;
    border-color:#efbcbc;
  }
  .stats{
    margin-left:auto;
    color:var(--muted);
    font-size:14px;
  }
  .quiz{
    min-height:500px;
    padding:18px;
    display:flex;
    flex-direction:column;
  }
  .question{
    font-size:clamp(20px,3vw,30px);
    font-weight:750;
    text-align:center;
    margin:8px 0 12px;
  }
  .stage{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:330px;
    background:#faf9f6;
    border-radius:14px;
    overflow:hidden;
    position:relative;
  }
  .stage img{
    max-width:92%;
    max-height:390px;
    object-fit:contain;
    display:none;
  }
  .placeholder{
    color:#999;
    text-align:center;
    padding:30px;
    line-height:1.7;
  }
  .file-name{
    text-align:center;
    color:#888;
    font-size:13px;
    margin-top:8px;
    min-height:18px;
  }
  .controls{
    margin-top:14px;
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .controls button{
    min-width:130px;
  }
  .thumbs{
    margin-top:18px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(86px,1fr));
    gap:8px;
  }
  .thumb{
    border:1px solid var(--line);
    background:white;
    border-radius:10px;
    padding:5px;
    position:relative;
    aspect-ratio:1/1;
  }
  .thumb img{
    width:100%;
    height:100%;
    object-fit:contain;
    border-radius:7px;
  }
  .thumb.used{
    opacity:.28;
    filter:grayscale(1);
  }
  .badge{
    position:absolute;
    right:4px;
    top:4px;
    background:#222;
    color:white;
    border-radius:999px;
    font-size:10px;
    padding:2px 5px;
  }
  .smallnote{
    margin-top:10px;
    color:#777;
    font-size:13px;
  }
  @media(max-width:600px){
    .stats{width:100%;margin-left:0}
    .quiz{min-height:440px}
    .stage{min-height:280px}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Random Picture Quiz</h1>
  <div class="sub">临时抽考 / 日本語クイズ</div>

  <div class="panel">
    <label class="drop" id="dropZone" for="fileInput">
      <strong>把图片拖进这里</strong>
      或点击选择图片（可一次选很多张）
    </label>
    <input id="fileInput" type="file" accept="image/*" multiple>

    <div class="toolbar">
      <label>
        抽题模式：
        <select id="mode">
          <option value="random">完全随机（图片一直保留）</option>
          <option value="remove">答对后移除（题池越来越少）</option>
        </select>
      </label>

      <button id="resetBtn">全部恢复</button>
      <button id="clearBtn">清空图片</button>

      <div class="stats">
        图片：<span id="totalCount">0</span>　
        剩余：<span id="remainingCount">0</span>
      </div>
    </div>

    <div class="smallnote">
      建议：你可以直接用文件名当自己的答案提示，例如「りんご.png」「でんしゃ.jpg」。学生画面不会主动显示答案。
    </div>

    <div class="thumbs" id="thumbs"></div>
  </div>

  <div class="quiz">
    <div class="question">この絵は日本語で何ですか？</div>

    <div class="stage" id="stage">
      <div class="placeholder" id="placeholder">
        先加入图片，然后按「随机抽题」<br>
        Add pictures, then press Random Question.
      </div>
      <img id="quizImage" alt="quiz image">
    </div>

    <div class="file-name" id="fileName"></div>

    <div class="controls">
      <button class="primary" id="drawBtn">🎲 随机抽题</button>
      <button class="good" id="correctBtn">✓ 答对</button>
      <button class="bad" id="wrongBtn">✕ 答错</button>
    </div>
  </div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const dropZone = document.getElementById('dropZone');
const thumbs = document.getElementById('thumbs');
const quizImage = document.getElementById('quizImage');
const placeholder = document.getElementById('placeholder');
const fileName = document.getElementById('fileName');
const mode = document.getElementById('mode');
const totalCount = document.getElementById('totalCount');
const remainingCount = document.getElementById('remainingCount');

let items = [];
let currentId = null;
let lastDrawnId = null;

function addFiles(files){
  [...files].filter(f => f.type.startsWith('image/')).forEach(file => {
    const url = URL.createObjectURL(file);
    items.push({
      id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random()),
      name:file.name,
      url,
      active:true
    });
  });
  render();
}

function render(){
  thumbs.innerHTML = '';
  items.forEach(item => {
    const d = document.createElement('div');
    d.className = 'thumb' + (item.active ? '' : ' used');
    d.title = item.name;

    const img = document.createElement('img');
    img.src = item.url;

    d.appendChild(img);

    if(!item.active){
      const b = document.createElement('span');
      b.className='badge';
      b.textContent='完成';
      d.appendChild(b);
    }
    thumbs.appendChild(d);
  });

  totalCount.textContent = items.length;
  remainingCount.textContent = items.filter(x=>x.active).length;
}

function eligibleItems(){
  if(mode.value === 'remove'){
    return items.filter(x=>x.active);
  }
  return items;
}

function drawRandom(){
  const pool = eligibleItems();

  if(pool.length === 0){
    quizImage.style.display='none';
    placeholder.style.display='block';
    placeholder.innerHTML='🎉 全部答完了！<br>可以按「全部恢复」再来一轮。';
    fileName.textContent='';
    currentId=null;
    return;
  }

  let choices = pool;
  if(pool.length > 1 && lastDrawnId){
    const filtered = pool.filter(x=>x.id !== lastDrawnId);
    if(filtered.length) choices = filtered;
  }

  const item = choices[Math.floor(Math.random()*choices.length)];
  currentId = item.id;
  lastDrawnId = item.id;

  quizImage.src = item.url;
  quizImage.style.display='block';
  placeholder.style.display='none';

  // 仅给老师一个很淡的文件名提示。想完全隐藏可删掉下一行。
  fileName.textContent = 'Teacher hint: ' + item.name;
}

function markCorrect(){
  if(!currentId) return;

  if(mode.value === 'remove'){
    const item = items.find(x=>x.id===currentId);
    if(item) item.active=false;
    render();
  }
  drawRandom();
}

function markWrong(){
  if(!currentId) return;
  // 答错时保留在题池，直接抽下一题。
  drawRandom();
}

function resetAll(){
  items.forEach(x=>x.active=true);
  currentId=null;
  lastDrawnId=null;
  quizImage.style.display='none';
  placeholder.style.display='block';
  placeholder.innerHTML='题池已恢复。<br>Press Random Question.';
  fileName.textContent='';
  render();
}

function clearAll(){
  items.forEach(x=>URL.revokeObjectURL(x.url));
  items=[];
  currentId=null;
  lastDrawnId=null;
  quizImage.removeAttribute('src');
  quizImage.style.display='none';
  placeholder.style.display='block';
  placeholder.innerHTML='先加入图片，然后按「随机抽题」<br>Add pictures, then press Random Question.';
  fileName.textContent='';
  render();
}

fileInput.addEventListener('change', e => addFiles(e.target.files));

['dragenter','dragover'].forEach(evt=>{
  dropZone.addEventListener(evt,e=>{
    e.preventDefault();
    dropZone.classList.add('drag');
  });
});
['dragleave','drop'].forEach(evt=>{
  dropZone.addEventListener(evt,e=>{
    e.preventDefault();
    dropZone.classList.remove('drag');
  });
});
dropZone.addEventListener('drop', e => addFiles(e.dataTransfer.files));

document.getElementById('drawBtn').addEventListener('click',drawRandom);
document.getElementById('correctBtn').addEventListener('click',markCorrect);
document.getElementById('wrongBtn').addEventListener('click',markWrong);
document.getElementById('resetBtn').addEventListener('click',resetAll);
document.getElementById('clearBtn').addEventListener('click',clearAll);

mode.addEventListener('change',()=>{
  currentId=null;
  lastDrawnId=null;
  resetAll();
});

render();
</script>
</body>
</html>
