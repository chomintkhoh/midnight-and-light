<style>

.shell{width:min(980px,calc(100% - 24px));margin:auto;padding:24px 0 100px}
.hero{text-align:center;margin-bottom:16px}.hero h1{margin:0;font-size:clamp(28px,4vw,42px)}.hero p{color:var(--muted);margin:.4rem 0 0}

<body>
<main class="shell">
<header class="hero">
<h1>Japanese Question Words</h1>
<p>だれ・どこ・なに・なん・どれ・なんで</p>
</header>
<section id="app" aria-live="polite"></section>
</main>
<script src="./data/questions-kids.js"></script>
<script>
const STAMP_SRC="./assets/images/great-stamp.png";
const app=document.getElementById("app");
function el(t,c,txt){const x=document.createElement(t);if(c)x.className=c;if(txt!==undefined)x.textContent=txt;return x}
function setHTML(node,html){node.innerHTML=html;return node}
/* ===== Stamp sound: same volume every time =====
   The file is decoded once and played through Web Audio at a fixed volume,
   starting after the file's silent beginning. Repeats within 0.3 s are ignored. */
const SFX=(()=>{
 const SRC="./assets/audio/ui/success-stamp.mp3",OFFSET=0.25,VOLUME=0.9;
 let ctx=null,buf=null,last=0;const fb=new Audio(SRC);fb.preload="auto";fb.volume=VOLUME;
 function init(){
   if(ctx)return;
   try{ctx=new (window.AudioContext||window.webkitAudioContext)();
     fetch(SRC).then(r=>r.arrayBuffer()).then(a=>new Promise((res,rej)=>ctx.decodeAudioData(a,res,rej))).then(b=>{buf=b}).catch(()=>{})}catch(e){ctx=null}
 }
 ["pointerdown","touchstart","keydown"].forEach(ev=>window.addEventListener(ev,init,{once:true,passive:true}));
 function play(){
   const now=Date.now();if(now-last<300)return;last=now;init();
   if(ctx&&buf){try{if(ctx.state==="suspended")ctx.resume();const s=ctx.createBufferSource(),g=ctx.createGain();g.gain.value=VOLUME;s.buffer=buf;s.connect(g);g.connect(ctx.destination);s.start(0,OFFSET);return}catch(e){}}
   try{fb.pause();fb.currentTime=OFFSET;fb.play().catch(()=>{})}catch(e){}
 }
 return {play}
})();
function playSuccess(){SFX.play()}

function stamp(host){host.querySelectorAll(".stamp,.fallback").forEach(x=>x.remove());const im=new Image();im.className="stamp";im.src=STAMP_SRC;im.alt="Great!";im.onerror=()=>{im.remove();host.appendChild(el("div","fallback","GREAT!"))};host.appendChild(im)}
/* ===== Homework report: sends results to the teacher's Google Sheet ===== */
/* Paste the Apps Script web-app URL between the quotes: */
const REPORT_URL="https://script.google.com/macros/s/AKfycbyudegTYiMN3lR_DccPITENYKQfAEimsJqsigTqj3ea8slXMCGN1Q0OrSu8UTv_kYs/exec";
/* The code from ?s= is remembered on this device, so every practice page knows who is working. */
const CODE_KEY="mlStudentCode";
const STUDENT_CODE=(function(){
 const clean=v=>(v||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,20);
 const fromUrl=clean(new URLSearchParams(location.search).get("s"));
 if(fromUrl){try{localStorage.setItem(CODE_KEY,fromUrl)}catch(e){}return fromUrl}
 try{return clean(localStorage.getItem(CODE_KEY))}catch(e){return ""}
})();
const SESSION_KEY="questionSessionV1";
const ACT_EN={"q-word":"Question Word","q-end":"Question Ending"};
const ACT_ZH={"q-word":"疑問詞 選字","q-end":"疑問詞 選句尾"};
function newSession(){return {code:STUDENT_CODE,start:Date.now(),items:{}}}
function loadSession(){
 try{const x=JSON.parse(localStorage.getItem(SESSION_KEY)||"null");
   if(x&&x.code===STUDENT_CODE&&Date.now()-x.start<6*3600*1000&&x.items)return x}catch(e){}
 return newSession()
}
let session=loadSession();
function saveSession(){try{localStorage.setItem(SESSION_KEY,JSON.stringify(session))}catch(e){}}
/* stamp card: one stamp for every question answered correctly; 20 stamps = 1 full card */
const STAMP_CARD=20;
function stampKey(){return "timePracticeStamps_"+(STUDENT_CODE||"guest")}
function loadStamps(){try{const x=JSON.parse(localStorage.getItem(stampKey())||"null");if(x&&typeof x.count==="number")return x}catch(e){}return {count:0,cards:0}}
function addStamp(){
 const st=loadStamps();st.count++;
 if(st.count>=STAMP_CARD){st.count=0;st.cards++;setTimeout(()=>celebrateCard(st.cards),300)}
 try{localStorage.setItem(stampKey(),JSON.stringify(st))}catch(e){}
}
function celebrateCard(n){
 const t=el("div","card-toast",`🎉 Stamp card full! A new card starts now.`);document.body.append(t);playSuccess();setTimeout(()=>t.remove(),3200)
}
function stampCardEl(){
 const st=loadStamps(),box=el("div","stamp-card");
 box.append(el("div","report-sub",`⭐ Stamp Card ${st.cards?`(${st.cards} full card${st.cards>1?"s":""} done!)`:""}`));
 const g=el("div","stamp-grid");
 for(let i=0;i<STAMP_CARD;i++){const c=el("div","stamp-cell"+(i<st.count?" on":""));if(i<st.count){const im=new Image();im.src=STAMP_SRC;im.onerror=()=>{im.remove();c.textContent="⭐"};c.append(im)}g.append(c)}
 box.append(g);return box
}
function tLabel(t){return `${t.h}:${String(t.m).padStart(2,"0")} ${t.reading}`}
/* returns ok so it can be used inside if(...) */
function logResult(activity,item,ok){
 const k=activity+"||"+item,it=session.items[k]||{activity,item,tries:0,wrong:0,solved:false};
 it.tries++;if(ok){if(!it.solved)addStamp();it.solved=true}else it.wrong++;
 session.items[k]=it;saveSession();updateDoneBtn();return ok
}
function summarize(){
 const acts={};
 Object.values(session.items).forEach(it=>{
   const a=acts[it.activity]||(acts[it.activity]={n:0,first:0,later:0,notyet:0,mistakes:[]});
   a.n++;
   if(it.solved&&it.wrong===0)a.first++;else if(it.solved)a.later++;else a.notyet++;
   if(it.wrong>0)a.mistakes.push(it);
 });
 return acts
}
function minutesSpent(){return Math.max(1,Math.round((Date.now()-session.start)/60000))}
function updateDoneBtn(){
 const b=document.getElementById("doneBtn");if(!b)return;
 const n=Object.keys(session.items).length;
 const st=loadStamps();b.querySelector(".done-count").textContent=`⭐ ${st.count}/${STAMP_CARD}`;
}
function reportPayload(acts){
 const st=loadStamps();
 const summary=Object.entries(acts).map(([k,a])=>`${ACT_ZH[k]||k}：${a.first}/${a.n} 一次答對`+(a.later?`，${a.later} 題改對`:"")+(a.notyet?`，${a.notyet} 題沒答對`:"")).join("；")+(session.rushBest?`；限時搶答最高 ${session.rushBest} 題`:"")+`；印章卡：已集滿 ${st.cards} 張，目前 ${st.count}/${STAMP_CARD}`;
 const mistakes=Object.entries(acts).flatMap(([k,a])=>a.mistakes.map(m=>`${ACT_ZH[k]||k}：${m.item}（錯${m.wrong}次${m.solved?"，後來改對":"，沒答對"}）`)).join("\n");
 const detail=JSON.stringify(Object.fromEntries(Object.entries(acts).map(([k,a])=>[k,{questions:a.n,firstTry:a.first,fixedLater:a.later,notSolved:a.notyet}])));
 return {code:STUDENT_CODE,page:"questions.html",minutes:minutesSpent(),summary:summary||"（沒有做任何題目）",mistakes,detail}
}
function openReport(){
 const acts=summarize(),total=Object.values(acts).reduce((s,a)=>s+a.n,0);
 const ov=el("div","report-overlay"),box=el("div","report-box");
 const now=new Date();
 box.append(el("h2","","📋 Homework Report"));
 const meta=el("div","report-meta");
 meta.innerHTML=`<div><b>Student code:</b> ${STUDENT_CODE||"—"}</div><div><b>Date:</b> ${now.toLocaleDateString()} ${now.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}</div><div><b>Time spent:</b> ${minutesSpent()} min</div>`;
 box.append(meta);
 if(!total){box.append(el("p","report-empty","You haven't answered any questions yet. Do some practice first!"))}
 else{
   const tbl=el("div","report-table");
   Object.entries(acts).forEach(([k,a])=>{
     const row=el("div","report-row");
     const stars=a.first===a.n?"⭐⭐⭐":a.first>=a.n/2?"⭐⭐":"⭐";
     row.innerHTML=`<span>${ACT_EN[k]||k}</span><span><b>${a.first}/${a.n}</b> first try ${stars}</span>`;
     tbl.append(row)
   });
   box.append(tbl);
   if(session.rushBest)box.append(el("div","report-row",`⏱ Clock Rush best today: ${session.rushBest}`));
   const ms=Object.entries(acts).flatMap(([k,a])=>a.mistakes.map(m=>({k,m})));
   if(ms.length){
     box.append(el("div","report-sub","Practice these again:"));
     const ul=el("ul","report-mistakes");
     ms.slice(0,12).forEach(({k,m})=>{const li=el("li","",`${m.item}`);ul.append(li)});
     box.append(ul)
   }else box.append(el("div","report-sub","No mistakes — amazing! 🎉"));
 }
 box.append(stampCardEl());
 const status=el("div","report-status");
 const act=el("div","actions"),send=el("button","active","📨 Send to Teacher"),close=el("button","","Keep Practicing");
 close.onclick=()=>ov.remove();
 const canSend=!!(REPORT_URL&&STUDENT_CODE&&total);
 if(!STUDENT_CODE)status.textContent="Your code is missing, so this can't be sent. Take a screenshot and send it to your teacher.";
 else if(!REPORT_URL)status.textContent="Take a screenshot of this report and send it to your teacher.";
 send.disabled=!canSend;
 send.onclick=async()=>{
   send.disabled=true;status.textContent="Sending…";
   try{
     await fetch(REPORT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(reportPayload(acts))});
     status.innerHTML="<b>✓ Sent to your teacher!</b> You can also take a screenshot.";
     session=newSession();saveSession();updateDoneBtn();
     send.textContent="✓ Sent";close.textContent="Close";
   }catch(e){
     status.textContent="Could not send (check the internet). Take a screenshot and send it to your teacher.";
     send.disabled=false
   }
 };
 act.append(send,close);box.append(act,status);ov.append(box);document.body.append(ov);
 ov.onclick=e=>{if(e.target===ov)ov.remove()}
}
function initReport(){
 const b=el("button","done-btn");b.id="doneBtn";b.type="button";
 b.innerHTML=`✅ Finish &amp; Send <span class="done-count"></span>`;
 b.onclick=openReport;document.body.append(b);updateDoneBtn();
 /* who is practising + way back to the practice list */
 const who=el("div","who-bar");
 if(STUDENT_CODE)who.innerHTML=`<a class="who-back" href="practice.html">← All practice</a><span class="who-code">Student <b>${STUDENT_CODE}</b></span><a class="who-switch" href="practice.html?switch=1">Not you?</a>`;
 else{who.classList.add("no-code");who.innerHTML=`⚠ I don't know who you are yet. <a href="practice.html">Enter your code</a>`}
 document.querySelector(".hero").append(who)
}

/* ===== Question-word practice (reads Q_SENTENCES / QW_INFO / ENDING_INFO) ===== */
const ALL_QW=["だれ","どこ","なに","なん","どれ","なんで"];
const Q_MODES=[["word","❓","Question Word"],["end","🔚","Question Ending"]];
const MODE_ZH={word:"选疑问词",end:"选句尾"};
const PR={level:"easy",focus:new Set(ALL_QW),mode:"word",screen:"menu",lang:"en"};
try{const s=JSON.parse(localStorage.getItem("questionPrefsV1")||"null");if(s){PR.level=s.level||PR.level;if(Array.isArray(s.focus)&&s.focus.length)PR.focus=new Set(s.focus.filter(x=>ALL_QW.includes(x)));if(!PR.focus.size)PR.focus=new Set(ALL_QW);PR.mode=s.mode||PR.mode;PR.lang=s.lang||PR.lang}}catch(e){}
function saveQPrefs(){try{localStorage.setItem("questionPrefsV1",JSON.stringify({level:PR.level,focus:[...PR.focus],mode:PR.mode,lang:PR.lang}))}catch(e){}}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function kataToHira(s){return (s||"").replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60))}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function jpHTML(s){if(PR.level!=="easy"||!/[ァ-ヶ]/.test(s))return esc(s);return esc(s).replace(/[ァ-ヶー]+/g,m=>m==="ー"?m:`<ruby>${m}<rt>${kataToHira(m)}</rt></ruby>`)}
const T={
 en:{said:"You just asked:",funny:"😹 That would mean…",real:"🤔 That IS real Japanese — but it asks something else:",none:"🤔 Japanese doesn't say it this way.",hintW:"Hint — we need the question word that means:",hintE:"Hint — we need the ending that means:",right:"✓ Correct!",answer:"💬 The answer is:",question:"❓ So the question is:",next:"Next →",level:"1. Level",which:"2. Which question words?",game:"3. Choose a game",easy:"Easy · ですか・ますか",normal:"Normal · + ました・ません",all:"Select all",clear:"Clear",start:"▶ Start",pickOne:"Choose at least one question word.",noSent:"No questions for these words yet.",menu:"← Menu",firstTry:"correct on the first try",again:"Practice these again:",playAgain:"↻ Play Again",back:"Menu",means:"It means:"},
 zh:{said:"你刚刚问的是：",funny:"😹 意思会变成……",real:"🤔 这是真的日文——但是问的是别的东西：",none:"🤔 日文不这样说。",hintW:"提示——这里要用的疑问词意思是：",hintE:"提示——这里要用的句尾意思是：",right:"✓ 答对了！",answer:"💬 回答是：",question:"❓ 所以问题是：",next:"下一题 →",level:"1. 程度",which:"2. 练习哪些疑问词？",game:"3. 选游戏",easy:"简单 · ですか・ますか",normal:"普通 · 加上 ました・ません",all:"全选",clear:"清除",start:"▶ 开始",pickOne:"请至少选一个疑问词。",noSent:"这些疑问词还没有题目。",menu:"← 菜单",firstTry:"一次就答对",again:"再练习这些：",playAgain:"↻ 再玩一次",back:"菜单",means:"意思是："}
};
function t(k){return T[PR.lang][k]}
function L(en,zh){return PR.lang==="zh"?zh:en}
function slotIdx(s,kind){return s.parts.findIndex(p=>typeof p==="object"&&p.k===kind)}
function qwOf(s){return s.parts[slotIdx(s,"qw")].ok[0]}
function endOf(s){return s.parts[slotIdx(s,"end")].ok[0]}
function levelOK(s){return PR.level!=="easy"||EASY_ENDINGS.includes(endOf(s))}
function sentenceText(s,fillIdx,fill){return s.parts.map((p,i)=>typeof p==="object"?(i===fillIdx&&fill!==undefined?fill:p.ok[0]):p).join("")}
function logKey(s,i){return `${sentenceText(s)}（${s.parts[i].ok.join("／")}）`}
/* choices and wrong-cards for one slot */
function slotOpts(s,i){const p=s.parts[i];if(p.k==="qw")return p.opts;return PR.level==="easy"?EASY_ENDINGS:ALL_ENDINGS}
function wrongCard(s,i,pick){
 const p=s.parts[i];
 if(p.wrong&&p.wrong[pick])return p.wrong[pick];
 if(p.k==="end"){const okIsVerb=p.ok[0]!=="ですか",pickIsVerb=pick!=="ですか";if(okIsVerb&&pickIsVerb)return ENDING_CARDS[pick]||null}
 return null
}
function infoOf(s,i){const p=s.parts[i];return p.k==="qw"?QW_INFO[p.ok[0]]:ENDING_INFO[p.ok[0]]}
function langToggle(){
 const box=el("div","lang-toggle");
 [["en","English"],["zh","中文"]].forEach(([id,label])=>{const b=el("button",PR.lang===id?"active":"",label);b.onclick=()=>{PR.lang=id;saveQPrefs();rerender()};box.append(b)});
 return box
}
let rerender=()=>render();
function qPool(){
 const kind=PR.mode==="word"?"qw":"end",out=[];
 Q_SENTENCES.forEach((s,si)=>{if(levelOK(s)&&PR.focus.has(qwOf(s)))out.push({s,si,i:slotIdx(s,kind)})});
 return out
}
function renderQMenu(){
 const p=el("div","panel");
 p.append(langToggle());
 const lv=el("div","modes");
 [["easy",t("easy")],["normal",t("normal")]].forEach(([id,label])=>{const b=el("button",PR.level===id?"active":"",label);b.onclick=()=>{PR.level=id;saveQPrefs();render()};lv.append(b)});
 p.append(el("div","step-title",t("level")),lv,el("div","step-title",t("which")));
 const g=el("div","p-grid");
 ALL_QW.forEach(k=>{const b=el("button","p-chip"+(PR.focus.has(k)?" on":""),"");b.innerHTML=`<span class="p-big">${k}</span><span class="p-mean">${esc(L(...QW_INFO[k]))}</span>`;
   b.onclick=()=>{PR.focus.has(k)?PR.focus.delete(k):PR.focus.add(k);saveQPrefs();render()};g.append(b)});
 p.append(g);
 const q=el("div","modes small"),all=el("button","",t("all")),none=el("button","",t("clear"));
 all.onclick=()=>{PR.focus=new Set(ALL_QW);saveQPrefs();render()};none.onclick=()=>{PR.focus.clear();saveQPrefs();render()};
 q.append(all,none);p.append(q,el("div","step-title",t("game")));
 const md=el("div","mode-grid");
 Q_MODES.forEach(([id,ic,label])=>{const b=el("button","mode-card"+(PR.mode===id?" on":""),"");b.innerHTML=`<span class="mode-ic">${ic}</span><span>${L(label,MODE_ZH[id])}</span>`;b.onclick=()=>{PR.mode=id;saveQPrefs();render()};md.append(b)});
 p.append(md);
 const start=el("button","active start-btn",t("start")),n=qPool().length;
 if(!PR.focus.size){start.disabled=true;p.append(el("p","hint-line",t("pickOne")))}
 else if(n<1){start.disabled=true;p.append(el("p","hint-line",t("noSent")))}
 else p.append(el("p","count-line",L(`${n} questions${n<10?" — choose more question words for a longer round":""}`,`共有 ${n} 题${n<10?"——多选几个疑问词，题目会更多":""}`)));
 start.onclick=startQRound;p.append(start);app.append(p)
}
/* rounds never repeat a sentence, and prefer ones not seen recently */
const SEEN_KEY="questionSeenV1";
function loadSeen(){try{const x=JSON.parse(localStorage.getItem(SEEN_KEY)||"[]");return Array.isArray(x)?x:[]}catch(e){return []}}
function saveSeen(list){try{localStorage.setItem(SEEN_KEY,JSON.stringify(list.slice(0,120)))}catch(e){}}
function qKey(it){return it.si+":"+it.i}
function startQRound(){
 const seen=loadSeen(),rank=k=>seen.indexOf(k);
 const pool=shuffle(qPool()).sort((a,b)=>{const ra=rank(qKey(a)),rb=rank(qKey(b));if(ra<0&&rb<0)return 0;if(ra<0)return -1;if(rb<0)return 1;return rb-ra});
 const q=pool.slice(0,10);
 PR.queue=shuffle(q);PR.idx=0;PR.score=0;PR.missed=[];PR.screen="play";
 saveSeen([...q.map(qKey),...seen.filter(k=>!q.some(x=>qKey(x)===k))]);
 render()
}
function qProgress(){const n=PR.queue.length,d=Math.min(PR.idx,n);const b=el("div","progress");b.innerHTML=`<div class="progress-fill" style="width:${n?d/n*100:0}%"></div><span>${d} / ${n}</span>`;return b}
function emojiSize(str,maxRem,base){
 let n=0;try{n=[...new Intl.Segmenter(undefined,{granularity:"grapheme"}).segment(str)].filter(g=>g.segment.trim()).length}catch(e){n=[...str].filter(c=>c.trim()).length}
 n=Math.max(n,1);return `font-size:min(${Math.min(maxRem,base/n).toFixed(2)}rem,${(56/n).toFixed(1)}vw)`
}
/* the answer: picture + Japanese + meaning */
function answerBox(s){
 const c=el("div","big-scene");
 c.innerHTML=`<div class="qa-label">${esc(t("answer"))}</div><div class="big-scene-emoji" style="${emojiSize(s.scene,5.2,30)}">${s.scene}</div><div class="qa-jp">${jpHTML(s.ans)}</div><div class="qa-mean">${esc(L(s.aEn,s.aZh))}</div>`;return c
}
function saidLine(s,i,pick){
 const line=el("div","said-line");
 s.parts.forEach((p,k)=>{
   if(k===i)line.append(el("span","said-bad",pick));
   else{const sp=el("span","");sp.innerHTML=jpHTML(typeof p==="string"?p:p.ok[0]);line.append(sp)}
 });return line
}
function consequenceCard(s,i,pick){
 const w=wrongCard(s,i,pick),card=el("div","conseq");
 card.append(el("div","conseq-said-title",t("said")),saidLine(s,i,pick));
 if(w){
   card.append(el("div","conseq-kind "+(w[3]==="real"?"real":"funny"),w[3]==="real"?t("real"):t("funny")));
   const em=el("div","conseq-emoji",w[0]);em.setAttribute("style",emojiSize(w[0],5.6,30));card.append(em,el("div","conseq-text",L(w[1],w[2])));
 }else card.append(el("div","conseq-kind funny",t("none")),el("div","conseq-emoji","🤔❓"));
 return card
}
function hintLine(s,i){return el("div","need-line",`${s.parts[i].k==="qw"?t("hintW"):t("hintE")} ${L(...infoOf(s,i))}`)}
function sentenceLine(s,blankIdx){
 /* text around the blank is joined, so "いき"+"ますか" reads as one word */
 const line=el("div","p-sentence");let run="";
 const flush=()=>{if(run){const sp=el("span","p-text");sp.innerHTML=jpHTML(run.trim());line.append(sp);run=""}};
 s.parts.forEach((p,i)=>{
   if(i===blankIdx){flush();line.append(el("span","p-blank","？"))}
   else run+=typeof p==="string"?p:p.ok[0]
 });
 flush();return line
}
function renderQPlay(){
 const p=el("div","panel play");
 const top=el("div","play-top"),back=el("button","small-btn",t("menu"));back.onclick=()=>{PR.screen="menu";render()};
 top.append(back,langToggle(),el("div","play-mode",L(Q_MODES.find(m=>m[0]===PR.mode)[2],MODE_ZH[PR.mode])));p.append(top,qProgress());
 if(PR.idx>=PR.queue.length){renderQEnd(p);return}
 const {s,i}=PR.queue[PR.idx],slot=s.parts[i],stage=el("div","q-stage");p.append(stage);app.append(p);
 let tries=0;
 const feedback=el("div","p-feedback"),act="q-"+PR.mode;
 const missed=()=>{if(!PR.missed.includes(PR.idx))PR.missed.push(PR.idx)};
 stage.append(answerBox(s),el("div","qa-label",t("question")),sentenceLine(s,i));
 let opts=slotOpts(s,i);
 if(slot.k==="qw"&&PR.level==="easy"){const wrongs=shuffle(opts.filter(o=>!slot.ok.includes(o)));const withCards=wrongs.filter(o=>wrongCard(s,i,o));opts=[slot.ok[0],...[...withCards,...wrongs.filter(o=>!wrongCard(s,i,o))].slice(0,2)]}
 const box=el("div","opt-grid kana p-opts"+(slot.k==="end"?" end-opts":""));
 shuffle(opts).forEach(o=>{const b=el("button","opt kana-opt",o);b.onclick=()=>{
   if(b.disabled)return;
   if(slot.ok.includes(o)){
     box.querySelectorAll("button").forEach(z=>z.disabled=true);b.classList.add("right");
     logResult(act,logKey(s,i),true);if(tries===0)PR.score++;
     const bl=stage.querySelector(".p-blank");bl.textContent=o;bl.classList.add("filled");
     feedback.innerHTML="";feedback.append(el("div","right-title",t("right")),el("div","q-mean",`${t("means")} ${L(s.qEn,s.qZh)}`));playSuccess();
     const nb=el("button","active next-btn",t("next"));nb.onclick=()=>{PR.idx++;render()};feedback.append(nb);if(tries===0)stamp(stage)
   }else{
     tries++;logResult(act,logKey(s,i),false);missed();
     b.disabled=true;b.classList.add("wrong");
     feedback.innerHTML="";feedback.append(consequenceCard(s,i,o));
     if(tries>=2)feedback.append(hintLine(s,i))
   }
 };box.append(b)});
 stage.append(box,feedback);
 rerender=()=>{app.innerHTML="";renderQPlay()}
}
function renderQEnd(p){
 const n=PR.queue.length,box=el("div","end-box"),pct=n?PR.score/n:0;
 box.append(el("div","end-stars",pct===1?"⭐⭐⭐":pct>=.6?"⭐⭐":"⭐"),el("div","end-score",`${PR.score} / ${n}`),el("div","end-sub",t("firstTry")));
 if(PR.missed.length){box.append(el("div","end-sub strong",t("again")));const ul=el("div","missed-list");
   PR.missed.forEach(k=>{const {s}=PR.queue[k];const d=el("div","missed-item","");d.innerHTML=`<span class="missed-scene">${s.scene}</span><span>${jpHTML(sentenceText(s))}</span>`;ul.append(d)});box.append(ul)}
 const act=el("div","actions"),again=el("button","active",t("playAgain")),menu=el("button","",t("back"));again.onclick=startQRound;menu.onclick=()=>{PR.screen="menu";render()};act.append(again,menu);box.append(act);
 p.append(box);app.append(p);if(pct===1)stamp(box)
}
function render(){rerender=()=>render();app.innerHTML="";if(PR.screen==="menu")renderQMenu();else renderQPlay()}

initReport();
render();
</script>
</body></html>
