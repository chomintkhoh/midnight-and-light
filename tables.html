<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Japanese Reference Tables | ミッドナイトとライト</title>
<meta name="description" content="Japanese reference tables with audio: numbers, ages, countries and counting things (ひとつ〜とお)." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Serif+TC:wght@400;500&family=Noto+Sans+JP:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="cosmic.css" />
<style>
  /* ── Extra · 参考表：单元里只用一部分，这里看完整的、复习 ── */
  :root{ --card:#E7E3DA; --ink:#252A45; --ink-soft:#4A4F6E; --line:rgba(37,42,69,.14); --plum:#3E3560; --good:#2F7D5B; --bad:#B4485E; }
  .tb{ position:relative; z-index:1; max-width:900px; margin:0 auto; padding:24px 16px 60px; }
  .tb-head{ text-align:center; margin:8px 0 18px; }
  .tb-eyebrow{ color:var(--pale-gold); font-size:13px; letter-spacing:.18em; text-transform:uppercase; }
  .tb-title{ font-family:var(--font-sans); font-weight:700; font-size:clamp(28px,5vw,40px); color:var(--warm-white); margin:10px 0 6px; }
  .tb-lead{ color:var(--service-primary); font-size:16px; }
  .who-bar{ display:flex; flex-wrap:wrap; justify-content:center; gap:6px 14px; font-size:15px; color:var(--muted-bluegrey); margin-top:10px; }
  .who-bar a{ color:var(--pale-gold); font-weight:600; }
  .tabs{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom:14px; }
  .tabs button{ border:1px solid rgba(244,241,234,.25); background:rgba(244,241,234,.06); color:var(--warm-white); border-radius:999px; padding:10px 16px; font:600 16px var(--font-sans); cursor:pointer; min-height:44px; }
  .tabs button.on{ background:var(--pale-gold); color:#14162e; border-color:var(--pale-gold); }
  .card{ background:var(--card); color:var(--ink); border-radius:24px; padding:22px 24px 26px; box-shadow:0 20px 60px rgba(0,0,0,.35); }
  .card-top{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .card h2{ font-size:24px; font-weight:700; }
  .lang-toggle, .seg{ display:flex; gap:4px; padding:3px; border-radius:999px; border:1px solid var(--line); }
  .lang-toggle button, .seg button{ border:0; background:transparent; color:var(--ink-soft); font:500 15px var(--font-sans); padding:8px 14px; border-radius:999px; cursor:pointer; min-height:40px; }
  .lang-toggle button.active, .seg button.active{ background:rgba(62,53,96,.12); color:var(--ink); font-weight:600; }
  .sub{ color:var(--ink-soft); font-size:15.5px; margin:8px 0 4px; line-height:1.6; }
  .jp, .jp *{ font-family:"Noto Sans JP",sans-serif; }
  ruby rt{ font-size:.5em; color:var(--ink-soft); }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; margin-top:14px; }
  .tap.row{ flex-direction:row; gap:10px; min-height:0; width:100%; padding:12px 14px; }
  .tap{ border:1px solid var(--line); background:#F5F2EC; border-radius:16px; padding:12px 8px; cursor:pointer; color:var(--ink); display:flex; flex-direction:column; align-items:center; gap:3px; min-height:88px; justify-content:center; text-align:center; }
  .tap:hover{ border-color:var(--plum); }
  .tap:focus-visible, .opt:focus-visible{ outline:2px solid var(--plum); outline-offset:3px; }
  .tap .n{ font-size:24px; font-weight:700; }
  .tap .em{ font-size:28px; }
  .tap .j{ font-size:17px; font-weight:600; }
  .tap .alt, .tap .m{ font-size:13px; color:var(--ink-soft); }
  .tap.irr{ background:#FBF1D4; border-color:#E2C877; }
  .tip{ margin-top:14px; padding:10px 14px; border-radius:12px; background:rgba(62,53,96,.07); color:var(--ink-soft); font-size:15px; }
  .row{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:16px; }
  .btn{ border:0; border-radius:999px; background:var(--plum); color:#fff; font:600 16px var(--font-sans); padding:12px 24px; min-height:48px; cursor:pointer; }
  .btn.sec{ background:transparent; color:var(--ink); border:1.5px solid rgba(37,42,69,.3); }
  .quiz{ margin-top:18px; padding:18px; border-radius:18px; background:#F5F2EC; border:1px solid var(--line); text-align:center; }
  .quiz .q{ font-size:40px; font-weight:700; margin:6px 0; }
  .opts{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:12px; }
  .opt{ border:1.5px solid var(--line); background:#fff; border-radius:14px; padding:12px 8px; font-size:18px; cursor:pointer; color:var(--ink); min-height:54px; }
  .opt.ok{ background:#DDEFE5; border-color:var(--good); } .opt.no{ background:#F6DDE2; border-color:var(--bad); opacity:.8; }
  .fb{ min-height:24px; margin-top:10px; font-weight:600; } .fb.ok{ color:var(--good); } .fb.no{ color:var(--bad); }
  .score{ font-size:14px; color:var(--ink-soft); margin-top:6px; }
  .voice-warn{ margin-top:10px; font-size:14px; color:var(--bad); }
  @media (max-width:560px){
    .card{ padding:18px 14px 22px; border-radius:20px; }
    .grid{ grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
    .opts{ grid-template-columns:1fr; }
  }
</style>
<link rel="stylesheet" href="assets/bgm.css">
</head>
<body>
  <div class="stars" aria-hidden="true" data-density="20"></div>
  <main class="tb">
    <header class="tb-head">
      <div class="tb-eyebrow" id="hEyebrow">Extra · Review</div>
      <h1 class="tb-title" id="hTitle">Reference Tables</h1>
      <p class="tb-lead" id="hLead">Tap to hear. Use these any time to review.</p>
      <div class="who-bar" id="who"></div>
      <div class="music-control" data-shared-bgm aria-label="Background music"></div>
    </header>
    <div class="tabs" id="tabs" role="tablist"></div>
    <section class="card" id="card" aria-live="polite"></section>
  </main>

<script src="stars.js"></script>
<script src="data/ja-tables.js"></script>
<script>
/* Extra · 参考表 — numbers, ages, countries, いくつ. No stamps here: it is a place to look things up and review. */
const PARAMS=new URLSearchParams(location.search);
const CODE_KEY="mlStudentCode";
const STUDENT_CODE=(()=>{const clean=v=>(v||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,20);const q=clean(PARAMS.get("s"));if(q){try{localStorage.setItem(CODE_KEY,q)}catch(e){}return q}try{return clean(localStorage.getItem(CODE_KEY))}catch(e){return ""}})();
let lang="en";try{const s=localStorage.getItem("selfIntroLangV1");if(s==="en"||s==="zh")lang=s;else if(/^zh/i.test(navigator.language||""))lang="zh"}catch(e){}
const L=(en,zh)=>lang==="zh"?zh:en;
const $=id=>document.getElementById(id);
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const say=t=>JTSpeak.say(t);
let who=PARAMS.get("adult")==="1"?"adult":"kid";
const TABS=[["numbers","🔢",()=>L("Numbers","数字")],["ages","🎂",()=>L("Ages","年龄")],["countries","🌏",()=>L("Countries","国家")],["tsu","🍎",()=>L("How many","几个")]];
let tab=(location.hash||"").slice(1);if(!TABS.some(t=>t[0]===tab))tab="numbers";
if(STUDENT_CODE)$("who").innerHTML=`<a href="practice.html?s=${encodeURIComponent(STUDENT_CODE)}">← All practice</a>`;

/* a small "quiz me" box under each table */
function quizBox(make){
  const box=el("div","quiz");let score=0,asked=0;
  const next=()=>{box.innerHTML="";const q=make();let first=true;
    box.append(el("div","",L("Quiz me","考考我")),el("div","q"+(q.jp?" jp":""),q.show));
    const os=el("div","opts"),fb=el("div","fb"),sc=el("div","score",`${score} / ${asked}`);
    q.opts.forEach(o=>{const b=el("button","opt jp",q.label?q.label(o):o);b.type="button";b.onclick=()=>{if(o===q.right){os.querySelectorAll("button").forEach(x=>x.disabled=true);b.classList.add("ok");asked++;if(first)score++;sc.textContent=`${score} / ${asked}`;fb.className="fb ok";fb.textContent=L("✓ Correct!","✓ 答对了！");say(q.speak);
      const n=el("button","btn sec",L("Next →","下一题 →"));n.style.marginTop="10px";n.onclick=next;fb.append(document.createElement("br"),n)}
      else{first=false;b.disabled=true;b.classList.add("no");fb.className="fb no";fb.textContent=L("Try again!","再试一次！")}};os.append(b)});
    box.append(os,fb,sc)};
  next();return box;
}
function three(right,pool){return shuffle([right,...shuffle(pool.filter(x=>x!==right)).slice(0,2)])}

const VIEWS={
  numbers(c){
    c.append(el("div","sub",L("0–10, then the tens up to 100. 11–99 are built from these: 35 = さんじゅう + ご.","0〜10，再加上 20〜100 的整十。11〜99 用这些组合：35 ＝ さんじゅう ＋ ご。")));
    const g=el("div","grid");
    JT_NUMBERS.forEach(x=>{const t=el("button","tap",`<span class="n">${x.n}</span><span class="j jp">${jtNum(x.n)}</span>${x.alt?`<span class="alt jp">${L("also","也念")} ${x.alt}</span>`:""}`);t.type="button";t.onclick=()=>say(x.alt?jtNum(x.n)+"、"+x.alt:jtNum(x.n));g.append(t)});
    c.append(g,el("div","tip",L("4, 7, 9 have two readings. For time and counting you will meet し・しち・く later.","4、7、9 有两种念法。以后学时间、数东西时会用到 し・しち・く。")));
    const all=JT_NUMBERS.map(x=>x.n);
    c.append(quizBox(()=>{const n=all[Math.floor(Math.random()*all.length)];const right=jtNum(n);return {show:String(n),right,opts:three(right,all.map(jtNum)),speak:right}}));
  },
  ages(c){
    const seg=el("div","seg");[["kid",L("Child 1–20","小孩 1〜20")],["adult",L("Adult 20–60","大人 20〜60")]].forEach(([v,n])=>{const b=el("button",who===v?"active":"",n);b.type="button";b.onclick=()=>{who=v;render()};seg.append(b)});
    c.append(seg,el("div","sub",L("Yellow = the sound changes. Ages ending in 1, 8, 0 change; 20 is はたち.","黄色＝会变音。尾数 1、8、0 会变音；20 岁是 はたち。")));
    const [a,z]=JT_AGE_RANGE[who],g=el("div","grid");
    for(let n=a;n<=z;n++){const t=el("button","tap"+(jtAgeIrr(n)?" irr":""),`<span class="n">${n}</span><span class="j jp">${jtAge(n)}</span>`);t.type="button";t.onclick=()=>say(jtAge(n));g.append(t)}
    c.append(g);
    c.append(quizBox(()=>{const n=a+Math.floor(Math.random()*(z-a+1)),right=jtAge(n),naive=n===20?"にじゅっさい":jtNum(n)+"さい";
      const near=[n-1,n+1].filter(x=>x>=a&&x<=z).map(jtAge);return {show:n+L(" years old"," 岁"),right,opts:three(right,[naive,...near].filter(x=>x!==right)),speak:right+"です"}}));
  },
  countries(c){
    c.append(el("div","sub",L("Country + じん = a person from that country. Tap to hear.","国家 ＋ じん ＝ 那国人。点一下听发音。")));
    const g=el("div","grid");
    JT_COUNTRIES.forEach(x=>{const t=el("button","tap",`<span class="em">${x[2]}</span><span class="j jp">${jtCountryHTML(x)}</span><span class="m">${L(x[3],x[4])}</span><span class="alt jp">${jtCountryHTML(x)}じん</span>${JT_COUNTRY_ALT[x[0]]?`<span class="alt jp">${L("also","也念")} ${JT_COUNTRY_ALT[x[0]]}</span>`:""}`);t.type="button";t.onclick=()=>say(x[0]+(JT_COUNTRY_ALT[x[0]]?"、"+JT_COUNTRY_ALT[x[0]]:"")+"、"+x[0]+"じん");g.append(t)});
    c.append(g);
    c.append(quizBox(()=>{const x=JT_COUNTRIES[Math.floor(Math.random()*JT_COUNTRIES.length)];return {show:x[2],right:x,opts:three(x,JT_COUNTRIES),label:o=>jtCountryHTML(o)+"じん",speak:x[0]+"じん"}}));
  },
  tsu(c){
    c.append(el("div","sub",L("Counting things 1–10 (apples, sweets…). いくつですか？ = How many?","数东西 1〜10（苹果、糖果……）。いくつですか？＝有几个？")));
    const ask=el("button","tap row",`<span class="em">🔊</span><span class="j jp">これは いくつですか。</span><span class="m">${L("How many are these?","这是几个？")}</span>`);ask.type="button";ask.style.marginBottom="12px";ask.onclick=()=>say("これはいくつですか");c.append(ask);
    const g=el("div","grid");
    for(let n=1;n<=10;n++){const t=el("button","tap",`<span class="n">${n}</span><span class="j jp">${JT_TSU[n]}</span><span class="m">${"🍎".repeat(Math.min(n,5))}${n>5?"…":""}</span>`);t.type="button";t.onclick=()=>say(JT_TSU[n]);g.append(t)}
    c.append(g,el("div","tip",L("More counters (まい・ほん…) will be added when we learn them.","其他量词（まい・ほん……）学到时再加进来。")));
    c.append(quizBox(()=>{const n=1+Math.floor(Math.random()*10),right=JT_TSU[n];return {show:"🍎".repeat(n),right,opts:three(right,JT_TSU.slice(1)),speak:right}}));
  }
};
function render(){
  document.documentElement.lang=lang==="zh"?"zh-Hans":"en";
  $("hEyebrow").textContent=L("Extra · Review","额外练习 · 复习");$("hTitle").textContent=L("Reference Tables","参考表");$("hLead").textContent=L("Tap to hear. Use these any time to review.","点一下就能听。随时都可以来这里复习。");
  const tabs=$("tabs");tabs.innerHTML="";
  TABS.forEach(([id,ic,name])=>{const b=el("button",id===tab?"on":"",`${ic} ${name()}`);b.type="button";b.setAttribute("role","tab");b.setAttribute("aria-selected",id===tab);b.onclick=()=>{tab=id;history.replaceState(null,"",location.search+"#"+id);render()};tabs.append(b)});
  const c=$("card");c.innerHTML="";
  const top=el("div","card-top"),t=TABS.find(x=>x[0]===tab);top.append(el("h2","",`${t[1]} ${t[2]()}`));
  const tg=el("div","lang-toggle");[["en","English"],["zh","中文"]].forEach(([v,n])=>{const b=el("button",lang===v?"active":"",n);b.type="button";b.onclick=()=>{lang=v;try{localStorage.setItem("selfIntroLangV1",v)}catch(e){}render()};tg.append(b)});
  top.append(tg);c.append(top);
  VIEWS[tab](c);
  if(tab==="numbers"&&!(JTSpeak.supported()&&JTSpeak.hasVoice()))c.append(el("div","voice-warn",L("🔇 If you hear nothing: this device has no Japanese voice. Try another browser or phone.","🔇 如果听不到声音：这台装置没有日文语音，可以换浏览器或手机试试。")));
}
render();
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)){tab=h;render()}});
</script>
<script src="assets/bgm.js"></script>
</body>
</html>
