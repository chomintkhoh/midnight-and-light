<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Japanese Clock Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
/* ══════════════════════════════════════════════
   Matches the established Midnight & Light cosmic
   palette — if a shared cosmic.css already exists on
   the live site, these tokens can be swapped for a
   <link> to it instead of duplicating them here.
══════════════════════════════════════════════ */
:root{
  --bg-deep:#0C0E22; --bg-glow:#1B1E45; --warm-white:#F4F1EA;
  --muted-bluegrey:#8B8FB3; --pale-gold:#D9C48E; --soft-lavender:#B6A9DA;
  --good:#7FBF8F; --bad:#E0879A;
  --font-body:'Inter',sans-serif; --font-cjk:'Zen Kaku Gothic New',sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; background:radial-gradient(ellipse at top, var(--bg-glow), var(--bg-deep));
  color:var(--warm-white); font-family:var(--font-body); display:flex; justify-content:center;
}
#app{ width:100%; max-width:460px; padding:24px 20px 60px; }
.card{
  background:rgba(244,241,234,0.05); border:1px solid rgba(217,196,142,0.25);
  border-radius:18px; padding:22px; margin-top:16px;
}
h1{ font-size:22px; margin:8px 0 4px; }
.subtitle{ color:var(--muted-bluegrey); font-size:14px; margin-bottom:20px; }
.mode-grid{ display:grid; gap:10px; }
.mode-btn{
  background:rgba(182,169,218,0.08); border:1px solid rgba(182,169,218,0.3); color:var(--warm-white);
  border-radius:12px; padding:14px 16px; font-size:16px; text-align:left; cursor:pointer; font-family:inherit;
}
.mode-btn:hover{ background:rgba(182,169,218,0.18); }
.progress{ font-size:13px; color:var(--muted-bluegrey); text-align:center; margin-bottom:10px; }
.prompt{ font-size:18px; text-align:center; font-family:var(--font-cjk); margin-bottom:16px; }
.jp-display{ font-size:30px; text-align:center; font-family:var(--font-cjk); margin:18px 0; color:var(--pale-gold); }
.clock-wrap{ display:flex; justify-content:center; margin:14px 0; touch-action:none; }
input.answer-input{
  width:100%; padding:14px; border-radius:12px; border:1.5px solid rgba(217,196,142,0.35);
  background:rgba(0,0,0,0.2); color:var(--warm-white); font-size:18px; font-family:var(--font-cjk);
  text-align:center; margin-top:8px;
}
input.answer-input:focus{ outline:none; border-color:var(--pale-gold); }
.btn-primary{
  width:100%; padding:14px; border-radius:12px; border:none; margin-top:16px;
  background:var(--pale-gold); color:var(--bg-deep); font-size:16px; font-weight:700; cursor:pointer; font-family:inherit;
}
.btn-primary:disabled{ opacity:.4; cursor:not-allowed; }
.feedback{ text-align:center; margin-top:16px; padding:14px; border-radius:12px; font-family:var(--font-cjk); font-size:18px; }
.feedback.correct{ background:rgba(127,191,143,0.15); color:var(--good); }
.feedback.incorrect{ background:rgba(224,135,154,0.15); color:var(--bad); }
.feedback .answer-line{ font-size:15px; color:var(--warm-white); margin-top:6px; font-family:var(--font-cjk); }
.score-hero{ text-align:center; padding:20px 0; }
.score-hero .big{ font-size:44px; font-weight:800; color:var(--pale-gold); }
.hand-selector{ display:flex; gap:8px; justify-content:center; margin-bottom:10px; }
.hand-btn{
  padding:8px 16px; border-radius:99px; border:1.5px solid rgba(217,196,142,0.3);
  background:transparent; color:var(--warm-white); font-family:inherit; cursor:pointer; font-size:14px;
}
.hand-btn.active{ background:var(--pale-gold); color:var(--bg-deep); border-color:var(--pale-gold); font-weight:700; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="clock-app.js"></script>
</body>
</html>
